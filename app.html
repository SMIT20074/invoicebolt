<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>InvoiceBolt — Free GST Invoice Maker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF6B35">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
[data-theme="light"]{--bg:#f5f5fa;--bg2:#fff;--card:#fff;--card2:#f0f0f8;--dk:#0f0f13;--dk3:#334155;--gy:#64748b;--gy2:#94a3b8;--gy3:#cbd5e1;--gy4:#e2e8f0;--gy5:#f8fafc;--gy6:#f1f5f9;--bd:#e2e8f0;--txt:#0f0f13;--txt2:#64748b;--txt3:#94a3b8;}
[data-theme="dark"]{--bg:#0a0a0f;--bg2:#111118;--card:#13131f;--card2:#1e1e2e;--dk:#f8fafc;--dk3:#cbd5e1;--gy:#94a3b8;--gy2:#64748b;--gy3:#475569;--gy4:#334155;--gy5:#1e293b;--gy6:#0f172a;--bd:rgba(255,255,255,.08);--txt:#f1f5f9;--txt2:#94a3b8;--txt3:#64748b;}
:root{--or:#FF6B35;--or2:#e85a20;--orl:rgba(255,107,53,.08);--orb:rgba(255,107,53,.2);--gn:#10b981;--gnl:rgba(16,185,129,.08);--rd:#ef4444;--rdl:rgba(239,68,68,.08);--bl:#3b82f6;--bll:rgba(59,130,246,.08);--pu:#8b5cf6;--yl:#f59e0b;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-2xl:24px;--r:10px;--sh-sm:0 2px 8px rgba(0,0,0,.08);--sh-md:0 4px 16px rgba(0,0,0,.1);--sh-lg:0 8px 30px rgba(0,0,0,.12);--sh-xl:0 20px 60px rgba(0,0,0,.15);}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);overflow-x:hidden;line-height:1.6;transition:background .25s,color .25s;}
::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-thumb{background:var(--gy3);border-radius:10px;}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes boltDance{0%,100%{transform:rotate(-5deg) scale(1)}25%{transform:rotate(5deg) scale(1.1)}50%{transform:rotate(-3deg) scale(1.05)}75%{transform:rotate(3deg) scale(1.08)}}
@keyframes glow{0%,100%{box-shadow:0 0 10px rgba(255,107,53,.3)}50%{box-shadow:0 0 25px rgba(255,107,53,.6)}}
.fu{animation:slideUp .3s ease both;}
.app-wrap{display:flex;min-height:100vh;}
.sb{width:220px;background:#0d1117;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto;transition:width .25s;}
.sb.mini{width:58px;}
.sb-logo{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid rgba(255,255,255,.06);min-height:60px;overflow:hidden;}
.sb-logo-icon{width:32px;height:32px;background:var(--or);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;animation:glow 3s ease infinite;}
.sb-logo-text{font-family:'Syne',sans-serif;font-weight:900;font-size:15px;color:white;white-space:nowrap;}
.sb-logo-text span{color:var(--or);}
.sb-section{padding:12px 10px 4px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#4b5563;white-space:nowrap;}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:1px 6px;border-radius:8px;cursor:pointer;transition:all .15s;color:#8b949e;font-size:13px;font-weight:500;white-space:nowrap;position:relative;user-select:none;}
.sb-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85);}
.sb-item.act{background:rgba(255,107,53,.15);color:var(--or);font-weight:700;}
.sb-item.act::before{content:"";position:absolute;left:0;top:25%;bottom:25%;width:3px;background:var(--or);border-radius:0 3px 3px 0;}
.sb-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center;}
.sb-badge{margin-left:auto;background:var(--rd);color:white;font-size:9px;font-weight:700;padding:1px 5px;border-radius:100px;}
.sb-footer{margin-top:auto;padding:10px;border-top:1px solid rgba(255,255,255,.06);}
.sb-mini-btn{width:100%;padding:8px;background:transparent;border:1px solid rgba(255,255,255,.08);border-radius:8px;color:#4b5563;cursor:pointer;font-size:13px;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;}
.sb-mini-btn:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);}
.main{flex:1;margin-left:220px;display:flex;flex-direction:column;min-height:100vh;transition:margin-left .25s;}
.main.wide{margin-left:58px;}
.topbar{background:var(--card);border-bottom:1px solid var(--bd);padding:0 20px;height:58px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:90;overflow-x:auto;}
.topbar::-webkit-scrollbar{height:0;}
.topbar-title{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:var(--txt);white-space:nowrap;margin-right:4px;}
.topbar-sep{width:1px;height:22px;background:var(--bd);flex-shrink:0;margin:0 4px;}.topbar-sep.hide-mob{display:flex;}@media(max-width:768px){.topbar-sep.hide-mob{display:none;}.hide-mob{display:none!important;}}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.content{padding:20px;flex:1;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--r-sm);cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;transition:all .18s;white-space:nowrap;user-select:none;}
.btn-primary{background:var(--or);color:white;box-shadow:0 3px 12px rgba(255,107,53,.3);}
.btn-primary:hover{background:var(--or2);transform:translateY(-1px);}
.btn-ghost{background:var(--card2);color:var(--txt2);border:1px solid var(--bd);}
.btn-ghost:hover{border-color:var(--or);color:var(--or);}
.btn-danger{background:var(--rdl);color:var(--rd);border:1px solid rgba(239,68,68,.2);}
.btn-danger:hover{background:var(--rd);color:white;}
.btn-success{background:var(--gnl);color:var(--gn);border:1px solid rgba(16,185,129,.2);}
.btn-success:hover{background:var(--gn);color:white;}
.btn-sm{padding:6px 12px;font-size:12.5px;}
.btn-md{padding:9px 16px;font-size:13.5px;}
.btn-lg{padding:12px 22px;font-size:15px;}
.inp{width:100%;padding:9px 12px;border:1.5px solid var(--bd);border-radius:var(--r-sm);font-size:13.5px;font-family:'Inter',sans-serif;color:var(--txt);background:var(--card);outline:none;transition:border-color .15s;}
.inp:focus{border-color:var(--or);}
.inp::placeholder{color:var(--txt3);}
.sel{width:100%;padding:9px 12px;border:1.5px solid var(--bd);border-radius:var(--r-sm);font-size:13.5px;font-family:'Inter',sans-serif;color:var(--txt);background:var(--card);outline:none;cursor:pointer;}
.sel:focus{border-color:var(--or);}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-lg);overflow:hidden;}
.card-pad{padding:18px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px;}
.stat-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-lg);padding:18px 20px;position:relative;overflow:hidden;transition:all .2s;}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--sh-md);}
.sc-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--txt3);margin-bottom:8px;}
.sc-value{font-family:'Syne',sans-serif;font-size:24px;font-weight:900;letter-spacing:-1px;line-height:1;margin-bottom:4px;color:var(--txt);}
.sc-sub{font-size:12px;color:var(--txt3);}
.sc-icon{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:700;}
.pill-paid{background:var(--gnl);color:var(--gn);border:1px solid rgba(16,185,129,.2);}
.pill-unpaid{background:var(--bll);color:var(--bl);border:1px solid rgba(59,130,246,.2);}
.pill-overdue{background:var(--rdl);color:var(--rd);border:1px solid rgba(239,68,68,.2);}
.pill-draft{background:var(--gy5);color:var(--txt3);border:1px solid var(--bd);}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px);}
.modal{background:var(--card);border-radius:var(--r-2xl);width:100%;box-shadow:var(--sh-xl);animation:slideUp .22s ease;overflow:hidden;}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--bd);}
.modal-title{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;color:var(--txt);}
.modal-body{padding:20px 22px;}
.modal-close{width:28px;height:28px;border-radius:50%;background:var(--gy5);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--txt2);}
.modal-close:hover{background:var(--rdl);color:var(--rd);}
.toast-wrap{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:999;pointer-events:none;}
.toast{padding:10px 18px;border-radius:100px;font-size:13px;font-weight:600;color:white;box-shadow:var(--sh-lg);animation:slideUp .25s ease;white-space:nowrap;}
.toast-s{background:#10b981;}.toast-e{background:#ef4444;}.toast-i{background:#0f1629;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{padding:10px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--txt3);text-align:left;border-bottom:2px solid var(--bd);background:var(--gy5);}
.tbl td{padding:11px 14px;font-size:13.5px;border-bottom:1px solid var(--bd);color:var(--txt);}
.tbl tr:hover td{background:var(--orl);}
.tbl tr:last-child td{border-bottom:none;}
.tg{position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0;}
.tg input{opacity:0;width:0;height:0;}
.tgl{position:absolute;cursor:pointer;inset:0;background:var(--gy3);border-radius:100px;transition:.2s;}
.tgl::before{content:"";position:absolute;width:14px;height:14px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.2s;}
.tg input:checked+.tgl{background:var(--or);}
.tg input:checked+.tgl::before{transform:translateX(16px);}
.bolt-mascot{display:flex;flex-direction:column;align-items:center;gap:6px;}
.bolt-bubble{background:var(--or);color:white;padding:10px 16px;border-radius:16px 16px 16px 4px;font-size:14px;font-weight:600;max-width:240px;text-align:center;line-height:1.5;}
.confetti-piece{position:fixed;width:8px;height:8px;border-radius:2px;z-index:9999;pointer-events:none;animation:confetti 2.5s ease forwards;}
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);z-index:200;padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 4px);}
.mob-nav-inner{display:flex;justify-content:space-around;align-items:flex-end;}
.mob-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 10px;cursor:pointer;color:var(--txt3);font-size:10px;font-weight:600;transition:color .15s;}
.mob-nav-item.act{color:var(--or);}
.mob-fab{width:46px;height:46px;border-radius:50%;background:var(--or);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 16px rgba(255,107,53,.45);margin-bottom:4px;}
.frow{display:grid;gap:12px;margin-bottom:14px;}
.frow-2{grid-template-columns:1fr 1fr;}
.frow-3{grid-template-columns:1fr 1fr 1fr;}
.flabel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--txt3);margin-bottom:5px;display:block;}
.ob-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px);}
.ob-sheet{background:var(--card);border-radius:28px 28px 0 0;padding:28px 24px 40px;width:100%;max-width:480px;animation:slideUp .3s ease;}
.ob-handle{width:36px;height:4px;background:var(--bd);border-radius:4px;margin:0 auto 22px;}
.ob-dots{display:flex;gap:6px;margin-bottom:24px;}
.ob-dot{height:3px;flex:1;border-radius:100px;background:var(--bd);transition:background .3s;}
.ob-dot.on{background:var(--or);}
@media(max-width:768px){
  .sb{display:none!important;}
  .main{margin-left:0!important;}
  .topbar{padding:0 10px;height:52px;gap:5px;}
  .topbar-title{font-size:14px;}
  .content{padding:12px;padding-bottom:84px;}
  .mob-nav{display:block;}
  .frow-2,.frow-3{grid-template-columns:1fr;}
  .stat-grid{grid-template-columns:1fr 1fr;}
  .modal{border-radius:24px 24px 0 0 !important;position:fixed !important;bottom:0 !important;left:0 !important;right:0 !important;max-width:100% !important;max-height:92vh !important;overflow-y:auto !important;}
  .modal-ov{align-items:flex-end !important;padding:0 !important;}
  .tbl{font-size:12px;}
  .tbl th,.tbl td{padding:8px 8px;}
  .btn-lg{padding:14px 20px;font-size:15px;}
  .card-pad{padding:14px;}
  .btn,.inp,.sel{min-height:44px;}
  .btn-sm{min-height:36px;}
  .mob-fab{width:50px;height:50px;}
  .mob-nav{height:62px;}
  .mob-nav-item{font-size:10.5px;}
  .sc-value{font-size:20px;}
}
@media(max-width:400px){
  .stat-grid{grid-template-columns:1fr 1fr;}
  .topbar-title{display:none;}
  .content{padding:10px;padding-bottom:84px;}
}
</style>

<body data-theme="light">
<div id="root"></div>
<script>
function buildHTML(inv,tpl,df){
  tpl=tpl||"Classic";df=df||"DD/MM/YYYY";
  var t=inv.total||0;
  var fromN=inv.from?inv.from.name||"Your Business":"Your Business";
  var toN=inv.to?inv.to.name||"Client":"Client";
  var styles="*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;}body{padding:32px;color:#111;}";
  styles+=".inv{max-width:800px;margin:0 auto;}.hdr{display:flex;justify-content:space-between;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid #FF6B35;}";
  styles+=".biz{font-size:20px;font-weight:900;color:#FF6B35;}.inv-no{font-size:13px;color:#666;}.section{margin-bottom:16px;}";
  styles+=".label{font-size:10px;font-weight:700;text-transform:uppercase;color:#999;margin-bottom:4px;}.value{font-size:14px;font-weight:600;}";
  styles+="table{width:100%;border-collapse:collapse;margin:16px 0;}th{background:#FF6B35;color:white;padding:10px;font-size:12px;text-align:left;}";
  styles+="td{padding:9px 10px;border-bottom:1px solid #eee;font-size:13px;}.total-row{background:#fff4ef;font-weight:700;font-size:15px;}";
  styles+=".grand{background:#FF6B35;color:white;font-weight:900;font-size:17px;}.footer{margin-top:24px;padding-top:16px;border-top:1px solid #eee;font-size:12px;color:#999;}";
  
  var rows="";
  (inv.items||[]).forEach(function(it){
    var base=(+it.qty||0)*(+it.rate||0);
    var disc=base*(+it.disc||0)/100;
    var net=base-disc;
    var tax=net*((+it.cgst||0)+(+it.sgst||0)+(+it.igst||0))/100;
    rows+="<tr><td>"+it.desc+"</td><td>"+it.qty+" "+it.unit+"</td><td>&#8377;"+it.rate+"</td>";
    rows+="<td>"+((+it.cgst||0)+(+it.sgst||0)+(+it.igst||0))+"%</td><td>&#8377;"+(net+tax).toFixed(2)+"</td></tr>";
  });
  
  var html="<!DOCTYPE html><html><head><meta charset=UTF-8>";
  html+="<title>"+inv.number+"</title>";
  html+="<style>"+styles+"</style></head><body><div class=inv>";
  html+="<div class=hdr><div><div class=biz>"+fromN+"</div>";
  if(inv.from&&inv.from.gstin)html+="<div style=font-size:12px;color:#666;>GSTIN: "+inv.from.gstin+"</div>";
  html+="</div><div style=text-align:right;><div style=font-size:22px;font-weight:900;color:#FF6B35;>"+inv.type.toUpperCase()+"</div>";
  html+="<div class=inv-no>#"+inv.number+"</div>";
  html+="<div style=font-size:12px;color:#666;>Date: "+inv.date+"</div></div></div>";
  html+="<div style=display:flex;gap:32px;margin-bottom:16px;>";
  html+="<div class=section><div class=label>From</div><div class=value>"+fromN+"</div>";
  if(inv.from&&inv.from.address)html+="<div style=font-size:12px;color:#666;>"+inv.from.address+"</div>";
  html+="</div><div class=section><div class=label>To</div><div class=value>"+toN+"</div>";
  if(inv.to&&inv.to.address)html+="<div style=font-size:12px;color:#666;>"+inv.to.address+"</div>";
  if(inv.to&&inv.to.gstin)html+="<div style=font-size:12px;color:#666;>GSTIN: "+inv.to.gstin+"</div>";
  html+="</div></div>";
  html+="<table><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Tax</th><th>Amount</th></tr></thead>";
  html+="<tbody>"+rows+"</tbody></table>";
  html+="<div style=max-width:280px;margin-left:auto;>";
  html+="<div class=total-row style=padding:8px;display:flex;justify-content:space-between;><span>Total</span><span>&#8377;"+(t).toFixed(2)+"</span></div>";
  html+="</div>";
  if(inv.upi)html+="<div class=footer>UPI: "+inv.upi+"</div>";
  if(inv.footer)html+="<div class=footer>"+inv.footer+"</div>";
  html+="</div></body></html>";
  return html;
}
</script>
<script type="text/babel">

const {useState,useEffect,useRef,useCallback}=React;
const UID=()=>Math.random().toString(36).slice(2,10);
const TD=()=>new Date().toISOString().slice(0,10);
const AD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);};
const FD=(d,fmt)=>{if(!d)return'';const[y,m,dd]=d.split('-');if(!dd)return d;if(fmt==='MM/DD/YYYY')return m+'/'+dd+'/'+y;if(fmt==='YYYY-MM-DD')return d;return dd+'/'+m+'/'+y;};
const INI=n=>(n||'').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)||'??';
const CURRENCIES=['INR','USD','EUR','GBP','AED','SGD','AUD','CAD','JPY'];
const CURR_SYM={INR:'₹',USD:'$',EUR:'€',GBP:'£',AED:'AED ',SGD:'S$',AUD:'A$',CAD:'C$',JPY:'¥'};
const INR=(n,cur)=>{const sym=CURR_SYM[cur||'INR']||((cur||'INR')+' ');return sym+(parseFloat(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});};
const GST_SLABS=[0,0.25,1,3,5,6,7.5,12,18,28];
const DOC_TYPES=['invoice','estimate','proforma','delivery','po','credit','debit'];
const DOC_LABELS={invoice:'Tax Invoice',estimate:'Estimate',proforma:'Proforma Invoice',delivery:'Delivery Note',po:'Purchase Order',credit:'Credit Note',debit:'Debit Note'};
const TEMPLATES=['Classic','Modern','Minimal','Saffron','Corporate','Royal','Emerald','Crimson'];
const STATES=['Andhra Pradesh','Assam','Bihar','Delhi','Goa','Gujarat','Haryana','Karnataka','Kerala','Madhya Pradesh','Maharashtra','Odisha','Punjab','Rajasthan','Tamil Nadu','Telangana','Uttar Pradesh','West Bengal'];
const EXP_CATS=['Office','Travel','Software','Salary','Marketing','GST Paid','Rent','Equipment','Utilities','Other'];
const LS={invs:'ib_invs',clis:'ib_clis',prods:'ib_prods',exps:'ib_exps',sets:'ib_sets',tpl:'ib_tpl',theme:'ib_theme',ob:'ib_ob'};
const ls=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};
const calcT=items=>{let sub=0,cg=0,sg=0,ig=0;(items||[]).forEach(it=>{const q=+it.qty||0,r=+it.rate||0,d=+it.disc||0,base=q*r,disc=base*d/100,net=base-disc;sub+=net;cg+=net*(+it.cgst||0)/100;sg+=net*(+it.sgst||0)/100;ig+=net*(+it.igst||0)/100;});return{sub,cg,sg,ig,tax:cg+sg+ig,grand:sub+cg+sg+ig};};

const Btn=({v='ghost',sz='md',children,style,...p})=><button className={`btn btn-${v} btn-${sz}`} style={style} {...p}>{children}</button>;
const Inp=({style,...p})=><input className="inp" style={style} {...p}/>;
const Sl=({children,style,...p})=><select className="sel" style={style} {...p}>{children}</select>;

function Toast({ts}){
  if(!ts.msg)return null;
  return <div className="toast-wrap"><div className={`toast toast-${ts.type==='success'?'s':ts.type==='error'?'e':'i'}`}>{ts.msg}</div></div>;
}

function Confetti({on}){
  if(!on)return null;
  const colors=['#FF6B35','#10b981','#3b82f6','#f59e0b','#8b5cf6'];
  return <>{Array.from({length:20}).map((_,i)=><div key={i} className="confetti-piece" style={{left:Math.random()*100+'vw',top:'-10px',background:colors[i%5],animationDelay:Math.random()+'s'}}/>)}</>;
}

function GSTCalc({onClose}){
  const[amt,setAmt]=useState('');const[rate,setRate]=useState(18);const[incl,setIncl]=useState(false);
  const base=incl?parseFloat(amt||0)/(1+rate/100):parseFloat(amt||0);
  const tax=base*rate/100,cgst=tax/2,total=base+tax;
  return(
    <div className="modal-ov" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal" style={{maxWidth:380}}>
        <div className="modal-hdr"><div className="modal-title">🧮 GST Calculator</div><button className="modal-close" onClick={onClose}>✕</button></div>
        <div className="modal-body">
          <div style={{marginBottom:12}}><Label>Amount</Label><Inp type="number" value={amt} onChange={e=>setAmt(e.target.value)} placeholder="Enter amount…" style={{fontSize:17,fontWeight:700}}/></div>
          <div className="frow frow-2" style={{marginBottom:12}}>
            <div><Label>GST Rate</Label><Sl value={rate} onChange={e=>setRate(+e.target.value)}>{GST_SLABS.map(r=><option key={r} value={r}>{r}%</option>)}</Sl></div>
            <div style={{display:'flex',alignItems:'flex-end',paddingBottom:2}}><label style={{display:'flex',alignItems:'center',gap:7,cursor:'pointer',fontSize:13,color:'var(--txt)'}}><label className="tg"><input type="checkbox" checked={incl} onChange={e=>setIncl(e.target.checked)}/><span className="tgl"/></label>Inclusive</label></div>
          </div>
          {amt>0&&<div style={{background:'var(--gy5)',borderRadius:'var(--r-md)',padding:14,marginBottom:12}}>
            {[['Base',INR(base)],['CGST '+(rate/2)+'%',INR(cgst)],['SGST '+(rate/2)+'%',INR(cgst)],['Total GST',INR(tax)]].map(([l,v])=><div key={l} style={{display:'flex',justifyContent:'space-between',padding:'5px 0',fontSize:13,borderBottom:'1px solid var(--bd)'}}><span style={{color:'var(--txt2)'}}>{l}</span><span style={{fontWeight:600,color:'var(--txt)'}}>{v}</span></div>)}

        </div>
      </div>
    </div>
  );
}

function AIAgent({onClose,biz,clis,invs,toast,onGen}){
  const[msgs,setMsgs]=useState([{r:'b',t:'Namaste! 🙏 Main BoltBot hoon — aapka AI invoice agent.\n\nKya banana hai aaj?'}]);
  const[inp,setInp]=useState('');const[loading,setLoading]=useState(false);
  const[listening,setListening]=useState(false);
  const ref=useRef();
  useEffect(()=>{if(ref.current)ref.current.scrollTop=ref.current.scrollHeight;},[msgs]);
  const send=async txt=>{
    const q=txt||inp;if(!q.trim())return;
    setInp('');setMsgs(p=>[...p,{r:'u',t:q}]);setLoading(true);
    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:600,
        system:`You are BoltBot, AI invoice assistant for InvoiceBolt. Understand Hindi, English, Hinglish.
Business: ${biz.name}, Currency: ${biz.currency||'INR'}
Clients: ${JSON.stringify(clis.slice(0,15).map(c=>({name:c.name,gstin:c.gstin})))}
Recent invoices: ${invs.length}, Unpaid: ${invs.filter(i=>i.status!=='paid').length}
When user wants to CREATE invoice, respond with JSON at end: {"action":"create","client":"X","amount":0,"desc":"X","gst":18}
Be warm, use emojis, mix Hindi/English naturally.`,
        messages:[...msgs.slice(-5).map(m=>({role:m.r==='u'?'user':'assistant',content:m.t})),{role:'user',content:q}]
      })});
      const d=await res.json();
      const raw=d.content?.[0]?.text||'Sorry, try again!';
      const jm=raw.match(/\{\"action\"[\s\S]*?\}/);
      setMsgs(p=>[...p,{r:'b',t:raw.replace(/\{\"action\"[\s\S]*?\}/,'').trim()||raw}]);
      if(jm){try{
        const act=JSON.parse(jm[0]);
        if(act.action==='create'){
          const cli=clis.find(c=>c.name.toLowerCase().includes((act.client||'').toLowerCase()));
          const nums=invs.map(i=>parseInt((i.number||'').replace(/\D/g,''))||0);
          const nxt=(biz.prefix||'INV')+'-'+String((nums.length?Math.max(...nums):0)+1).padStart(3,'0');
          const base=parseFloat(act.amount)||0,g=(act.gst||18)/2;
          const inv={id:UID(),number:nxt,type:'invoice',date:TD(),due:AD(TD(),30),status:'unpaid',currency:biz.currency||'INR',createdAt:Date.now(),
            from:{name:biz.name,gstin:biz.gstin,phone:biz.phone,email:biz.email,address:biz.address},
            to:{name:cli?.name||act.client||'Client',email:cli?.email||'',phone:cli?.phone||'',address:cli?.address||'',gstin:cli?.gstin||''},
            items:[{id:UID(),desc:act.desc||'Services',qty:1,rate:base,unit:'pcs',hsn:'',cgst:g,sgst:g,igst:0,disc:0}],
            notes:biz.defaultNotes||'',footer:biz.footer||'Thank you!',bankName:biz.bankName||'',bankAcc:biz.bankAcc||'',bankIFSC:biz.bankIFSC||'',upi:biz.upi||'',logo:biz.logo||'',signature:biz.signature||'',po:'',paid:0};
          onGen(inv);
          setTimeout(()=>setMsgs(p=>[...p,{r:'b',t:'✅ Invoice '+nxt+' editor mein ready hai! Check karo 🚀'}]),600);
        }
      }catch{}}
    }catch{setMsgs(p=>[...p,{r:'b',t:'Network error. Try again. 🔄'}]);}
    setLoading(false);
  };
  const voice=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){toast('Voice not supported','error');return;}
    const r=new SR();r.lang='hi-IN';r.interimResults=false;
    setListening(true);
    r.onresult=e=>{setListening(false);send(e.results[0][0].transcript);};
    r.onerror=()=>{setListening(false);toast('Voice error','error');};
    r.onend=()=>setListening(false);
    r.start();
  };
  return(
    <div className="modal-ov" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal" style={{maxWidth:500,height:'82vh',display:'flex',flexDirection:'column'}}>
        <div style={{background:'#0d1117',padding:'16px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:34,height:34,borderRadius:'50%',background:'var(--or)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16}}>⚡</div>
            <div><div style={{color:'white',fontWeight:700,fontSize:14}}>BoltBot AI Agent</div><div style={{color:'rgba(255,255,255,.4)',fontSize:11}}>Hindi · English · Hinglish + Voice</div></div>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <div style={{display:'flex',gap:4,alignItems:'center',fontSize:12,color:'#10b981'}}><div style={{width:6,height:6,borderRadius:'50%',background:'#10b981'}}/>Live</div>
            <button onClick={onClose} style={{background:'rgba(255,255,255,.1)',border:'none',color:'white',width:28,height:28,borderRadius:'50%',cursor:'pointer',fontSize:14}}>✕</button>
          </div>
        </div>
        <div ref={ref} style={{flex:1,overflowY:'auto',padding:14,background:'#0a0a14',display:'flex',flexDirection:'column',gap:8}}>
          {msgs.map((m,i)=><div key={i} style={{maxWidth:'88%',padding:'10px 13px',borderRadius:m.r==='u'?'13px 13px 3px 13px':'13px 13px 13px 3px',background:m.r==='u'?'var(--or)':'#1e2640',color:m.r==='u'?'white':'rgba(255,255,255,.88)',alignSelf:m.r==='u'?'flex-end':'flex-start',fontSize:13.5,lineHeight:1.65,whiteSpace:'pre-wrap'}}>{m.t}</div>)}
          {loading&&<div style={{display:'flex',gap:4,background:'#1e2640',padding:'10px 13px',borderRadius:13,width:'fit-content'}}>
            {[0,.2,.4].map(d=><div key={d} style={{width:6,height:6,borderRadius:'50%',background:'rgba(255,255,255,.3)',animation:'bounce .9s ease infinite',animationDelay:d+'s'}}/>)}
          </div>}
        </div>
        <div style={{padding:10,background:'#0a0a14',borderTop:'1px solid rgba(255,255,255,.05)',display:'flex',gap:7}}>
          <button onClick={voice} style={{width:38,height:38,borderRadius:'50%',background:listening?'#ef4444':'var(--or)',border:'none',cursor:'pointer',fontSize:16,flexShrink:0}}>🎤</button>
          <input value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder="Kuch bhi poochho…" style={{flex:1,background:'#1e2640',border:'1px solid rgba(255,255,255,.06)',borderRadius:10,padding:'10px 13px',color:'rgba(255,255,255,.7)',fontSize:13,fontFamily:'Inter,sans-serif',outline:'none'}}/>
          <button onClick={()=>send()} style={{width:38,height:38,borderRadius:10,background:'#1e2640',border:'1px solid rgba(255,255,255,.08)',cursor:'pointer',fontSize:14,color:'rgba(255,255,255,.5)'}}>➤</button>
        </div>
      </div>
    </div>
  );
}

function InvList({docs,label,onNew,onEdit,onDel,onPaid,onPrint,biz,type}){
  const[q,setQ]=useState('');const[filt,setFilt]=useState('all');
  const today=TD();
  const rows=docs.filter(d=>{
    const mq=!q||d.number?.toLowerCase().includes(q.toLowerCase())||d.to?.name?.toLowerCase().includes(q.toLowerCase());
    const st=d.status==='paid'?'paid':d.due&&d.due<today?'overdue':'unpaid';
    return mq&&(filt==='all'||st===filt);
  });
  const od=docs.filter(d=>d.status!=='paid'&&d.due&&d.due<today).length;
  return(
    <div className="fu">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14,flexWrap:'wrap',gap:8}}>
        <div><div style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:18,color:'var(--txt)'}}>{label}</div><div style={{fontSize:12.5,color:'var(--txt3)'}}>{docs.length} total{od>0?' · '+od+' overdue':''}</div></div>
        <Btn v="primary" sz="md" onClick={()=>onNew(type||'invoice')}>+ New</Btn>
      </div>
      <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap'}}>
        <Inp value={q} onChange={e=>setQ(e.target.value)} placeholder="Search…" style={{flex:1,minWidth:160}}/>
        <Sl value={filt} onChange={e=>setFilt(e.target.value)} style={{width:'auto'}}>
          {['all','unpaid','paid','overdue'].map(f=><option key={f} value={f}>{f.charAt(0).toUpperCase()+f.slice(1)}</option>)}
        </Sl>
      </div>
      {!rows.length?<Card><div style={{textAlign:'center',padding:'40px 24px'}}><div style={{fontSize:38,marginBottom:10}}>⚡</div><div style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:16,color:'var(--txt)',marginBottom:6}}>No {label} yet</div><Btn v="primary" sz="md" style={{marginTop:8}} onClick={()=>onNew(type||'invoice')}>+ Create Now</Btn></div></Card>:(
        <div>
          {rows.map(d=>{
            const t=calcT(d.items);
            const od2=d.status!=='paid'&&d.due&&d.due<today;
            const st=d.status==='paid'?'paid':od2?'overdue':'unpaid';
            return<div key={d.id} className="card card-pad" style={{marginBottom:10,cursor:'pointer',transition:'all .2s'}}
              onClick={()=>onEdit(d)}
              onMouseEnter={e=>e.currentTarget.style.borderColor='var(--or)'}
              onMouseLeave={e=>e.currentTarget.style.borderColor='var(--bd)'}>
              <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:10}}>
                <div>
                  <div style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:14,color:'var(--or)'}}>{d.number}</div>
                  <div style={{fontWeight:700,fontSize:15,color:'var(--txt)',marginTop:2}}>{d.to?.name||'—'}</div>
                  <div style={{fontSize:12,color:'var(--txt3)',marginTop:2}}>{FD(d.date,biz.dateFormat)}{od2&&' · Due: '+FD(d.due,biz.dateFormat)}</div>
                </div>
                <div style={{textAlign:'right'}}>
                  <div style={{fontFamily:'Syne,sans-serif',fontWeight:900,fontSize:17,color:'var(--txt)'}}>{INR(t.grand,d.currency)}</div>
                  <span className={'pill pill-'+st} style={{marginTop:4,display:'inline-block'}}>{st.charAt(0).toUpperCase()+st.slice(1)}</span>
                </div>
              </div>
              <div style={{display:'flex',gap:8,borderTop:'1px solid var(--bd)',paddingTop:10}} onClick={e=>e.stopPropagation()}>
                {st!=='paid'&&<Btn v="success" sz="sm" style={{flex:1,justifyContent:'center'}} onClick={()=>onPaid(d.id)}>✓ Mark Paid</Btn>}
                <Btn v="ghost" sz="sm" style={{flex:1,justifyContent:'center'}} onClick={()=>onEdit(d)}>✏️ Edit</Btn>
                <Btn v="ghost" sz="sm" style={{flex:1,justifyContent:'center'}} onClick={()=>onPrint(d)}>🖨️</Btn>
                <Btn v="danger" sz="sm" onClick={()=>confirm('Delete?')&&onDel(d.id)}>✕</Btn>
              </div>
            </div>;
          })}
        </div>
      )}
    </div>
  );
}

function Dashboard({invs,exps,clis,biz,setPg,openNew,setQuick}){
  const today=TD();
  const paid=invs.filter(i=>i.type==='invoice'&&i.status==='paid');
  const unpaid=invs.filter(i=>i.type==='invoice'&&i.status!=='paid');
  const overdue=unpaid.filter(i=>i.due&&i.due<today);
  const rev=paid.reduce((a,i)=>a+i.total,0);
  const out=unpaid.reduce((a,i)=>a+i.total,0);
  const expT=exps.reduce((a,e)=>a+(+e.amount||0),0);
  const cur=biz.currency||'INR';
  const hr=new Date().getHours();
  const greet=hr<12?'Morning':hr<17?'Afternoon':'Evening';
  return(
    <div className="fu">
      <div style={{marginBottom:16}}><div style={{fontFamily:'Syne,sans-serif',fontWeight:900,fontSize:20,color:'var(--txt)'}}>Good {greet}, {biz.name||'there'}! 👋</div><div style={{fontSize:12.5,color:'var(--txt3)',marginTop:2}}>{new Date().toLocaleDateString('en-IN',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</div></div>
      <div className="stat-grid">
        {[[rev,'Revenue',paid.length+' paid','💰','var(--or)','rgba(255,107,53,.1)'],[out,'Outstanding',unpaid.length+' unpaid','⏳','var(--bl)','rgba(59,130,246,.1)'],[overdue.length,'Overdue',INR(overdue.reduce((a,i)=>a+i.total,0),cur),'🚨','var(--rd)','rgba(239,68,68,.1)'],[rev-expT,'Net Profit','vs expenses','📈','var(--gn)','rgba(16,185,129,.1)']].map(([val,lbl,sub,ic,col,bg])=>(
          <div key={lbl} className="stat-card" style={{borderLeft:'3px solid '+col}}>
            <div className="sc-icon" style={{background:bg}}>{ic}</div>
            <div className="sc-label">{lbl}</div>
            <div className="sc-value" style={{color:col}}>{typeof val==='number'&&lbl!=='Overdue'?INR(val,cur):val}</div>
            <div className="sc-sub">{sub}</div>
          </div>
        ))}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:12,marginBottom:14}}>
        <Card>
          <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>⚡ Quick Actions</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
            {[['⚡ Quick Invoice',()=>setQuick(true),'primary'],['🧾 New Invoice',()=>openNew('invoice'),'ghost'],['📋 Estimate',()=>openNew('estimate'),'ghost'],['👥 Clients',()=>setPg('clients'),'ghost']].map(([l,fn,v])=><Btn key={l} v={v} sz="sm" style={{justifyContent:'center'}} onClick={fn}>{l}</Btn>)}
          </div>
        </Card>
        <Card>
          <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>🕐 Recent</div>
          {invs.slice(0,4).map(i=>{const st=i.status==='paid'?'paid':i.due&&i.due<today?'overdue':'unpaid';return(
            <div key={i.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderBottom:'1px solid var(--bd)'}}>
              <div><div style={{fontSize:12.5,fontWeight:600}}>{i.to?.name||'—'}</div><div style={{fontSize:11,color:'var(--txt3)'}}>{i.number}</div></div>
              <div style={{textAlign:'right'}}><div style={{fontSize:12.5,fontWeight:700,fontFamily:'Syne,sans-serif'}}>{INR(i.total,i.currency)}</div><span className={'pill pill-'+st} style={{fontSize:10}}>{st}</span></div>
            </div>
          );})}
          {!invs.length&&<div style={{textAlign:'center',padding:'14px 0',color:'var(--txt3)',fontSize:13}}>No invoices yet</div>}
        </Card>
      </div>
      {overdue.length>0&&<Card style={{borderLeft:'3px solid var(--rd)'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:20}}>🚨</span>
          <div style={{flex:1}}><div style={{fontWeight:700,fontSize:13.5,color:'var(--rd)'}}>{overdue.length} Overdue Invoice{overdue.length>1?'s':''}</div><div style={{fontSize:12,color:'var(--txt2)'}}>{INR(overdue.reduce((a,i)=>a+i.total,0),cur)} pending</div></div>
          <Btn v="danger" sz="sm" onClick={()=>setPg('invoices')}>View</Btn>
        </div>
      </Card>}
    </div>
  );
}

                <div style={{flex:1}}><div style={{fontWeight:700,fontSize:13.5}}>{c.name}</div><div style={{fontSize:11,color:'var(--txt3)'}}>{c.phone||c.email||'—'}</div></div>

      {!exps.length?<Card><div style={{textAlign:'center',padding:36,color:'var(--txt3)'}}>No expenses yet</div></Card>:(

        <tbody>{exps.map(e=><tr key={e.id}><td style={{fontSize:12.5,color:'var(--txt2)'}}>{FD(e.date)}</td><td style={{fontWeight:600}}>{e.desc}</td><td><span style={{padding:'2px 8px',borderRadius:100,background:'var(--bll)',color:'var(--bl)',fontSize:11,fontWeight:600}}>{e.category}</span></td><td style={{fontFamily:'Syne,sans-serif',fontWeight:700,color:'var(--rd)'}}>{INR(e.amount)}</td><td><Btn v="ghost" sz="sm" onClick={()=>{setForm(e);setShow(true);}}>✏️</Btn></td></tr>)}</tbody></table></Card>
      )}
      {show&&<div className="modal-ov" onClick={e=>{if(e.target===e.currentTarget)setShow(false);}}>
        <div className="modal" style={{maxWidth:400}}>
          <div className="modal-hdr"><div className="modal-title">Add Expense</div><button className="modal-close" onClick={()=>setShow(false)}>✕</button></div>
          <div className="modal-body">
            <div style={{marginBottom:12}}><Label>Description</Label><Inp value={form.desc||''} onChange={e=>setForm(p=>({...p,desc:e.target.value}))} placeholder="What was this for?"/></div>
            <div className="frow frow-2"><div><Label>Amount</Label><Inp type="number" value={form.amount||''} onChange={e=>setForm(p=>({...p,amount:e.target.value}))}/></div><div><Label>Category</Label><Sl value={form.category||'Office'} onChange={e=>setForm(p=>({...p,category:e.target.value}))}>{EXP_CATS.map(c=><option key={c}>{c}</option>)}</Sl></div></div>
            <div><Label>Date</Label><Inp type="date" value={form.date||TD()} onChange={e=>setForm(p=>({...p,date:e.target.value}))}/></div>
            <div style={{display:'flex',gap:8,marginTop:14}}><Btn v="ghost" style={{flex:1,justifyContent:'center'}} onClick={()=>setShow(false)}>Cancel</Btn><Btn v="primary" style={{flex:2,justifyContent:'center'}} onClick={save}>Save</Btn></div>
          </div>
        </div>
      </div>}
    </div>
  );
}

function SettingsPage({biz,setBiz,tpl,setTpl,toast,invs,clis,prods,exps}){
  const[form,setForm]=useState(biz);
  const up=k=>e=>setForm(p=>({...p,[k]:e.target.value}));
  const save=()=>{setBiz(form);toast('Settings saved!','success');};
  const exportData=()=>{const d={invs,clis,prods,exps,settings:biz,ts:Date.now()};const b=new Blob([JSON.stringify(d)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='invoicebolt-backup-'+TD()+'.json';a.click();toast('Backup downloaded!','success');};
  const importData=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.invs)sv('ib_invs',d.invs);if(d.clis)sv('ib_clis',d.clis);if(d.prods)sv('ib_prods',d.prods);if(d.exps)sv('ib_exps',d.exps);toast('Imported! Reloading…','success');setTimeout(()=>window.location.reload(),1200);}catch{toast('Invalid file','error');}};r.readAsText(f);};
  const TA=p=><textarea value={p.value} onChange={p.onChange} rows={p.rows||2} placeholder={p.ph||''} style={{width:'100%',padding:'9px 12px',border:'1.5px solid var(--bd)',borderRadius:'var(--r-sm)',fontSize:13,fontFamily:'Inter,sans-serif',color:'var(--txt)',background:'var(--card)',outline:'none',resize:'vertical'}}/>;
  return(
    <div className="fu">
      <div style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:18,marginBottom:16}}>⚙️ Settings</div>
      <div style={{display:'grid',gap:14}}>
        <Card><div style={{fontWeight:700,fontSize:14,marginBottom:12}}>🏢 Business Info</div>
          <div className="frow frow-2"><div><Label>Business Name</Label><Inp value={form.name||''} onChange={up('name')} placeholder="Your Business"/></div><div><Label>GSTIN</Label><Inp value={form.gstin||''} onChange={up('gstin')}/></div></div>
          <div className="frow frow-2"><div><Label>Phone</Label><Inp value={form.phone||''} onChange={up('phone')}/></div><div><Label>Email</Label><Inp type="email" value={form.email||''} onChange={up('email')}/></div></div>
          <div style={{marginBottom:12}}><Label>Address</Label><TA value={form.address||''} onChange={up('address')} ph="Business address…"/></div>
        </Card>
        <Card><div style={{fontWeight:700,fontSize:14,marginBottom:12}}>🏦 Bank & UPI</div>
          <div className="frow frow-3"><div><Label>Bank Name</Label><Inp value={form.bankName||''} onChange={up('bankName')}/></div><div><Label>Account No.</Label><Inp value={form.bankAcc||''} onChange={up('bankAcc')}/></div><div><Label>IFSC</Label><Inp value={form.bankIFSC||''} onChange={up('bankIFSC')}/></div></div>
          <div><Label>UPI ID</Label><Inp value={form.upi||''} onChange={up('upi')} placeholder="name@paytm"/></div>
        </Card>
        <Card><div style={{fontWeight:700,fontSize:14,marginBottom:12}}>🧾 Invoice Defaults</div>
          <div className="frow frow-3"><div><Label>Prefix</Label><Inp value={form.prefix||'INV'} onChange={up('prefix')}/></div><div><Label>Date Format</Label><Sl value={form.dateFormat||'DD/MM/YYYY'} onChange={up('dateFormat')}>{['DD/MM/YYYY','MM/DD/YYYY','YYYY-MM-DD'].map(f=><option key={f}>{f}</option>)}</Sl></div><div><Label>Currency</Label><Sl value={form.currency||'INR'} onChange={up('currency')}>{CURRENCIES.map(c=><option key={c}>{c}</option>)}</Sl></div></div>
          <div style={{marginBottom:12}}><Label>Default Notes</Label><TA value={form.defaultNotes||''} onChange={up('defaultNotes')} ph="Payment terms…"/></div>
          <div><Label>Footer</Label><Inp value={form.footer||''} onChange={up('footer')} placeholder="Thank you for your business!"/></div>
        </Card>
        <Card><div style={{fontWeight:700,fontSize:14,marginBottom:12}}>🎨 Template</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(90px,1fr))',gap:8}}>
            {TEMPLATES.map(t2=><div key={t2} onClick={()=>{setTpl(t2);sv('ib_tpl',t2);toast('Template: '+t2,'success');}} style={{padding:10,borderRadius:'var(--r-md)',border:'2px solid '+(tpl===t2?'var(--or)':'var(--bd)'),cursor:'pointer',textAlign:'center',fontSize:12,fontWeight:600,background:tpl===t2?'var(--orl)':'var(--card)',color:tpl===t2?'var(--or)':'var(--txt2)',transition:'all .15s'}}>{t2}</div>)}
          </div>
        </Card>
        <Card><div style={{fontWeight:700,fontSize:14,marginBottom:12}}>💾 Backup & Data</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <Btn v="ghost" sz="sm" onClick={exportData}>📥 Export</Btn>
            <label style={{display:'inline-flex',alignItems:'center',gap:6,padding:'6px 12px',borderRadius:'var(--r-sm)',border:'1px solid var(--bd)',cursor:'pointer',fontSize:12.5,fontWeight:600,color:'var(--txt2)',background:'var(--card2)'}}>📤 Import<input type="file" accept=".json" onChange={importData} style={{display:'none'}}/></label>
            <Btn v="danger" sz="sm" onClick={()=>{if(confirm('Delete ALL data? Cannot undo!')){Object.keys(LS).forEach(k=>localStorage.removeItem(LS[k]));window.location.reload();}}}>🗑️ Clear All</Btn>
          </div>
        </Card>
        <Btn v="primary" sz="lg" style={{justifyContent:'center'}} onClick={save}>💾 Save Settings</Btn>
      </div>
    </div>
  );
}

function ReportsPage({invs,exps,biz}){
  const now=new Date();const cur=biz.currency||'INR';
  const months=Array.from({length:6},(_,i)=>{
    const d=new Date(now.getFullYear(),now.getMonth()-5+i,1);
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const rev=invs.filter(x=>x.status==='paid'&&(x.date||'').startsWith(k)).reduce((a,x)=>a+x.total,0);
    const exp=exps.filter(x=>(x.date||'').startsWith(k)).reduce((a,x)=>a+(+x.amount||0),0);
    return{label:d.toLocaleDateString('en-IN',{month:'short'}),rev,exp};
  });
  const mx=Math.max(...months.map(m=>Math.max(m.rev,m.exp)),1);
  const topC=[...new Set(invs.map(i=>i.to?.name))].filter(Boolean).map(n=>({name:n,total:invs.filter(i=>i.to?.name===n&&i.status==='paid').reduce((a,i)=>a+i.total,0)})).sort((a,b)=>b.total-a.total).slice(0,5);
  const gst=invs.filter(i=>i.type==='invoice').reduce((a,i)=>{const t=calcT(i.items);return{cg:a.cg+t.cg,sg:a.sg+t.sg,ig:a.ig+t.ig};},{cg:0,sg:0,ig:0});
  return(
    <div className="fu">
      <div style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:18,marginBottom:16}}>📊 Reports</div>
      <div style={{display:'grid',gap:14}}>
        <Card><div style={{fontWeight:700,fontSize:14,marginBottom:12}}>📈 Revenue vs Expenses (6 months)</div>
          <div style={{display:'flex',alignItems:'flex-end',gap:8,height:130}}>
            {months.map(m=><div key={m.label} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
              <div style={{width:'100%',display:'flex',gap:2,alignItems:'flex-end',height:100}}>
                <div style={{flex:1,background:'var(--or)',borderRadius:'4px 4px 0 0',height:Math.max(3,(m.rev/mx)*100)+'px',transition:'height .3s'}}/>
                <div style={{flex:1,background:'var(--rd)',borderRadius:'4px 4px 0 0',opacity:.5,height:Math.max(3,(m.exp/mx)*100)+'px',transition:'height .3s'}}/>
              </div>
              <div style={{fontSize:10,color:'var(--txt3)',fontWeight:600}}>{m.label}</div>
            </div>)}
          </div>
          <div style={{display:'flex',gap:14,marginTop:8,justifyContent:'center'}}>
            <div style={{display:'flex',gap:5,alignItems:'center',fontSize:12,color:'var(--txt2)'}}><div style={{width:10,height:10,background:'var(--or)',borderRadius:2}}/> Revenue</div>
            <div style={{display:'flex',gap:5,alignItems:'center',fontSize:12,color:'var(--txt2)'}}><div style={{width:10,height:10,background:'var(--rd)',borderRadius:2,opacity:.5}}/> Expenses</div>
          </div>
        </Card>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
          <Card><div style={{fontWeight:700,fontSize:14,marginBottom:10}}>🏆 Top Clients</div>
            {topC.length?topC.map((c,i)=><div key={c.name} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--bd)'}}>
              <div style={{display:'flex',gap:7,alignItems:'center'}}><div style={{width:20,height:20,borderRadius:'50%',background:'var(--orl)',color:'var(--or)',fontSize:10,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center'}}>{i+1}</div><span style={{fontSize:13,fontWeight:600}}>{c.name}</span></div>
              <span style={{fontFamily:'Syne,sans-serif',fontWeight:700,fontSize:12.5,color:'var(--gn)'}}>{INR(c.total,cur)}</span>
            </div>):<div style={{textAlign:'center',padding:16,color:'var(--txt3)',fontSize:13}}>No data yet</div>}
          </Card>
          <Card><div style={{fontWeight:700,fontSize:14,marginBottom:10}}>🧾 GST Summary</div>
            {[['CGST',gst.cg,'var(--or)'],['SGST',gst.sg,'var(--bl)'],['IGST',gst.ig,'var(--pu)'],['Total Tax',gst.cg+gst.sg+gst.ig,'var(--gn)']].map(([l,v,c])=><div key={l} style={{display:'flex',justifyContent:'space-between',padding:'7px 0',borderBottom:'1px solid var(--bd)'}}><span style={{fontSize:13,color:'var(--txt2)'}}>{l}</span><span style={{fontFamily:'Syne,sans-serif',fontWeight:700,fontSize:13,color:c}}>{INR(v,cur)}</span></div>)}
          </Card>
        </div>
      </div>
    </div>
  );
}

function App(){
  const[theme,setTheme]=useState(()=>ls(LS.theme,'light'));
  const[pg,setPg]=useState('dashboard');
  const[invs,setInvs]=useState(()=>ls(LS.invs,[]));
  const[clis,setClis]=useState(()=>ls(LS.clis,[]));
  const[prods,setProds]=useState(()=>ls(LS.prods,[]));
  const[exps,setExps]=useState(()=>ls(LS.exps,[]));
  const[biz,setBiz]=useState(()=>ls(LS.sets,{name:'',gstin:'',currency:'INR',prefix:'INV',dateFormat:'DD/MM/YYYY',defaultNotes:'',footer:'Thank you for your business!',bankName:'',bankAcc:'',bankIFSC:'',upi:'',phone:'',email:'',address:'',logo:'',signature:'',pan:'',website:''}));
  const[tpl,setTpl]=useState(()=>ls(LS.tpl,'Classic'));
  const[editInv,setEditInv]=useState(null);
  const[showEd,setShowEd]=useState(false);
  const[agOpen,setAgOpen]=useState(false);
  const[quickInv,setQuickInv]=useState(false);
  const[gstCalc,setGstCalc]=useState(false);
  const[ts,setTs]=useState({});
  const[onboard,setOnboard]=useState(()=>!ls(LS.ob,false));
  const[milestone,setMilestone]=useState(null);
  const[confetti,setConfetti]=useState(false);
  const[mini,setMini]=useState(false);

  useEffect(()=>sv(LS.invs,invs),[invs]);
  useEffect(()=>sv(LS.clis,clis),[clis]);
  useEffect(()=>sv(LS.prods,prods),[prods]);
  useEffect(()=>sv(LS.exps,exps),[exps]);
  useEffect(()=>sv(LS.sets,biz),[biz]);
  useEffect(()=>sv(LS.theme,theme),[theme]);
  useEffect(()=>{document.body.setAttribute('data-theme',theme);},[theme]);

  const toast=(msg,type)=>{setTs({msg,type:'success',...(type?{type}:{})});setTimeout(()=>setTs({}),3000);};

  const checkMS=useCallback(newI=>{
    const paid=newI.filter(i=>i.status==='paid');
    const rev=paid.reduce((a,i)=>a+i.total,0);
    if(newI.length===1){setMilestone({title:'First Invoice! 🎉',msg:'BoltBot is dancing! You created your very first invoice. The journey begins!'});setConfetti(true);setTimeout(()=>setConfetti(false),3000);}
    else if(paid.length===1){setMilestone({title:'First Payment! 💰',msg:'Money in the bank! Your first invoice is PAID. This is just the beginning!'});}
    else if(rev>=100000&&rev-((newI[0]?.total)||0)<100000){setMilestone({title:'₹1 Lakh Revenue! 🏆',msg:'INCREDIBLE! You crossed ₹1,00,000 revenue on InvoiceBolt. BoltBot is SO proud!'});setConfetti(true);setTimeout(()=>setConfetti(false),3000);}
  },[]);

  const saveInv=inv=>{
    setInvs(p=>{const ex=p.find(x=>x.id===inv.id);const n=ex?p.map(x=>x.id===inv.id?inv:x):[inv,...p];
      const t=calcT(inv.items);inv.total=t.grand;
      checkMS(n);return n;
    });
    toast('Saved! ✓','success');setShowEd(false);setEditInv(null);
    const tp=inv.type;
    setPg(tp==='estimate'?'estimates':tp==='delivery'?'delivery':tp==='po'?'pos':tp==='credit'||tp==='debit'?'credits':'invoices');
  };

  const openNew=type=>{const t=calcT([]);setEditInv({type:type||'invoice'});setShowEd(true);};
  const openEdit=inv=>{setEditInv(inv);setShowEd(true);};
  const delInv=id=>{setInvs(p=>p.filter(x=>x.id!==id));toast('Deleted','success');};
  const markPaid=id=>{setInvs(p=>p.map(x=>x.id===id?{...x,status:'paid',paid:x.total,paidOn:TD()}:x));toast('Marked paid! 💰','success');};
  const doPrint=inv=>{const w=window.open('','_blank');w.document.write(buildHTML(inv,tpl,biz.dateFormat||'DD/MM/YYYY'));w.document.close();setTimeout(()=>w.print(),700);};

  const today=TD();
  const overdueCount=invs.filter(i=>i.status!=='paid'&&i.due&&i.due<today).length;

  const NAV=[
    {sec:'Main'},
    {id:'dashboard',lbl:'Dashboard',icon:'🏠'},
    {id:'invoices',lbl:'Invoices',icon:'🧾',badge:overdueCount||null},
    {id:'estimates',lbl:'Estimates',icon:'📋'},
    {sec:'Documents'},
    {id:'delivery',lbl:'Delivery Notes',icon:'🚚'},
    {id:'pos',lbl:'Purchase Orders',icon:'📦'},
    {id:'credits',lbl:'Credit/Debit',icon:'↩️'},
    {sec:'Business'},
    {id:'clients',lbl:'Clients',icon:'👥'},
    {id:'products',lbl:'Products',icon:'📦'},
    {id:'expenses',lbl:'Expenses',icon:'💸'},
    {id:'reports',lbl:'Reports',icon:'📊'},
    {sec:'App'},
    {id:'settings',lbl:'Settings',icon:'⚙️'},
  ];

  const renderPg=()=>{
    if(pg==='dashboard')return<Dashboard invs={invs} exps={exps} clis={clis} biz={biz} setPg={setPg} openNew={openNew} setQuick={setQuickInv}/>;
    if(pg==='invoices')return<InvList docs={invs.filter(i=>i.type==='invoice')} label="Invoices" onNew={openNew} onEdit={openEdit} onDel={delInv} onPaid={markPaid} onPrint={doPrint} biz={biz} type="invoice"/>;
    if(pg==='estimates')return<InvList docs={invs.filter(i=>i.type==='estimate')} label="Estimates" onNew={openNew} onEdit={openEdit} onDel={delInv} onPaid={markPaid} onPrint={doPrint} biz={biz} type="estimate"/>;
    if(pg==='delivery')return<InvList docs={invs.filter(i=>i.type==='delivery')} label="Delivery Notes" onNew={openNew} onEdit={openEdit} onDel={delInv} onPaid={markPaid} onPrint={doPrint} biz={biz} type="delivery"/>;
    if(pg==='pos')return<InvList docs={invs.filter(i=>i.type==='po')} label="Purchase Orders" onNew={openNew} onEdit={openEdit} onDel={delInv} onPaid={markPaid} onPrint={doPrint} biz={biz} type="po"/>;
    if(pg==='credits')return<InvList docs={invs.filter(i=>i.type==='credit'||i.type==='debit')} label="Credit/Debit Notes" onNew={openNew} onEdit={openEdit} onDel={delInv} onPaid={markPaid} onPrint={doPrint} biz={biz} type="credit"/>;
    if(pg==='clients')return<ClientsPage clis={clis} setClis={setClis} invs={invs} toast={toast}/>;
    if(pg==='products')return<ProductsPage/>;
    if(pg==='expenses')return<ExpensesPage exps={exps} setExps={setExps} toast={toast}/>;
    if(pg==='reports')return<ReportsPage invs={invs} exps={exps} biz={biz}/>;
    if(pg==='settings')return<SettingsPage biz={biz} setBiz={setBiz} tpl={tpl} setTpl={setTpl} toast={toast} invs={invs} clis={clis} prods={prods} exps={exps}/>;
    return<Dashboard invs={invs} exps={exps} clis={clis} biz={biz} setPg={setPg} openNew={openNew} setQuick={setQuickInv}/>;
  };

  return(
    <div className="app-wrap">
      <Confetti on={confetti}/>

      <aside className={'sb'+(mini?' mini':'')}>
        <div className="sb-logo">
          <div className="sb-logo-icon">⚡</div>
          {!mini&&<div className="sb-logo-text">Invoice<span>Bolt</span></div>}
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'6px 0'}}>
          {NAV.map((n,i)=>n.sec?(
            !mini&&<div key={i} className="sb-section">{n.sec}</div>
          ):(
            <div key={n.id} className={'sb-item'+(pg===n.id?' act':'')} onClick={()=>setPg(n.id)} title={mini?n.lbl:''}>
              <span className="sb-icon">{n.icon}</span>
              {!mini&&<span>{n.lbl}</span>}
              {n.badge&&<span className="sb-badge">{n.badge}</span>}
            </div>
          ))}
        </div>
        <div className="sb-footer">
          <button className="sb-mini-btn" onClick={()=>setMini(p=>!p)} title={mini?'Expand':'Collapse'}>
            <span>{mini?'→':'←'}</span>
            {!mini&&<span>Collapse</span>}
          </button>
        </div>
      </aside>

      <div className={'main'+(mini?' wide':'')}>
        <div className="topbar">
          <div className="topbar-title">⚡ InvoiceBolt</div>
          <div className="topbar-sep"/>
          <Btn v="primary" sz="sm" style={{background:'var(--gn)',boxShadow:'0 2px 8px rgba(16,185,129,.3)',flexShrink:0}} onClick={()=>setQuickInv(true)}>⚡ Quick</Btn>
          <span className="hide-mob"><Btn v="ghost" sz="sm" style={{flexShrink:0}} onClick={()=>setGstCalc(true)}>🧮 GST</Btn></span>
          <Btn v="ghost" sz="sm" style={{flexShrink:0}} onClick={()=>setAgOpen(true)}>🤖 AI</Btn>
          <div className="topbar-right">
            <button onClick={()=>setTheme(t=>t==='light'?'dark':'light')} style={{width:32,height:32,borderRadius:'50%',border:'1px solid var(--bd)',background:'var(--card2)',cursor:'pointer',fontSize:15,display:'flex',alignItems:'center',justifyContent:'center'}} title="Toggle theme">{theme==='light'?'🌙':'☀️'}</button>
            <span className="hide-mob"><Btn v="primary" sz="sm" style={{flexShrink:0}} onClick={()=>openNew('invoice')}>+ Invoice</Btn></span>
          </div>
        </div>
        <div className="content">{renderPg()}</div>
      </div>

      <div className="mob-nav">
        <div className="mob-nav-inner">
          {[['🏠','dashboard','Home'],['🧾','invoices','Bills']].map(([ic,id,lb])=>(
            <div key={id} className={'mob-nav-item'+(pg===id?' act':'')} onClick={()=>setPg(id)}>
              <span style={{fontSize:22}}>{ic}</span><span>{lb}</span>
            </div>
          ))}
          <div style={{display:'flex',flexDirection:'column',alignItems:'center'}}>
            <button className="mob-fab" onClick={()=>setQuickInv(true)}>⚡</button>
          </div>
          {[['👥','clients','Clients'],['📊','reports','Reports']].map(([ic,id,lb])=>(
            <div key={id} className={'mob-nav-item'+(pg===id?' act':'')} onClick={()=>setPg(id)}>
              <span style={{fontSize:22}}>{ic}</span><span>{lb}</span>
            </div>
          ))}
        </div>
      </div>

      <button onClick={()=>setAgOpen(true)} style={{position:'fixed',bottom:82,right:16,width:48,height:48,borderRadius:'50%',background:'#0d1117',border:'2px solid var(--or)',cursor:'pointer',fontSize:19,boxShadow:'0 4px 20px rgba(255,107,53,.4)',zIndex:150,display:'flex',alignItems:'center',justifyContent:'center',animation:'glow 3s ease infinite'}} title="AI Agent">🤖</button>

      {onboard&&<Onboarding onDone={()=>{setOnboard(false);sv(LS.ob,true);}}/>}
      {milestone&&<Milestone data={milestone} onClose={()=>setMilestone(null)}/>}
      {quickInv&&<QuickInvoice biz={biz} clis={clis} invs={invs} onSave={saveInv} toast={toast} onClose={()=>setQuickInv(false)}/>}
      {gstCalc&&<GSTCalc onClose={()=>setGstCalc(false)}/>}
      {agOpen&&<AIAgent onClose={()=>setAgOpen(false)} biz={biz} clis={clis} invs={invs} toast={toast} onGen={inv=>{setEditInv(inv);setAgOpen(false);setShowEd(true);}}/>}
      {showEd&&<Editor inv={editInv} biz={biz} clis={clis} onSave={saveInv} onClose={()=>{setShowEd(false);setEditInv(null);}} tpl={tpl}/>}
      <Toast ts={ts}/>
    </div>
  );
}

function ProductsPage(){
  return <div className="fu"><div style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:18,color:'var(--txt)',marginBottom:14}}>📦 Products & Services</div><div className="card card-pad" style={{textAlign:'center',color:'var(--txt3)',padding:40}}><div style={{fontSize:36,marginBottom:10}}>📦</div>Products feature coming soon! Meanwhile save items directly in invoice editor.</div></div>;
}

ReactDOM.render(<App/>,document.getElementById('root'));

</script>
</body>
</html>
