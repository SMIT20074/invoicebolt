<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#FF6B35"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>InvoiceBolt</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --or:#FF6B35;--orl:#fff4ef;--orb:#ffd4c0;
  --bl:#3B5BDB;--bll:#eef2ff;
  --gn:#2f9e44;--gnl:#ebfbee;
  --rd:#e03131;--rdl:#fff5f5;
  --yl:#f59f00;--yll:#fff9db;
  --pu:#7048e8;
  --dk:#0d1117;--dk3:#2d3748;
  --gy:#6b7280;--gy2:#9ca3af;--gy3:#d1d5db;--gy4:#e5e7eb;--gy5:#f3f4f6;--gy6:#f9fafb;
  --bd:#e2e8f0;
  --sh-xs:0 1px 2px rgba(0,0,0,.05);
  --sh-sm:0 2px 4px rgba(0,0,0,.08);
  --sh-md:0 10px 15px rgba(0,0,0,.1);
  --sh-lg:0 20px 25px rgba(0,0,0,.1);
  --sh-xl:0 25px 50px rgba(0,0,0,.15);
  --r-sm:6px;--r:10px;--r-md:14px;--r-xl:24px;
}
body{font-family:Inter,sans-serif;background:var(--gy5);color:var(--dk);font-size:14px;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--gy3);border-radius:10px;}
.sb{width:230px;background:#0d1117;border-right:1px solid #21262d;display:flex;flex-direction:column;height:100vh;position:fixed;left:0;top:0;z-index:100;transition:width .25s ease;overflow:hidden;}
.sb.collapsed{width:60px;}
.sb-logo{padding:18px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #21262d;min-height:64px;}
.sb-logo-icon{width:34px;height:34px;background:var(--or);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;box-shadow:0 4px 12px rgba(255,107,53,.35);}
.sb-logo-text{font-family:Syne,sans-serif;font-weight:900;font-size:15px;color:white;white-space:nowrap;overflow:hidden;letter-spacing:-.3px;}
.sb-logo-text span{color:var(--or);}
.sb-section{padding:14px 10px 5px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#4b5563;white-space:nowrap;overflow:hidden;}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:1px 6px;border-radius:8px;cursor:pointer;transition:all .15s;color:#8b949e;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;position:relative;}
.sb-item:hover{background:#161b22;color:white;}
.sb-item.active{background:rgba(255,107,53,.15);color:var(--or);font-weight:700;}
.sb-item.active::before{content:"";position:absolute;left:0;top:20%;bottom:20%;width:3px;background:var(--or);border-radius:0 3px 3px 0;}
.sb-badge{margin-left:auto;background:var(--rd);color:white;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:100px;}
.sb-footer{margin-top:auto;padding:12px;border-top:1px solid #21262d;}
.layout{display:flex;min-height:100vh;}
.main{flex:1;margin-left:230px;transition:margin-left .25s;display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:white;border-bottom:1px solid var(--bd);padding:0 24px;height:60px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:90;overflow-x:auto;}
.topbar::-webkit-scrollbar{height:0;}
.content{padding:24px;flex:1;}
.cmd-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:900;display:flex;align-items:flex-start;justify-content:center;padding-top:14vh;backdrop-filter:blur(4px);}
.cmd-box{background:white;border-radius:16px;width:100%;max-width:540px;box-shadow:0 32px 80px rgba(0,0,0,.3);overflow:hidden;}
.cmd-inp{width:100%;padding:16px 20px;border:none;font-size:15px;font-family:Inter,sans-serif;color:var(--dk);outline:none;border-bottom:1px solid var(--bd);}
.cmd-results{max-height:360px;overflow-y:auto;}
.cmd-item{display:flex;align-items:center;gap:12px;padding:10px 20px;cursor:pointer;transition:background .1s;font-size:13px;color:var(--dk);}
.cmd-item:hover,.cmd-sel{background:var(--orl);}
.cmd-icon{width:30px;height:30px;border-radius:8px;background:var(--gy5);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.cmd-sec{padding:6px 20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--gy2);background:var(--gy6);border-bottom:1px solid var(--bd);}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 24px;text-align:center;}
.es-icon{width:72px;height:72px;border-radius:20px;background:var(--orl);display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:18px;}
.es-title{font-family:Syne,sans-serif;font-weight:800;font-size:19px;color:var(--dk);margin-bottom:7px;}
.es-sub{font-size:14px;color:var(--gy2);max-width:300px;line-height:1.7;margin-bottom:20px;}
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--bd);z-index:200;padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 4px);}
.mob-nav-inner{display:flex;justify-content:space-around;align-items:flex-end;}
.mob-nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 10px;cursor:pointer;color:var(--gy2);font-size:10px;font-weight:600;}
.mob-nav-item.active{color:var(--or);}
.mob-fab{width:48px;height:48px;border-radius:50%;background:var(--or);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 16px rgba(255,107,53,.45);margin-bottom:4px;flex-shrink:0;}
.stat-premium{background:white;border-radius:16px;padding:20px 22px;border:1px solid var(--bd);position:relative;overflow:hidden;transition:all .2s;}
.stat-premium:hover{transform:translateY(-2px);box-shadow:var(--sh-md);}
.stat-premium .sp-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--gy2);margin-bottom:8px;}
.stat-premium .sp-value{font-family:Syne,sans-serif;font-size:24px;font-weight:900;letter-spacing:-1px;line-height:1;margin-bottom:5px;}
.stat-premium .sp-icon{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media(max-width:768px){
  .sb{display:none!important;}
  .main{margin-left:0!important;}
  .topbar{padding:0 14px;height:52px;gap:6px;}
  .content{padding:14px;padding-bottom:76px;}
  .mob-nav{display:block;}
  .ai-fab{bottom:72px!important;right:16px!important;}
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bk{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,107,53,.4)}50%{box-shadow:0 0 0 12px rgba(255,107,53,0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.fu{animation:fadeUp .25s ease both;}
.sp{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}
.dot{width:7px;height:7px;background:var(--gy3);border-radius:50%;animation:bk .9s ease infinite;}
.dot:nth-child(2){animation-delay:.18s;}.dot:nth-child(3){animation-delay:.36s;}
.tg{position:relative;width:42px;height:24px;display:inline-block;cursor:pointer;}
.tg input{opacity:0;width:0;height:0;}
.tgl{position:absolute;inset:0;background:var(--gy3);border-radius:100px;transition:.22s;cursor:pointer;}
.tgl:before{content:"";position:absolute;width:18px;height:18px;background:white;border-radius:50%;left:3px;top:3px;transition:.22s;}
.tg input:checked+.tgl{background:var(--or);}
.tg input:checked+.tgl:before{transform:translateX(18px);}
.ai-fab{position:fixed;bottom:28px;right:28px;z-index:600;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--or),#e63c00);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(255,107,53,.45);animation:glow 2.5s ease infinite;transition:transform .2s;}
.ai-fab:hover{transform:scale(1.08);}
.cbub{max-width:86%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word;}
.cu{background:var(--or);color:white;border-radius:14px 14px 4px 14px;align-self:flex-end;}
.ca{background:white;color:var(--dk);border-radius:14px 14px 14px 4px;border:1px solid var(--bd);}
.mic-btn{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;background:var(--gy5);color:var(--gy);}
.mic-on{background:var(--rd)!important;color:white!important;animation:pulse 1s ease infinite;}
.ad{background:var(--gy6);border:1.5px dashed var(--gy3);border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--gy3);font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;}
.tr-h:hover td{background:var(--gy6)!important;cursor:pointer;}
.ch{transition:transform .2s,box-shadow .2s;}
.ch:hover{transform:translateY(-2px);box-shadow:var(--sh-md);}
@media print{.sb,.ai-fab,.nopr{display:none!important;}.main{margin-left:0!important;}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo}=React;

const INR=(n,c)=>{c=c||'INR';const s={INR:'₹',USD:'$',EUR:'€',GBP:'£',AED:'AED'};return (s[c]||'₹')+parseFloat(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});};
const TD=()=>new Date().toISOString().split('T')[0];
const AD=(d,n)=>{const dt=new Date(d||TD());dt.setDate(dt.getDate()+n);return dt.toISOString().split('T')[0];};
const UID=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const INI=s=>(s||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const FD=(d,f)=>{f=f||'DD/MM/YYYY';if(!d)return '';const[y,m,day]=d.split('-');return f==='MM/DD/YYYY'?m+'/'+day+'/'+y:f==='YYYY-MM-DD'?d:day+'/'+m+'/'+y;};
const ld=k=>{try{return JSON.parse(localStorage.getItem('ibolt_'+k)||'null')}catch{return null}};
const sv=(k,v)=>{try{localStorage.setItem('ibolt_'+k,JSON.stringify(v))}catch{}};
const WDS=n=>{if(!n||n===0)return 'Zero Rupees Only';const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];const tw=x=>{if(x<20)return a[x];if(x<100)return b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');if(x<1000)return a[Math.floor(x/100)]+' Hundred'+(x%100?' and '+tw(x%100):'');if(x<100000)return tw(Math.floor(x/1000))+' Thousand'+(x%1000?' '+tw(x%1000):'');if(x<10000000)return tw(Math.floor(x/100000))+' Lakh'+(x%100000?' '+tw(x%100000):'');return tw(Math.floor(x/10000000))+' Crore'+(x%10000000?' '+tw(x%10000000):'');};return tw(Math.round(Math.abs(n)))+' Rupees Only';};
function calcT(items,ship,paid){items=items||[];let sub=0,cg=0,sg=0,ig=0,dc=0;items.forEach(it=>{const b=(+it.qty||0)*(+it.rate||0);const d=b*(+it.disc||0)/100;sub+=b;dc+=d;cg+=(b-d)*(+it.cgst||0)/100;sg+=(b-d)*(+it.sgst||0)/100;ig+=(b-d)*(+it.igst||0)/100;});const grand=sub-dc+cg+sg+ig+(+ship||0);return {sub,cg,sg,ig,dc,grand,bal:grand-(+paid||0),subtotal:sub,totalCGST:cg,totalSGST:sg,totalIGST:ig,totalDiscount:dc,total:grand};}

function buildHTML(inv,tpl,df){tpl=tpl||"Classic";df=df||"DD/MM/YYYY";
const P={Classic:"#FF6B35",Modern:"#3B5BDB",Minimal:"#1a1a1a",Saffron:"#FF9933",Corporate:"#1a5276",Royal:"#7048e8",Emerald:"#2f9e44",Crimson:"#c92a2a"};
const ac=P[tpl]||"#FF6B35";const t=calcT(inv.items,inv.shipping,inv.paid);const F=n=>INR(n,inv.currency||"INR");
const hD=(inv.items||[]).some(i=>(+i.disc)>0);const hC=(inv.items||[]).some(i=>(+i.cgst)>0);const hI=(inv.items||[]).some(i=>(+i.igst)>0);
const rows=(inv.items||[]).map((it,i)=>{const b=(+it.qty||0)*(+it.rate||0);const d=b*(+it.disc||0)/100;const cg=(b-d)*(+it.cgst||0)/100;const sg=(b-d)*(+it.sgst||0)/100;const ig2=(b-d)*(+it.igst||0)/100;
return "<tr style='background:"+(i%2===0?"#fff":"#fafbfd")+"'><td style='padding:10px;border-bottom:1px solid #eef0f5;font-size:13px'><b>"+(it.desc||"—")+"</b>"+(it.hsn?"<span style='display:block;font-size:10px;color:#9ca3af'>HSN:"+it.hsn+"</span>":"")+(it.note?"<span style='display:block;font-size:11px;color:#9ca3af;font-style:italic'>"+it.note+"</span>":"")+"</td><td style='padding:10px;border-bottom:1px solid #eef0f5;text-align:center;font-size:12px'>"+(it.qty||0)+" "+(it.unit||"")+"</td><td style='padding:10px;border-bottom:1px solid #eef0f5;text-align:right;font-size:13px'>"+F(it.rate)+"</td>"+(hD?"<td style='padding:10px;border-bottom:1px solid #eef0f5;text-align:center;color:#2f9e44;font-size:12px'>"+(+it.disc||0)+"%</td>":"")+(hC?"<td style='padding:10px;border-bottom:1px solid #eef0f5;text-align:center;font-size:11px;color:#666'>"+(+it.cgst||0)+"%+"+(+it.sgst||0)+"%</td>":"")+(hI?"<td style='padding:10px;border-bottom:1px solid #eef0f5;text-align:center;font-size:11px'>"+(+it.igst||0)+"%</td>":"")+"<td style='padding:10px;border-bottom:1px solid #eef0f5;text-align:right;font-weight:700;color:"+ac+"'>"+F(b-d+cg+sg+ig2)+"</td></tr>";}).join("");
const SR=[["Subtotal",t.sub],t.dc&&["Discount",t.dc,true],t.cg&&["CGST",t.cg],t.sg&&["SGST",t.sg],t.ig&&["IGST",t.ig],inv.shipping&&["Shipping",+inv.shipping],inv.paid&&["Paid",+inv.paid,true]].filter(Boolean).map(([k,v,g])=>"<div style='display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid #eef0f5;color:"+(g?"#2f9e44":"#374151")+"'><span>"+k+"</span><span style='font-weight:600'>"+(g&&k!=="Subtotal"?"-":"")+F(v)+"</span></div>").join("");
const typeLabel=inv.type==="estimate"?"ESTIMATE":inv.type==="delivery"?"DELIVERY NOTE":inv.type==="po"?"PURCHASE ORDER":inv.type==="credit"?"CREDIT NOTE":inv.type==="debit"?"DEBIT NOTE":"TAX INVOICE";
const fromA=(inv.from&&inv.from.address||"").replace(/\n/g,"<br>");
const toA=(inv.to&&inv.to.address||"").replace(/\n/g,"<br>");

function Dash({invs,clis,exps,biz,onNew,onPrev}){
  const ii=invs.filter(i=>i.type==="invoice");
  const pd=ii.filter(i=>i.status==="paid").reduce((a,i)=>a+i.total,0);
  const out=ii.filter(i=>i.status==="unpaid"||i.status==="partial").reduce((a,i)=>a+i.total,0);
  const ov=ii.filter(i=>i.status==="overdue").reduce((a,i)=>a+i.total,0);
  const expT=exps.reduce((a,e)=>a+e.amount,0);const cur=biz.currency||"INR";
  const now=new Date();const mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const bars=Array.from({length:6},(_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-5+i,1);const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");return{label:mo[d.getMonth()],rev:ii.filter(x=>x.status==="paid"&&(x.date||"").startsWith(k)).reduce((a,x)=>a+x.total,0),exp:exps.filter(x=>(x.date||"").startsWith(k)).reduce((a,x)=>a+x.amount,0)};});
  const mx=Math.max(...bars.map(b=>Math.max(b.rev,b.exp)),1);
  const aging={a:0,b:0,c:0};ii.filter(i=>["overdue","unpaid"].includes(i.status)).forEach(i=>{const dy=Math.floor((Date.now()-new Date(i.date))/86400000);if(dy>90)aging.c+=i.total;else if(dy>60)aging.b+=i.total;else aging.a+=i.total;});
  return <div className="fu">
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12,marginBottom:16}}>
      <Stat label="Revenue" value={INR(pd,cur)} sub={ii.filter(i=>i.status==="paid").length+" paid"} icon={IC.chart}/>
      <Stat label="Outstanding" value={INR(out,cur)} color="var(--yl)" sub={ii.filter(i=>i.status==="unpaid").length+" unpaid"}/>
      <Stat label="Overdue" value={INR(ov,cur)} color="var(--rd)" sub={ii.filter(i=>i.status==="overdue").length+" invoices"}/>
      <Stat label="Net Cash Flow" value={INR(pd-expT,cur)} color={(pd-expT)>=0?"var(--gn)":"var(--rd)"} sub="Revenue−Expenses"/>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 300px",gap:14,marginBottom:14}}>
      <Card>
        {MH("Recent Invoices")}

          {!ii.length?<div style={{textAlign:"center",padding:"32px 0",color:"var(--gy2)"}}><div style={{fontSize:36,marginBottom:8}}>📄</div><div style={{fontWeight:700,fontSize:14,color:"var(--dk3)",marginBottom:6}}>No invoices yet</div><Btn v="primary" onClick={()=>onNew("invoice")}>{IC.plus}Create First Invoice</Btn></div>:
          <table style={{width:"100%",borderCollapse:"collapse"}}><tbody>{ii.slice(0,8).map(inv=><tr key={inv.id} className="tr-h" onClick={()=>onPrev(inv)}>
            <td style={{padding:"8px 0",borderBottom:"1px solid var(--bd)",fontFamily:"Syne,sans-serif",fontWeight:800,color:"var(--or)",fontSize:12}}>{inv.number}</td>
            <td style={{padding:"8px 0",borderBottom:"1px solid var(--bd)",fontSize:12.5,fontWeight:500}}>{inv.to&&inv.to.name}</td>
            <td style={{padding:"8px 0",borderBottom:"1px solid var(--bd)",fontSize:12,color:"var(--gy2)"}}>{FD(inv.date,biz.dateFormat)}</td>
            <td style={{padding:"8px 0",borderBottom:"1px solid var(--bd)",fontFamily:"Syne,sans-serif",fontWeight:700,fontSize:13}}>{INR(inv.total,cur)}</td>
            <td style={{padding:"8px 0",borderBottom:"1px solid var(--bd)"}}><Bdg st={inv.status}/></td>
          </tr>)}</tbody></table>}
        </div>
      </Card>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Card>
          {MH("Revenue vs Expenses")}
          <div style={{padding:"12px 14px"}}>
            <div style={{display:"flex",alignItems:"flex-end",gap:4,height:68,marginBottom:7}}>
              {bars.map((b,i)=><div key={i} style={{flex:1,display:"flex",flexDirection:"column",gap:2,alignItems:"center"}}>
                <div style={{width:"100%",display:"flex",gap:2,alignItems:"flex-end",height:58}}>
                  <div style={{flex:1,background:i===5?"var(--or)":"var(--orl)",borderRadius:"3px 3px 0 0",minHeight:3,height:Math.max(3,b.rev/mx*54)+"px"}}/>
                  <div style={{flex:1,background:i===5?"var(--rd)":"#ffe4e4",borderRadius:"3px 3px 0 0",minHeight:3,height:Math.max(3,b.exp/mx*54)+"px",opacity:.8}}/>
                </div>
                <div style={{fontSize:9,color:"var(--gy2)",fontWeight:600}}>{b.label}</div>
              </div>)}
            </div>
            <div style={{display:"flex",gap:12,fontSize:11,color:"var(--gy)"}}><span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:8,height:8,background:"var(--or)",borderRadius:2,display:"inline-block"}}/>Rev</span><span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:8,height:8,background:"var(--rd)",borderRadius:2,opacity:.8,display:"inline-block"}}/>Exp</span></div>
          </div>
        </Card>
        <Card>
          {MH("Invoice Aging")}
          <div style={{padding:"10px 14px"}}>
            {[["0–30d",aging.a,"var(--yl)"],["31–60d",aging.b,"var(--or)"],["60d+",aging.c,"var(--rd)"]].map(([l,v,c])=><div key={l} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid var(--bd)",alignItems:"center"}}><div style={{display:"flex",alignItems:"center",gap:7}}><div style={{width:8,height:8,borderRadius:"50%",background:c}}/><span style={{fontSize:12.5}}>{l}</span></div><span style={{fontWeight:700,fontSize:13,color:c,fontFamily:"Syne,sans-serif"}}>{INR(v,cur)}</span></div>)}
          </div>
        </Card>
      </div>
    </div>
    <Card style={{marginBottom:14}}>
      {MH("Quick Actions")}

        {[{l:"New Invoice",t:"invoice",c:"var(--or)",ic:"🧾",d:"Tax invoice"},{l:"New Estimate",t:"estimate",c:"var(--bl)",ic:"📋",d:"Quote client"},{l:"Delivery Note",t:"delivery",c:"var(--gn)",ic:"🚚",d:"Dispatch doc"},{l:"Purchase Order",t:"po",c:"var(--pu)",ic:"📦",d:"Order vendor"}].map(a=><button key={a.l} onClick={()=>onNew(a.t)} style={{padding:"14px 10px",border:"1.5px solid "+a.c+"22",borderRadius:"var(--r-md)",cursor:"pointer",background:a.c+"11",textAlign:"left",transition:"all .2s",fontFamily:"Inter,sans-serif"}} onMouseEnter={e=>{e.currentTarget.style.background=a.c+"22";e.currentTarget.style.transform="translateY(-2px)";}} onMouseLeave={e=>{e.currentTarget.style.background=a.c+"11";e.currentTarget.style.transform="";}}>
          <div style={{fontSize:20,marginBottom:5}}>{a.ic}</div>
          <div style={{fontWeight:700,fontSize:13,color:"var(--dk)",marginBottom:2}}>{a.l}</div>
          <div style={{fontSize:11,color:"var(--gy2)"}}>{a.d}</div>
        </button>)}
      </div>
    </Card>
    <div className="ad nopr" style={{height:66}}>Bottom Advertisement</div>
  </div>;

function RepPage({invs,exps,clis,biz}){
  const ii=invs.filter(i=>i.type==="invoice");const now=new Date();
  const tm=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");const ty=String(now.getFullYear());
  const pd=ii.filter(i=>i.status==="paid");
  const mRev=pd.filter(i=>(i.date||"").startsWith(tm)).reduce((a,i)=>a+i.total,0);
  const yRev=pd.filter(i=>(i.date||"").startsWith(ty)).reduce((a,i)=>a+i.total,0);
  const avg=pd.length?pd.reduce((a,i)=>a+i.total,0)/pd.length:0;
  const rt=ii.length?Math.round(pd.length/ii.length*100):0;
  const gCG=ii.reduce((a,i)=>a+(i.totalCGST||0),0);const gSG=ii.reduce((a,i)=>a+(i.totalSGST||0),0);const gIG=ii.reduce((a,i)=>a+(i.totalIGST||0),0);
  const expT=exps.reduce((a,e)=>a+e.amount,0);const cur=biz.currency||"INR";
  const topC=clis.map(c=>({...c,tot:ii.filter(i=>i.to&&i.to.name===c.name).reduce((a,i)=>a+i.total,0),cnt:ii.filter(i=>i.to&&i.to.name===c.name).length})).sort((a,b)=>b.tot-a.tot).slice(0,6);
  const eBC={};exps.forEach(e=>{eBC[e.category]=(eBC[e.category]||0)+e.amount;});
  return <div className="fu">
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:15}}>

function AIAgent({onClose,biz,clis,prods,invs,toast,onGen,onAct}){

    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const rec=new SR();rec.lang="hi-IN";rec.interimResults=true;

        setLoading(false);return;}catch{}}
      addMsg("ai",raw);

// ═══════════════ GSTIN VALIDATOR ═══════════════
function GSTINValidator({ onClose }) {
  const [g, setG] = useState('');
  const [res, setRes] = useState(null);
  const [loading, setLoading] = useState(false);
  const validate = async () => {
    if (g.length !== 15) { setRes({ ok: false, msg: 'GSTIN must be exactly 15 characters.' }); return; }
    const regex = /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$/;
    if (!regex.test(g.toUpperCase())) { setRes({ ok: false, msg: 'Invalid GSTIN format.' }); return; }
    const stateCode = parseInt(g.slice(0, 2));
    const states = { 1: 'Jammu & Kashmir', 2: 'Himachal Pradesh', 3: 'Punjab', 4: 'Chandigarh', 5: 'Uttarakhand', 6: 'Haryana', 7: 'Delhi', 8: 'Rajasthan', 9: 'Uttar Pradesh', 10: 'Bihar', 11: 'Sikkim', 12: 'Arunachal Pradesh', 13: 'Nagaland', 14: 'Manipur', 15: 'Mizoram', 16: 'Tripura', 17: 'Meghalaya', 18: 'Assam', 19: 'West Bengal', 20: 'Jharkhand', 21: 'Odisha', 22: 'Chhattisgarh', 23: 'Madhya Pradesh', 24: 'Gujarat', 26: 'Daman & Diu', 27: 'Maharashtra', 28: 'Andhra Pradesh', 29: 'Karnataka', 30: 'Goa', 31: 'Lakshadweep', 32: 'Kerala', 33: 'Tamil Nadu', 34: 'Puducherry', 35: 'Andaman & Nicobar', 36: 'Telangana', 37: 'Andhra Pradesh (New)' };
    const pan = g.slice(2, 12);
    const entityType = { P: 'Individual/Proprietor', C: 'Company', H: 'Hindu Undivided Family', F: 'Firm/Partnership', A: 'AOP/BOI', T: 'Trust/AJP', B: 'Body of Individuals', L: 'Local Authority', J: 'Artificial Juridical Person', G: 'Government' }[g[5]] || 'Unknown';
    setRes({ ok: true, state: states[stateCode] || 'Unknown State (' + stateCode + ')', pan, entityType, gst: g.toUpperCase() });
  };
  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(13,17,23,.7)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16, backdropFilter: 'blur(8px)' }} onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ background: 'white', borderRadius: 'var(--r-xl)', width: '100%', maxWidth: 480, boxShadow: 'var(--sh-xl)', animation: 'slideUp .2s ease' }}>
        <div style={{ padding: '20px 22px 0', display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 18 }}>
          <div style={{ fontFamily: 'Syne,sans-serif', fontWeight: 800, fontSize: 17 }}>🔍 GSTIN Validator</div>
          <button onClick={onClose} style={{ background: 'var(--gy5)', border: 'none', width: 28, height: 28, borderRadius: '50%', cursor: 'pointer', fontSize: 14 }}>✕</button>
        </div>
        <div style={{ padding: '0 22px 22px' }}>
          <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
            <input value={g} onChange={e => setG(e.target.value.toUpperCase())} maxLength={15} placeholder="Enter GSTIN (e.g. 27AAAPZ2357J1ZW)" style={{ flex: 1, padding: '10px 13px', border: '1.5px solid var(--bd)', borderRadius: 'var(--r-sm)', fontSize: 13, fontFamily: 'Inter,sans-serif', outline: 'none', letterSpacing: 1 }} onFocus={e => e.target.style.borderColor = 'var(--or)'} onBlur={e => e.target.style.borderColor = 'var(--bd)'} />
            <Btn v="primary" onClick={validate}>Validate</Btn>
          </div>
          {res && (
            <div style={{ padding: '16px', borderRadius: 'var(--r-md)', background: res.ok ? 'var(--gnl)' : 'var(--rdl)', border: `1.5px solid ${res.ok ? 'var(--gn)' : 'var(--rd)'}` }}>
              {res.ok ? (
                <>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12, fontWeight: 700, fontSize: 14, color: 'var(--gn)' }}>✅ Valid GSTIN</div>
                  {[['GSTIN', res.gst], ['State', res.state], ['PAN', res.pan], ['Entity Type', res.entityType]].map(([k, v]) => (
                    <div key={k} style={{ display: 'flex', justifyContent: 'space-between', padding: '5px 0', fontSize: 13, borderBottom: '1px solid rgba(0,0,0,.06)' }}>
                      <span style={{ color: 'var(--gy)' }}>{k}</span><span style={{ fontWeight: 600 }}>{v}</span>
                    </div>
                  ))}
                </>
              ) : <div style={{ color: 'var(--rd)', fontWeight: 600, fontSize: 13 }}>❌ {res.msg}</div>}
            </div>
          )}
          <div style={{ marginTop: 14, fontSize: 12, color: 'var(--gy2)', lineHeight: 1.6 }}>
            ℹ️ Format: 2-digit state code + 10-digit PAN + 1 entity + Z + 1 checksum (e.g. <b>27AAAPZ2357J1ZW</b>)
          </div>
        </div>
      </div>
    </div>
  );
}

// ═══════════════ CSV IMPORT ═══════════════
function CSVImport({ type, onImport, onClose, toast }) {
  const [preview, setPreview] = useState([]);
  const [headers, setHeaders] = useState([]);
  const [mapping, setMapping] = useState({});
  const fRef = useRef();

  const clientFields = ['name', 'company', 'email', 'phone', 'address', 'gstin', 'pan', 'state'];
  const productFields = ['name', 'desc', 'rate', 'unit', 'hsn', 'cgst', 'sgst', 'category', 'sku', 'stock'];
  const fields = type === 'clients' ? clientFields : productFields;

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const text = ev.target.result;
      const rows = text.split('\n').filter(r => r.trim());
      const hdrs = rows[0].split(',').map(h => h.trim().replace(/"/g, ''));
      const data = rows.slice(1, 6).map(r => r.split(',').map(c => c.trim().replace(/"/g, '')));
      setHeaders(hdrs);
      setPreview(data);
      const auto = {};
      fields.forEach(f => {
        const match = hdrs.find(h => h.toLowerCase().includes(f.toLowerCase()) || f.toLowerCase().includes(h.toLowerCase()));
        if (match) auto[f] = match;
      });
      setMapping(auto);
    };
    reader.readAsText(file);
  };

  const doImport = () => {
    const file = fRef.current.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const text = ev.target.result;
      const rows = text.split('\n').filter(r => r.trim());
      const hdrs = rows[0].split(',').map(h => h.trim().replace(/"/g, ''));
      const items = rows.slice(1).filter(r => r.trim()).map(r => {
        const cols = r.split(',').map(c => c.trim().replace(/"/g, ''));
        const obj = { id: UID() };
        Object.entries(mapping).forEach(([field, header]) => {
          const idx = hdrs.indexOf(header);
          if (idx >= 0) obj[field] = cols[idx] || '';
        });
        if (obj.rate) obj.rate = parseFloat(obj.rate) || 0;
        if (obj.cgst) obj.cgst = parseFloat(obj.cgst) || 9;
        if (obj.sgst) obj.sgst = parseFloat(obj.sgst) || 9;
        if (obj.stock) obj.stock = parseInt(obj.stock) || 0;
        return obj;
      }).filter(o => o.name);
      onImport(items);
      toast(`Imported ${items.length} ${type}!`, 'success');
      onClose();
    };
    reader.readAsText(file);
  };

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(13,17,23,.7)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16, backdropFilter: 'blur(8px)' }} onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ background: 'white', borderRadius: 'var(--r-xl)', width: '100%', maxWidth: 580, maxHeight: '90vh', overflowY: 'auto', boxShadow: 'var(--sh-xl)', animation: 'slideUp .2s ease' }}>
        <div style={{ padding: '20px 22px 0', display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
          <div style={{ fontFamily: 'Syne,sans-serif', fontWeight: 800, fontSize: 17 }}>📥 Import {type === 'clients' ? 'Clients' : 'Products'} from CSV/Excel</div>
          <button onClick={onClose} style={{ background: 'var(--gy5)', border: 'none', width: 28, height: 28, borderRadius: '50%', cursor: 'pointer', fontSize: 14 }}>✕</button>
        </div>
        <div style={{ padding: '0 22px 22px' }}>
          <div style={{ padding: '14px 16px', background: 'var(--bll)', borderRadius: 'var(--r-md)', marginBottom: 16, fontSize: 13, color: 'var(--bl)', lineHeight: 1.6 }}>
            💡 Export your {type} from Excel/Tally/any app as CSV, then upload here. We'll auto-match the columns.
          </div>
          <input ref={fRef} type="file" accept=".csv,.txt" onChange={handleFile} style={{ marginBottom: 16, fontSize: 13 }} />
          {headers.length > 0 && <>
            <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 10, color: 'var(--dk)' }}>Map Columns to Fields:</div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 16 }}>
              {fields.map(f => (
                <div key={f} style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                  <label style={{ fontSize: 11, fontWeight: 600, color: 'var(--dk3)', textTransform: 'capitalize' }}>{f}</label>
                  <select value={mapping[f] || ''} onChange={e => setMapping(p => ({ ...p, [f]: e.target.value }))} style={{ padding: '6px 9px', border: '1.5px solid var(--bd)', borderRadius: 'var(--r-sm)', fontSize: 12, fontFamily: 'Inter,sans-serif', outline: 'none', background: 'white' }}>
                    <option value="">— Skip —</option>
                    {headers.map(h => <option key={h} value={h}>{h}</option>)}
                  </select>
                </div>
              ))}
            </div>
            {preview.length > 0 && <>
              <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 8 }}>Preview (first 5 rows):</div>
              <div style={{ overflowX: 'auto', marginBottom: 16 }}>
                <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 11.5 }}>
                  <thead><tr>{headers.map(h => <th key={h} style={{ background: 'var(--gy6)', padding: '6px 8px', textAlign: 'left', fontWeight: 600, border: '1px solid var(--bd)' }}>{h}</th>)}</tr></thead>
                  <tbody>{preview.map((r, i) => <tr key={i}>{r.map((c, j) => <td key={j} style={{ padding: '5px 8px', border: '1px solid var(--bd)', color: 'var(--gy)' }}>{c}</td>)}</tr>)}</tbody>
                </table>
              </div>
            </>}
            <div style={{ display: 'flex', gap: 8 }}>
              <Btn v="ghost" onClick={onClose}>Cancel</Btn>
              <Btn v="primary" onClick={doImport} style={{ flex: 1, justifyContent: 'center' }}>📥 Import {type === 'clients' ? 'Clients' : 'Products'}</Btn>
            </div>
          </>}
        </div>
      </div>
    </div>
  );
}

// ═══════════════ STOCK TRACKER ALERT ═══════════════
function checkStock(prods, invItems) {
  const warnings = [];
  (invItems || []).forEach(it => {
    const prod = prods.find(p => p.name === it.desc);
    if (prod && prod.stock !== '' && prod.stock !== undefined) {
      const remaining = (parseInt(prod.stock) || 0) - (parseInt(it.qty) || 0);
      if (remaining < 5) warnings.push(`⚠️ Low stock: "${prod.name}" — only ${remaining} left after this invoice.`);
    }
  });
  return warnings;
}

// ═══════════════ INVOICE EXPIRY COUNTDOWN ═══════════════
function ExpiryBadge({ due }) {
  if (!due) return null;
  const days = Math.ceil((new Date(due) - Date.now()) / 86400000);
  if (days < 0) return <span style={{ background: 'var(--rdl)', color: 'var(--rd)', padding: '2px 9px', borderRadius: 100, fontSize: 11, fontWeight: 700 }}>Expired {Math.abs(days)}d ago</span>;
  if (days === 0) return <span style={{ background: '#fff3cd', color: '#856404', padding: '2px 9px', borderRadius: 100, fontSize: 11, fontWeight: 700 }}>⏰ Expires Today</span>;
  if (days <= 3) return <span style={{ background: '#fff3cd', color: '#856404', padding: '2px 9px', borderRadius: 100, fontSize: 11, fontWeight: 700 }}>⏰ Expires in {days}d</span>;
  return null;
}

// ── 1. AI DUPLICATE DETECTOR ──
function checkDuplicate(inv, invs) {
  if (!inv || !invs) return null;
  const t = calcT(inv.items, inv.shipping, inv.paid);
  const match = invs.find(x => x.id !== inv.id && x.to?.name === inv.to?.name && Math.abs(x.total - t.grand) < 1 && x.date === inv.date);
  return match || null;
}

// ── 2. AI FRAUD ALERT (GST state mismatch) ──
function detectGSTFraud(inv) {
  const alerts = [];
  const stateCodes = { 'Andhra Pradesh': '28', 'Assam': '18', 'Bihar': '10', 'Chhattisgarh': '22', 'Delhi': '07', 'Goa': '30', 'Gujarat': '24', 'Haryana': '06', 'Himachal Pradesh': '02', 'Jharkhand': '20', 'Karnataka': '29', 'Kerala': '32', 'Madhya Pradesh': '23', 'Maharashtra': '27', 'Manipur': '14', 'Meghalaya': '17', 'Mizoram': '15', 'Nagaland': '13', 'Odisha': '21', 'Punjab': '03', 'Rajasthan': '08', 'Sikkim': '11', 'Tamil Nadu': '33', 'Telangana': '36', 'Tripura': '16', 'Uttar Pradesh': '09', 'Uttarakhand': '05', 'West Bengal': '19' };
  const fromGST = inv.from?.gstin || '';
  const toGST = inv.to?.gstin || '';
  const fromState = fromGST.slice(0, 2);
  const toState = toGST.slice(0, 2);
  if (fromGST && toGST && fromState !== toState && inv.gstType === 'cgst_sgst') {
    alerts.push('⚠️ GST Mismatch: Client is in a different state — IGST should apply, not CGST+SGST.');
  }
  if (fromGST && toGST && fromState === toState && inv.gstType === 'igst') {
    alerts.push('⚠️ GST Mismatch: Same state transaction — CGST+SGST should apply, not IGST.');
  }
  const hasIGST = (inv.items || []).some(i => (+i.igst) > 0);
  const hasCGST = (inv.items || []).some(i => (+i.cgst) > 0);
  if (hasIGST && hasCGST) alerts.push('⚠️ Mixed GST: Some items have IGST and others have CGST. Check each item.');
  return alerts;
}

// ── 3. CLIENT HEALTH SCORE ──
function getClientHealth(cli, invs) {
  const ci = invs.filter(i => i.to?.name === cli.name && i.type === 'invoice');
  if (!ci.length) return { score: 0, grade: '—', color: 'var(--gy2)', badges: [] };
  const paid = ci.filter(i => i.status === 'paid');
  const payRate = paid.length / ci.length;
  const avgDays = paid.filter(i => i.paidOn && i.due).reduce((a, i) => {
    const d = Math.max(0, (new Date(i.paidOn) - new Date(i.due)) / 86400000);
    return a + d;
  }, 0) / (paid.length || 1);
  const total = ci.reduce((a, i) => a + i.total, 0);
  const months = Math.max(1, (Date.now() - new Date(ci[ci.length - 1]?.date)) / (30 * 86400000));
  let score = Math.round(payRate * 50 + Math.max(0, 30 - avgDays) + Math.min(20, total / 5000));
  const grade = score >= 80 ? 'A+' : score >= 65 ? 'A' : score >= 50 ? 'B' : score >= 35 ? 'C' : 'D';
  const color = score >= 80 ? 'var(--gn)' : score >= 50 ? 'var(--yl)' : 'var(--rd)';
  const badges = [];
  if (payRate === 1) badges.push('✅ Always Pays');
  if (avgDays < 5) badges.push('⚡ Pays Fast');
  if (total > 100000) badges.push('💎 Big Client');
  if (ci.length > 10) badges.push('🔄 Loyal');
  if (payRate < 0.5) badges.push('⚠️ Payment Risk');
  return { score, grade, color, badges, payRate: Math.round(payRate * 100), total, count: ci.length };
}

    const expenses = exps.filter(e => (e.date || '').startsWith(String(yr))).reduce((a, e) => a + e.amount, 0);
    const topCli = clis.map(c => ({ name: c.name, total: ii.filter(i => i.to?.name === c.name).reduce((a, i) => a + i.total, 0) })).sort((a, b) => b.total - a.total).slice(0, 3);
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 800, system: 'You write annual business summary reports for Indian small business owners. Be warm, encouraging, professional. Use ₹ for amounts. Use emojis. Structure: 1) Year in Review 2) Financial Highlights 3) Top Achievements 4) Areas to Improve 5) Goals for Next Year. Keep each section 2-3 sentences. End with a motivational note.', messages: [{ role: 'user', content: `Business: ${biz.name}. Year: ${yr}. Revenue: ₹${revenue.toLocaleString('en-IN')}. Expenses: ₹${expenses.toLocaleString('en-IN')}. Net Profit: ₹${(revenue - expenses).toLocaleString('en-IN')}. Total Invoices: ${ii.length}. Top clients: ${topCli.map(c => c.name).join(', ')}. Generate annual business report.` }] }) });

      setReport(d.content?.[0]?.text || 'Could not generate report.');
    } catch { setReport('Network error. Please try again.'); }
    setLoading(false);
  };

  useEffect(() => { generate(); }, []);

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(13,17,23,.72)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16, backdropFilter: 'blur(8px)' }} onClick={e => { if (e.target === e.currentTarget) onClose(); }}>

// ── 7. PRICE SUGGESTER ──
function PriceSuggester({ prods, invs, biz, onClose }) {
  const [loading, setLoading] = useState(false);
  const [suggestions, setSuggestions] = useState('');

  const analyze = async () => {
    setLoading(true);
    const history = prods.slice(0, 15).map(p => {
      const uses = invs.flatMap(i => i.items || []).filter(it => it.desc === p.name);
      const lastUsed = uses.length ? uses[uses.length - 1] : null;
      return { name: p.name, currentRate: p.rate, unit: p.unit, timesInvoiced: uses.length, lastRate: lastUsed?.rate };
    }).filter(p => p.timesInvoiced > 0);
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 600, system: 'You are a pricing advisor for Indian small businesses. Suggest price increases based on usage frequency and market awareness. Be specific, practical. Use ₹. Give reasons. Format: Product Name → Current ₹X → Suggested ₹Y (reason)', messages: [{ role: 'user', content: `Business type: ${biz.name}. Products/services and usage: ${JSON.stringify(history)}. Suggest pricing improvements. Be specific with numbers.` }] }) });
      const d = await res.json();
      setSuggestions(d.content?.[0]?.text || 'Could not generate suggestions.');
    } catch { setSuggestions('Network error. Please try again.'); }
    setLoading(false);
  };

  useEffect(() => { analyze(); }, []);

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(13,17,23,.72)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16, backdropFilter: 'blur(8px)' }} onClick={e => { if (e.target === e.currentTarget) onClose(); }}>

// ── 10. BANK STATEMENT RECONCILIATION ──
function BankRecon({ invs, setInvs, toast, onClose }) {
  const [loading, setLoading] = useState(false);
  const [matches, setMatches] = useState([]);
  const [done, setDone] = useState(false);

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setLoading(true);
    const text = await file.text();
    const unpaid = invs.filter(i => i.status !== 'paid' && i.type === 'invoice').slice(0, 20);
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 800, system: 'You match bank statement entries to unpaid invoices. Respond ONLY with JSON array: [{"invoiceId":"...","amount":0,"date":"YYYY-MM-DD","confidence":"high/medium"}]. Match by amount and approximate date. Only include high-confidence matches.', messages: [{ role: 'user', content: `Bank statement (first 3000 chars): ${text.slice(0, 3000)}\n\nUnpaid invoices: ${JSON.stringify(unpaid.map(i => ({ id: i.id, number: i.number, client: i.to?.name, amount: i.total, due: i.due })))}` }] }) });
      const d = await res.json();
      const raw = d.content?.[0]?.text || '[]';
      const jm = raw.match(/\[[\s\S]*\]/);
      if (jm) {
        const found = JSON.parse(jm[0]);
        setMatches(found.map(m => ({ ...m, inv: invs.find(i => i.id === m.invoiceId) })).filter(m => m.inv));
      }
    } catch { toast('Could not parse statement.', 'error'); }
    setLoading(false);
  };

  const confirmAll = () => {
    matches.forEach(m => {
      setInvs(p => p.map(i => i.id === m.invoiceId ? { ...i, status: 'paid', paid: i.total, paidOn: m.date } : i));
    });
    toast(`${matches.length} invoices marked as paid!`, 'success');
    setDone(true);
  };

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(13,17,23,.72)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16, backdropFilter: 'blur(8px)' }} onClick={e => { if (e.target === e.currentTarget) onClose(); }}>

// ── FEATURE 1: SMART ITEM SUGGESTIONS ──
function ItemSuggest({ prods, invs, value, onSelect }) {
  const top = useMemo(() => {
    const freq = {};
    invs.forEach(inv => (inv.items || []).forEach(it => {
      if (it.desc) freq[it.desc] = (freq[it.desc] || 0) + 1;
    }));
    return Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([desc, cnt]) => {
      const prod = prods.find(p => p.name === desc);
      return { desc, cnt, rate: prod?.rate || 0, cgst: prod?.cgst || 9, sgst: prod?.sgst || 9, unit: prod?.unit || 'pcs', hsn: prod?.hsn || '' };
    });
  }, [invs, prods]);
  const filtered = value ? top.filter(t => t.desc.toLowerCase().includes(value.toLowerCase())) : top;
  if (!filtered.length) return null;
  return (
    <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, background: 'white', border: '1.5px solid var(--or)', borderRadius: 'var(--r-md)', boxShadow: 'var(--sh-lg)', zIndex: 200, maxHeight: 220, overflowY: 'auto', marginTop: 2 }}>
      {filtered.map((s, i) => (
        <div key={i} onClick={() => onSelect(s)} style={{ padding: '9px 13px', cursor: 'pointer', borderBottom: '1px solid var(--bd)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', transition: 'background .15s' }}
          onMouseEnter={e => e.currentTarget.style.background = 'var(--orl)'}
          onMouseLeave={e => e.currentTarget.style.background = 'white'}>
          <div>
            <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--dk)' }}>{s.desc}</div>
            <div style={{ fontSize: 11, color: 'var(--gy2)', marginTop: 1 }}>Used {s.cnt}× · {s.cgst + s.sgst}% GST · {s.unit}</div>
          </div>
          <div style={{ fontFamily: 'Syne,sans-serif', fontWeight: 800, fontSize: 13, color: 'var(--or)' }}>{s.rate > 0 ? INR(s.rate) : ''}</div>
        </div>
      ))}
    </div>
  );
}

// ── FEATURE 4: DUE DATE NOTIFICATION SYSTEM ──
function setupNotifications(invs, toast) {
  if (!('Notification' in window)) return;
  const today = TD();
  const overdue = invs.filter(i => i.type === 'invoice' && i.status !== 'paid' && i.due && i.due < today);
  const dueToday = invs.filter(i => i.type === 'invoice' && i.status !== 'paid' && i.due === today);
  const due3 = invs.filter(i => i.type === 'invoice' && i.status !== 'paid' && i.due && i.due > today && Math.ceil((new Date(i.due) - Date.now()) / 86400000) <= 3);
  if (overdue.length > 0) toast(`🔴 ${overdue.length} invoice${overdue.length > 1 ? 's' : ''} overdue — ${INR(overdue.reduce((a, i) => a + i.total, 0))} pending`, 'error');
  else if (dueToday.length > 0) toast(`🟡 ${dueToday.length} invoice${dueToday.length > 1 ? 's' : ''} due TODAY — ${INR(dueToday.reduce((a, i) => a + i.total, 0))}`, '');
  else if (due3.length > 0) toast(`📅 ${due3.length} invoice${due3.length > 1 ? 's' : ''} due in 3 days`, '');
}

      setMsgs(p => ({ ...p, [tone]: d.content?.[0]?.text || 'Error.' }));

          <button onClick={onClose} style={{ background: 'var(--gy5)', border: 'none', width: 28, height: 28, borderRadius: '50%', cursor: 'pointer', fontSize: 14 }}>✕</button>
        </div>

              <button key={k} onClick={() => generate(k)} style={{ padding: '5px 12px', borderRadius: 100, border: '1.5px solid', borderColor: level === k ? v.color : 'var(--bd)', background: level === k ? v.color : 'white', color: level === k ? 'white' : 'var(--gy)', fontSize: 12, fontWeight: 600, cursor: 'pointer', fontFamily: 'Inter,sans-serif' }}>{v.emoji} {v.label}</button>

          ) : msgs[level] ? (

// ── FEATURE 7: QR DEVICE SYNC ──
function QRSync({ invs, clis, prods, exps, bizs, onClose, toast }) {
  const [mode, setMode] = useState('export');
  const [qr, setQr] = useState('');
  const [importing, setImporting] = useState(false);

  const generateQR = () => {
    const data = { invs: invs.slice(0, 50), clis, prods, exps: exps.slice(0, 50), bizs, ts: Date.now() };
    const json = JSON.stringify(data);
    const encoded = btoa(encodeURIComponent(json));
    const url = `${window.location.origin}${window.location.pathname}?sync=${encoded.slice(0, 500)}`;
    setQr(`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`);
  };

  const exportData = () => {
    const data = { invs, clis, prods, exps, bizs, ts: Date.now() };
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'sync-' + TD() + '.json'; a.click();
    toast('Data exported! Transfer this file to your other device.', 'success');
  };

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(13,17,23,.72)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16, backdropFilter: 'blur(8px)' }} onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ background: 'white', borderRadius: 'var(--r-xl)', width: '100%', maxWidth: 440, boxShadow: 'var(--sh-xl)', animation: 'slideUp .2s ease' }}>
        <div style={{ padding: '18px 22px', borderBottom: '1px solid var(--bd)', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <div style={{ fontFamily: 'Syne,sans-serif', fontWeight: 800, fontSize: 17 }}>📱 Multi-Device Sync</div>
          <button onClick={onClose} style={{ background: 'var(--gy5)', border: 'none', width: 28, height: 28, borderRadius: '50%', cursor: 'pointer', fontSize: 14 }}>✕</button>
        </div>
        <div style={{ padding: '22px' }}>
          <div style={{ display: 'flex', gap: 8, marginBottom: 20 }}>
            {['export', 'import'].map(m => <button key={m} onClick={() => setMode(m)} style={{ flex: 1, padding: '10px', borderRadius: 'var(--r-sm)', border: '1.5px solid', borderColor: mode === m ? 'var(--or)' : 'var(--bd)', background: mode === m ? 'var(--or)' : 'white', color: mode === m ? 'white' : 'var(--gy)', fontWeight: 700, fontSize: 13, cursor: 'pointer', fontFamily: 'Inter,sans-serif', textTransform: 'capitalize' }}>{m === 'export' ? '📤 This Device' : '📥 New Device'}</button>)}
          </div>
          {mode === 'export' ? (
            <>
              <div style={{ padding: '13px 16px', background: 'var(--bll)', borderRadius: 'var(--r-md)', marginBottom: 16, fontSize: 13, color: 'var(--bl)', lineHeight: 1.65 }}>
                📤 Export your data and transfer to any new device. No internet, no cloud, 100% private.
              </div>
              <Btn v="primary" onClick={exportData} style={{ width: '100%', justifyContent: 'center', marginBottom: 10 }}>📥 Download Sync File</Btn>
              <div style={{ fontSize: 12, color: 'var(--gy2)', textAlign: 'center', lineHeight: 1.6 }}>Transfer this JSON file to your phone/laptop via WhatsApp, USB, or email. Then import it on the new device.</div>
            </>
          ) : (
            <>
              <div style={{ padding: '13px 16px', background: 'var(--gnl)', borderRadius: 'var(--r-md)', marginBottom: 16, fontSize: 13, color: 'var(--gn)', lineHeight: 1.65 }}>
                📥 Import the sync file exported from your other device. This will merge all data.
              </div>
              <input type="file" accept=".json" onChange={e => {
                const f = e.target.files[0]; if (!f) return; setImporting(true);
                const r = new FileReader(); r.onload = ev => {
                  try {
                    const d = JSON.parse(ev.target.result);
                    if (d.invs) localStorage.setItem('ibolt_invs', JSON.stringify(d.invs));
                    if (d.clis) localStorage.setItem('ibolt_clis', JSON.stringify(d.clis));
                    if (d.prods) localStorage.setItem('ibolt_prods', JSON.stringify(d.prods));
                    if (d.exps) localStorage.setItem('ibolt_exps', JSON.stringify(d.exps));
                    if (d.bizs) localStorage.setItem('ibolt_bizs', JSON.stringify(d.bizs));
                    toast('Synced successfully! Refreshing…', 'success');
                    setTimeout(() => window.location.reload(), 1500);
                  } catch { toast('Invalid sync file.', 'error'); }
                  setImporting(false);
                }; r.readAsText(f);
              }} style={{ fontSize: 13, marginBottom: 12 }} />
              {importing && <div style={{ textAlign: 'center', padding: '16px 0', fontSize: 13, color: 'var(--gy)' }}>Importing…</div>}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

// ── FEATURE 8: BULK INVOICE CREATOR ──
function BulkInvoice({ biz, clis, invs, onSaveMany, toast, onClose }) {
  const [rows, setRows] = useState([{ client: '', amount: '', gst: 18, desc: 'Services' }]);
  const [created, setCreated] = useState(false);
  const addRow = () => setRows(p => [...p, { client: '', amount: '', gst: 18, desc: 'Services' }]);
  const upRow = (i, f) => setRows(p => { const r = [...p]; r[i] = { ...r[i], ...f }; return r; });
  const delRow = i => setRows(p => p.filter((_, j) => j !== i));
  const nums = invs.map(i => parseInt((i.number || '').replace(/\D/g, '')) || 0);
  let nextN = (nums.length ? Math.max(...nums) : 0) + 1;

  const createAll = () => {
    const valid = rows.filter(r => r.client && r.amount);
    if (!valid.length) { toast('Add at least one row with client and amount.', 'error'); return; }
    const newInvs = valid.map(r => {
      const base = parseFloat(r.amount); const cgst = base * (r.gst / 2) / 100; const sgst = base * (r.gst / 2) / 100; const total = base + cgst + sgst;
      const cli = clis.find(c => c.name.toLowerCase().includes(r.client.toLowerCase()));
      const n = 'INV-' + String(nextN++).padStart(3, '0');
      return { id: UID(), number: n, type: 'invoice', date: TD(), due: AD(TD(), 30), status: 'unpaid', currency: biz.currency || 'INR', gstType: 'cgst_sgst', createdAt: Date.now(), from: { name: biz.name, gstin: biz.gstin, address: biz.address, phone: biz.phone, email: biz.email, pan: biz.pan }, to: { name: cli?.name || r.client, email: cli?.email || '', phone: cli?.phone || '', address: cli?.address || '', gstin: cli?.gstin || '' }, items: [{ id: UID(), desc: r.desc || 'Services', qty: 1, rate: base, unit: 'pcs', hsn: '', cgst: r.gst / 2, sgst: r.gst / 2, igst: 0, disc: 0 }], notes: biz.defaultNotes || '', footer: biz.footer || '', bankName: biz.bankName || '', bankAcc: biz.bankAcc || '', bankIFSC: biz.bankIFSC || '', upi: biz.upi || '', logo: biz.logo || '', signature: biz.signature || '', po: '', shipping: 0, paid: 0, sub: base, subtotal: base, totalCGST: cgst, totalSGST: sgst, totalIGST: 0, totalDiscount: 0, total, grand: total, bal: total, dc: 0, cg: cgst, sg: sgst, ig: 0 };
    });
    onSaveMany(newInvs);
    setCreated(true);
    toast(`${newInvs.length} invoices created!`, 'success');
  };

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(13,17,23,.72)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16, backdropFilter: 'blur(8px)' }} onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ background: 'white', borderRadius: 'var(--r-xl)', width: '100%', maxWidth: 680, maxHeight: '90vh', overflowY: 'auto', boxShadow: 'var(--sh-xl)', animation: 'slideUp .2s ease' }}>
        <div style={{ padding: '18px 22px', borderBottom: '1px solid var(--bd)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', position: 'sticky', top: 0, background: 'white' }}>
          <div><div style={{ fontFamily: 'Syne,sans-serif', fontWeight: 800, fontSize: 17 }}>📦 Bulk Invoice Creator</div><div style={{ fontSize: 12, color: 'var(--gy2)', marginTop: 1 }}>Create multiple invoices at once</div></div>
          <button onClick={onClose} style={{ background: 'var(--gy5)', border: 'none', width: 28, height: 28, borderRadius: '50%', cursor: 'pointer', fontSize: 14 }}>✕</button>
        </div>
        <div style={{ padding: '20px 22px' }}>
          {!created ? <>
            <table style={{ width: '100%', borderCollapse: 'collapse', marginBottom: 14 }}>
              <thead><tr style={{ background: 'var(--gy6)', borderBottom: '2px solid var(--bd)' }}>
                {['Client Name', 'Description', 'Amount (₹)', 'GST %', ''].map(h => <th key={h} style={{ padding: '9px 10px', fontSize: 11, fontWeight: 700, textTransform: 'uppercase', color: 'var(--gy2)', textAlign: 'left' }}>{h}</th>)}
              </tr></thead>
              <tbody>
                {rows.map((r, i) => <tr key={i} style={{ borderBottom: '1px solid var(--bd)' }}>
                  <td style={{ padding: '7px 6px', width: 180 }}><Inp value={r.client} onChange={e => upRow(i, { client: e.target.value })} placeholder="Client name" style={{ fontSize: 12.5 }} /></td>
                  <td style={{ padding: '7px 6px' }}><Inp value={r.desc} onChange={e => upRow(i, { desc: e.target.value })} placeholder="Services" style={{ fontSize: 12.5 }} /></td>
                  <td style={{ padding: '7px 6px', width: 110 }}><Inp type="number" value={r.amount} onChange={e => upRow(i, { amount: e.target.value })} placeholder="0" style={{ fontSize: 12.5 }} /></td>
                  <td style={{ padding: '7px 6px', width: 80 }}><Sl value={r.gst} onChange={e => upRow(i, { gst: +e.target.value })} style={{ fontSize: 12, padding: '7px 5px' }}>{[0, 5, 12, 18, 28].map(g => <option key={g} value={g}>{g}%</option>)}</Sl></td>
                  <td style={{ padding: '7px 6px', width: 36 }}><button onClick={() => delRow(i)} style={{ width: 28, height: 28, background: 'var(--rdl)', border: 'none', borderRadius: 'var(--r-sm)', color: 'var(--rd)', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{IC.tr}</button></td>
                </tr>)}
              </tbody>
            </table>
            <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
              <Btn v="ghost" sz="sm" onClick={addRow}>{IC.plus} Add Row</Btn>

            </div>
            <div style={{ display: 'flex', gap: 8 }}>
              <Btn v="ghost" onClick={onClose} style={{ flex: 1, justifyContent: 'center' }}>Cancel</Btn>
              <Btn v="primary" onClick={createAll} style={{ flex: 2, justifyContent: 'center' }}>⚡ Create {rows.filter(r => r.client && r.amount).length} Invoices</Btn>
            </div>
          </> : <div style={{ textAlign: 'center', padding: '32px 0' }}>
            <div style={{ fontSize: 52, marginBottom: 14 }}>✅</div>
            <div style={{ fontFamily: 'Syne,sans-serif', fontWeight: 800, fontSize: 20, color: 'var(--gn)', marginBottom: 6 }}>All Invoices Created!</div>
            <div style={{ fontSize: 13, color: 'var(--gy2)', marginBottom: 20 }}>Check Invoices section to view, print or share them.</div>
            <Btn v="primary" onClick={onClose}>Go to Invoices</Btn>
          </div>}
        </div>
      </div>
    </div>
  );
}

// ── LATE FEE CALCULATOR ──
function LateFeeCalc({ inv, biz, onClose, toast }) {
  const [rate, setRate] = useState(18);
  const t = calcT(inv?.items || [], inv?.shipping, inv?.paid);
  const principal = Math.max(0, t.bal);
  const days = inv?.due ? Math.max(0, Math.floor((Date.now() - new Date(inv.due)) / 86400000)) : 0;

  const total = principal + interest;

    <div style={{ position: 'fixed', inset: 0, background: 'rgba(13,17,23,.72)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16, backdropFilter: 'blur(8px)' }} onClick={e => { if (e.target === e.currentTarget) onClose(); }}>

// ── DAILY BUSINESS SCORE ──
function DailyScore({ invs, exps, biz, onClose }) {
  const now = new Date(); const today = TD();
  const ii = invs.filter(i => i.type === 'invoice');
  const overdue = ii.filter(i => i.status === 'overdue' || (i.status !== 'paid' && i.due && i.due < today));
  const dueToday = ii.filter(i => i.status !== 'paid' && i.due === today);
  const paid30 = ii.filter(i => i.status === 'paid' && i.date >= AD(today, -30));
  const pending = ii.filter(i => i.status !== 'paid');
  const revenue30 = paid30.reduce((a, i) => a + i.total, 0);
  const pending30 = pending.reduce((a, i) => a + i.total, 0);
  const payRate = ii.length ? Math.round(paid30.length / Math.max(ii.length, 1) * 100) : 0;
  let score = 100;
  score -= overdue.length * 10;
  score -= dueToday.length * 5;
  score += Math.min(20, Math.floor(revenue30 / 10000));
  score = Math.max(0, Math.min(100, score));
  const grade = score >= 85 ? { l: 'Excellent 🌟', c: 'var(--gn)' } : score >= 65 ? { l: 'Good 👍', c: 'var(--bl)' } : score >= 45 ? { l: 'Average ⚡', c: 'var(--yl)' } : { l: 'Needs Action 🚨', c: 'var(--rd)' };
  const cur = biz.currency || 'INR';
  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(13,17,23,.72)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16, backdropFilter: 'blur(8px)' }} onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ background: 'white', borderRadius: 'var(--r-xl)', width: '100%', maxWidth: 420, boxShadow: 'var(--sh-xl)', animation: 'slideUp .2s ease', overflow: 'hidden' }}>
        <div style={{ background: grade.c, padding: '28px 24px', textAlign: 'center' }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: 'rgba(255,255,255,.7)', textTransform: 'uppercase', letterSpacing: '.8px', marginBottom: 8 }}>Today's Business Score</div>
          <div style={{ fontFamily: 'Syne,sans-serif', fontWeight: 900, fontSize: 72, color: 'white', lineHeight: 1, letterSpacing: '-3px', marginBottom: 6 }}>{score}</div>
          <div style={{ fontSize: 16, fontWeight: 700, color: 'rgba(255,255,255,.9)' }}>{grade.l}</div>
        </div>
        <div style={{ padding: '20px 22px' }}>
          {[
            ['💰 Revenue (30 days)', INR(revenue30, cur), 'var(--gn)'],
            ['⏳ Pending Collection', INR(pending30, cur), 'var(--yl)'],
            ['🔴 Overdue Invoices', overdue.length + ' invoices', overdue.length > 0 ? 'var(--rd)' : 'var(--gn)'],
            ['📅 Due Today', dueToday.length + ' invoices', dueToday.length > 0 ? 'var(--or)' : 'var(--gn)'],
            ['✅ Payment Rate', payRate + '%', payRate >= 80 ? 'var(--gn)' : 'var(--yl)'],
          ].map(([l, v, c]) => (
            <div key={l} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 0', borderBottom: '1px solid var(--bd)' }}>
              <span style={{ fontSize: 13.5, color: 'var(--dk)' }}>{l}</span>
              <span style={{ fontFamily: 'Syne,sans-serif', fontWeight: 800, fontSize: 14, color: c }}>{v}</span>
            </div>
          ))}
          {overdue.length > 0 && (
            <div style={{ marginTop: 14, padding: '12px 14px', background: 'var(--rdl)', borderRadius: 'var(--r-md)', fontSize: 13, color: 'var(--rd)', lineHeight: 1.6 }}>
              🚨 Action needed: {overdue.length} overdue invoice{overdue.length > 1 ? 's' : ''} worth {INR(overdue.reduce((a, i) => a + i.total, 0), cur)}. Follow up today!
            </div>
          )}
          <Btn v="primary" onClick={onClose} style={{ width: '100%', justifyContent: 'center', marginTop: 16 }}>Got It — Let's Go! 💪</Btn>
        </div>
      </div>
    </div>
  );
}

      const res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 600, system: 'You are a tax advisor for Indian small businesses. Give specific, actionable tax saving tips based on their data. Focus on legitimate deductions under Indian Income Tax Act. Use ₹ amounts. Be specific. 5-7 bullet points. Mention Section numbers when relevant.', messages: [{ role: 'user', content: `Business: ${biz.name}. Revenue: ₹${revenue.toLocaleString('en-IN')}. Expenses by category: ${JSON.stringify(expBycat)}. Business type: Small business/proprietorship. Give tax saving tips.` }] }) });
      const d = await res.json();
      setTips(d.content?.[0]?.text || 'Could not generate tips.');
    } catch { setTips('Network error. Please try again.'); }
    setLoading(false);
  };

  useEffect(() => { generate(); }, []);

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(13,17,23,.72)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16, backdropFilter: 'blur(8px)' }} onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ background: 'white', borderRadius: 'var(--r-xl)', width: '100%', maxWidth: 520, maxHeight: '88vh', overflowY: 'auto', boxShadow: 'var(--sh-xl)', animation: 'slideUp .2s ease' }}>
        <div style={{ padding: '18px 22px', borderBottom: '1px solid var(--bd)', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <div><div style={{ fontFamily: 'Syne,sans-serif', fontWeight: 800, fontSize: 17 }}>💡 AI Tax Saving Tips</div><div style={{ fontSize: 12, color: 'var(--gy2)', marginTop: 1 }}>Based on your actual business data</div></div>
          <button onClick={onClose} style={{ background: 'var(--gy5)', border: 'none', width: 28, height: 28, borderRadius: '50%', cursor: 'pointer', fontSize: 14 }}>✕</button>
        </div>
        <div style={{ padding: '20px 22px' }}>
          <div style={{ padding: '12px 14px', background: 'var(--yll)', borderRadius: 'var(--r-md)', marginBottom: 16, fontSize: 13, color: '#92400e', lineHeight: 1.65, border: '1px solid #fcd34d' }}>
            ⚠️ These are general suggestions. Consult your CA before filing returns.
          </div>
          {loading ? <div style={{ textAlign: 'center', padding: '36px 0' }}>
            <div style={{ display: 'flex', gap: 7, justifyContent: 'center', marginBottom: 12 }}><div className="dot" /><div className="dot" /><div className="dot" /></div>
            <div style={{ fontSize: 14, color: 'var(--gy)' }}>AI analyzing your expenses…</div>
          </div> : <div style={{ fontSize: 14, color: 'var(--dk)', lineHeight: 1.9, whiteSpace: 'pre-wrap' }}>{tips}</div>}
          <div style={{ display: 'flex', gap: 8, marginTop: 18 }}>
            <Btn v="ghost" sz="sm" onClick={generate}>🔄 Refresh</Btn>
            <Btn v="primary" sz="sm" onClick={onClose} style={{ flex: 1, justifyContent: 'center' }}>Got It ✓</Btn>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── OFFLINE SERVICE WORKER REGISTRATION ──
function registerSW() {
  if ('serviceWorker' in navigator) {
    const swCode = `
const CACHE = 'eii-v1';
const URLS = ['./', './app.html', './manifest.json'];
self.addEventListener('install', e => e.waitUntil(caches.open(CACHE).then(c => c.addAll(URLS))));
self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request).catch(() => caches.match('./app.html')))));
`;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    navigator.serviceWorker.register(url).catch(() => {});
  }
}

// ── CLIENT ANNIVERSARY REMINDER ──
function checkAnniversaries(clis, invs, toast) {
  const today = new Date();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  clis.forEach(c => {
    if (c.anniversary) {
      const [, m, d] = c.anniversary.split('-');
      if (m === mm && d === dd) toast(`🎉 Today is ${c.name}'s business anniversary! Send them a greeting.`, '');
    }
    const firstInv = invs.filter(i => i.to?.name === c.name).sort((a, b) => new Date(a.date) - new Date(b.date))[0];
    if (firstInv) {
      const [fy, fm, fd] = firstInv.date.split('-');
      if (fm === mm && fd === dd && fy !== String(today.getFullYear())) {
        toast(`🎊 ${c.name} has been your client for ${today.getFullYear() - +fy} year${today.getFullYear() - +fy > 1 ? 's' : ''} today! 🙏`, '');
      }
    }
  });
}

// ── INVOICE VERSIONING ──
function saveVersion(inv) {
  try {
    const key = 'ibolt_ver_' + inv.id;
    const existing = JSON.parse(localStorage.getItem(key) || '[]');
    existing.push({ ...inv, savedAt: new Date().toISOString(), version: existing.length + 1 });
    if (existing.length > 10) existing.shift();
    localStorage.setItem(key, JSON.stringify(existing));
  } catch {}
}

function getVersions(invId) {
  try { return JSON.parse(localStorage.getItem('ibolt_ver_' + invId) || '[]'); } catch { return []; }
}

function InvoiceVersions({ invId, onRestore, onClose }) {
  const versions = getVersions(invId);
  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(13,17,23,.72)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16, backdropFilter: 'blur(8px)' }} onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ background: 'white', borderRadius: 'var(--r-xl)', width: '100%', maxWidth: 480, maxHeight: '85vh', overflowY: 'auto', boxShadow: 'var(--sh-xl)', animation: 'slideUp .2s ease' }}>
        <div style={{ padding: '18px 22px', borderBottom: '1px solid var(--bd)', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <div style={{ fontFamily: 'Syne,sans-serif', fontWeight: 800, fontSize: 17 }}>🕐 Invoice History</div>
          <button onClick={onClose} style={{ background: 'var(--gy5)', border: 'none', width: 28, height: 28, borderRadius: '50%', cursor: 'pointer', fontSize: 14 }}>✕</button>
        </div>
        <div style={{ padding: '18px 22px' }}>
          {!versions.length ? <div style={{ textAlign: 'center', padding: '32px 0', color: 'var(--gy2)' }}>No version history yet. History is saved on each edit.</div> :
            versions.reverse().map((v, i) => (
              <div key={i} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '12px 14px', border: '1.5px solid var(--bd)', borderRadius: 'var(--r-md)', marginBottom: 9 }}>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 13.5, color: 'var(--dk)' }}>Version {v.version}</div>
                  <div style={{ fontSize: 12, color: 'var(--gy2)', marginTop: 2 }}>{new Date(v.savedAt).toLocaleString('en-IN')} · {INR(v.total)}</div>
                </div>
                <Btn v="ghost" sz="sm" onClick={() => { if (confirm('Restore this version?')) { onRestore(v); onClose(); } }}>Restore</Btn>
              </div>
            ))}
        </div>
      </div>
    </div>
  );
}

// ── COMMAND PALETTE (Ctrl+K) ──
function CommandPalette({ onClose, setPg, openNew, setQuickInv, setGstCalc, setBulkInv, setCashFlow, setGstRep, setDailyScore, setReferral }) {
  const [q, setQ] = useState('');
  const [sel, setSel] = useState(0);
  const inpRef = useRef();
  useEffect(() => { setTimeout(() => inpRef.current?.focus(), 50); }, []);
  const cmds = [
    { sec: 'Quick Actions', items: [
      { icon: '⚡', label: 'Quick Invoice — 15 seconds', action: () => { setQuickInv(true); onClose(); } },
      { icon: '🧾', label: 'New Tax Invoice', action: () => { openNew('invoice'); onClose(); } },
      { icon: '📋', label: 'New Estimate', action: () => { openNew('estimate'); onClose(); } },
      { icon: '🧮', label: 'GST Calculator', action: () => { setGstCalc(true); onClose(); } },
      { icon: '📦', label: 'Bulk Invoice Creator', action: () => { setBulkInv(true); onClose(); } },
    ]},
    { sec: 'Navigate', items: [
      { icon: '🏠', label: 'Dashboard', action: () => { setPg('dashboard'); onClose(); } },
      { icon: '🧾', label: 'Invoices', action: () => { setPg('invoices'); onClose(); } },
      { icon: '👥', label: 'Clients', action: () => { setPg('clients'); onClose(); } },
      { icon: '📦', label: 'Products', action: () => { setPg('products'); onClose(); } },
      { icon: '💰', label: 'Expenses', action: () => { setPg('expenses'); onClose(); } },
      { icon: '📊', label: 'Reports', action: () => { setPg('reports'); onClose(); } },
      { icon: '⚙️', label: 'Settings', action: () => { setPg('settings'); onClose(); } },
      { icon: '📒', label: 'Khata Book', action: () => { setPg('khata'); onClose(); } },
    ]},
    { sec: 'AI Tools', items: [
      { icon: '📊', label: 'Cash Flow Predictor', action: () => { setCashFlow(true); onClose(); } },
      { icon: '🧾', label: 'GST Report for CA', action: () => { setGstRep(true); onClose(); } },
      { icon: '🏆', label: 'Daily Business Score', action: () => { setDailyScore(true); onClose(); } },
      { icon: '🎁', label: 'Refer & Earn', action: () => { setReferral(true); onClose(); } },
    ]},
  ];
  const flat = cmds.flatMap(s => s.items.map(i => ({ ...i, sec: s.sec })));
  const filtered = q ? flat.filter(i => i.label.toLowerCase().includes(q.toLowerCase())) : flat;
  const grouped = q ? [{ sec: 'Results', items: filtered }] : cmds;
  useEffect(() => { setSel(0); }, [q]);
  const handleKey = e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setSel(s => Math.min(s + 1, filtered.length - 1)); }
    if (e.key === 'ArrowUp') { e.preventDefault(); setSel(s => Math.max(s - 1, 0)); }
    if (e.key === 'Enter' && filtered[sel]) { filtered[sel].action(); }
    if (e.key === 'Escape') onClose();
  };
  let idx = 0;
  return (
    <div className="cmd-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="cmd-box" style={{ animation: 'slideUp .18s ease' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '0 16px', borderBottom: '1px solid var(--bd)' }}>
          <span style={{ fontSize: 16, color: 'var(--gy2)' }}>🔍</span>
          <input ref={inpRef} className="cmd-inp" value={q} onChange={e => setQ(e.target.value)} onKeyDown={handleKey} placeholder="Search actions, pages, tools…" style={{ flex: 1, padding: '16px 0', border: 'none', fontSize: 15, fontFamily: 'Inter,sans-serif', color: 'var(--dk)', outline: 'none' }} />
          <span style={{ fontSize: 11, color: 'var(--gy2)', background: 'var(--gy5)', padding: '3px 7px', borderRadius: 6, fontWeight: 600 }}>ESC</span>
        </div>
        <div className="cmd-results">
          {(q ? [{ sec: 'Results', items: filtered }] : cmds).map(group => (
            <div key={group.sec}>
              <div className="cmd-sec">{group.sec}</div>
              {group.items.map(item => {
                const i = idx++;
                return (
                  <div key={item.label} className={'cmd-item' + (i === sel ? ' cmd-sel' : '')} onClick={item.action} onMouseEnter={() => setSel(i)}>
                    <div className="cmd-icon">{item.icon}</div>
                    <span style={{ fontSize: 13.5 }}>{item.label}</span>
                    {i === sel && <span style={{ marginLeft: 'auto', fontSize: 11, color: 'var(--gy2)', background: 'var(--gy5)', padding: '2px 7px', borderRadius: 5 }}>↵</span>}
                  </div>
                );
              })}
            </div>
          ))}
          {filtered.length === 0 && <div style={{ padding: '28px', textAlign: 'center', color: 'var(--gy2)', fontSize: 14 }}>No results for "{q}"</div>}
        </div>
        <div style={{ padding: '8px 16px', borderTop: '1px solid var(--bd)', display: 'flex', gap: 16, fontSize: 11, color: 'var(--gy2)' }}>
          <span>↑↓ Navigate</span><span>↵ Select</span><span>ESC Close</span>
        </div>
      </div>
    </div>
  );
}

function EmptyState({ icon, title, sub, cta, onCta }) {
  return (
    <div className="empty-state">
      <div className="es-icon" style={{ animation: 'float 3s ease-in-out infinite' }}>{icon}</div>
      <div className="es-title">{title}</div>
      <div className="es-sub">{sub}</div>
      {cta && <button onClick={onCta} style={{ padding: '12px 28px', background: 'var(--or)', color: 'white', border: 'none', borderRadius: 'var(--r-md)', fontWeight: 700, fontSize: 14, cursor: 'pointer', fontFamily: 'Inter,sans-serif', boxShadow: '0 4px 16px rgba(255,107,53,.35)', transition: 'all .2s' }}
        onMouseEnter={e => { e.currentTarget.style.transform = 'translateY(-2px)'; e.currentTarget.style.boxShadow = '0 8px 24px rgba(255,107,53,.45)'; }}
        onMouseLeave={e => { e.currentTarget.style.transform = ''; e.currentTarget.style.boxShadow = '0 4px 16px rgba(255,107,53,.35)'; }}>

      </button>}

  );
}
