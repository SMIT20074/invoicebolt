<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --or:#FF6B35;--orl:#fff4ef;--orb:#ffd4c0;
  --bl:#3B5BDB;--bll:#eef2ff;
  --gn:#2f9e44;--gnl:#ebfbee;
  --rd:#e03131;--rdl:#fff5f5;
  --yl:#f59f00;--yll:#fff9db;
  --pu:#7048e8;
  --dk:#0d1117;--dk3:#2d3748;
  --gy:#6b7280;--gy2:#9ca3af;--gy3:#d1d5db;--gy4:#e5e7eb;--gy5:#f3f4f6;--gy6:#f9fafb;
  --bd:#e2e8f0;
  --sh-xs:0 1px 2px rgba(0,0,0,.05);
  --sh-sm:0 2px 4px rgba(0,0,0,.08);
  --sh-md:0 10px 15px rgba(0,0,0,.1);
  --sh-lg:0 20px 25px rgba(0,0,0,.1);
  --sh-xl:0 25px 50px rgba(0,0,0,.15);
  --r-sm:6px;--r:10px;--r-md:14px;--r-xl:24px;
}
body{font-family:Inter,sans-serif;background:var(--gy5);color:var(--dk);font-size:14px;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--gy3);border-radius:10px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bk{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,107,53,.4)}50%{box-shadow:0 0 0 12px rgba(255,107,53,0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.fu{animation:fadeUp .25s ease both;}
.sp{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}
.dot{width:7px;height:7px;background:var(--gy3);border-radius:50%;animation:bk .9s ease infinite;}
.dot:nth-child(2){animation-delay:.18s;}.dot:nth-child(3){animation-delay:.36s;}
.tg{position:relative;width:42px;height:24px;display:inline-block;cursor:pointer;}
.tg input{opacity:0;width:0;height:0;}
.tgl{position:absolute;inset:0;background:var(--gy3);border-radius:100px;transition:.22s;cursor:pointer;}
.tgl:before{content:"";position:absolute;width:18px;height:18px;background:white;border-radius:50%;left:3px;top:3px;transition:.22s;}
.tg input:checked+.tgl{background:var(--or);}
.tg input:checked+.tgl:before{transform:translateX(18px);}
.ai-fab{position:fixed;bottom:28px;right:28px;z-index:600;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--or),#e63c00);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(255,107,53,.45);animation:glow 2.5s ease infinite;transition:transform .2s;}
.ai-fab:hover{transform:scale(1.08);}
.cbub{max-width:86%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word;}
.cu{background:var(--or);color:white;border-radius:14px 14px 4px 14px;align-self:flex-end;}
.ca{background:white;color:var(--dk);border-radius:14px 14px 14px 4px;border:1px solid var(--bd);}
.mic-btn{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;background:var(--gy5);color:var(--gy);}
.mic-on{background:var(--rd)!important;color:white!important;animation:pulse 1s ease infinite;}
.ad{background:var(--gy6);border:1.5px dashed var(--gy3);border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--gy3);font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;}
.tr-h:hover td{background:var(--gy6)!important;cursor:pointer;}
.ch{transition:transform .2s,box-shadow .2s;}
.ch:hover{transform:translateY(-2px);box-shadow:var(--sh-md);}
@media print{.sb,.ai-fab,.nopr{display:none!important;}.main{margin-left:0!important;}}
</style>

<div id="root"></div>
<script>
function buildHTML(inv,tpl,df){
  tpl=tpl||"Classic";df=df||"DD/MM/YYYY";
  var t=inv.total||0;
  var fromN=inv.from?inv.from.name||"Your Business":"Your Business";
  var toN=inv.to?inv.to.name||"Client":"Client";
  var styles="*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;}body{padding:32px;color:#111;}";
  styles+=".inv{max-width:800px;margin:0 auto;}.hdr{display:flex;justify-content:space-between;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid #FF6B35;}";
  styles+=".biz{font-size:20px;font-weight:900;color:#FF6B35;}.inv-no{font-size:13px;color:#666;}.section{margin-bottom:16px;}";
  styles+=".label{font-size:10px;font-weight:700;text-transform:uppercase;color:#999;margin-bottom:4px;}.value{font-size:14px;font-weight:600;}";
  styles+="table{width:100%;border-collapse:collapse;margin:16px 0;}th{background:#FF6B35;color:white;padding:10px;font-size:12px;text-align:left;}";
  styles+="td{padding:9px 10px;border-bottom:1px solid #eee;font-size:13px;}.total-row{background:#fff4ef;font-weight:700;font-size:15px;}";
  styles+=".grand{background:#FF6B35;color:white;font-weight:900;font-size:17px;}.footer{margin-top:24px;padding-top:16px;border-top:1px solid #eee;font-size:12px;color:#999;}";
  
  var rows="";
  (inv.items||[]).forEach(function(it){
    var base=(+it.qty||0)*(+it.rate||0);
    var disc=base*(+it.disc||0)/100;
    var net=base-disc;
    var tax=net*((+it.cgst||0)+(+it.sgst||0)+(+it.igst||0))/100;
    rows+="<tr><td>"+it.desc+"</td><td>"+it.qty+" "+it.unit+"</td><td>&#8377;"+it.rate+"</td>";
    rows+="<td>"+((+it.cgst||0)+(+it.sgst||0)+(+it.igst||0))+"%</td><td>&#8377;"+(net+tax).toFixed(2)+"</td></tr>";
  });
  
  var html="<!DOCTYPE html><html><head><meta charset=UTF-8>";
  html+="<title>"+inv.number+"</title>";
  html+="<style>"+styles+"</style></head><body><div class=inv>";
  html+="<div class=hdr><div><div class=biz>"+fromN+"</div>";
  if(inv.from&&inv.from.gstin)html+="<div style=font-size:12px;color:#666;>GSTIN: "+inv.from.gstin+"</div>";
  html+="</div><div style=text-align:right;><div style=font-size:22px;font-weight:900;color:#FF6B35;>"+inv.type.toUpperCase()+"</div>";
  html+="<div class=inv-no>#"+inv.number+"</div>";
  html+="<div style=font-size:12px;color:#666;>Date: "+inv.date+"</div></div></div>";
  html+="<div style=display:flex;gap:32px;margin-bottom:16px;>";
  html+="<div class=section><div class=label>From</div><div class=value>"+fromN+"</div>";
  if(inv.from&&inv.from.address)html+="<div style=font-size:12px;color:#666;>"+inv.from.address+"</div>";
  html+="</div><div class=section><div class=label>To</div><div class=value>"+toN+"</div>";
  if(inv.to&&inv.to.address)html+="<div style=font-size:12px;color:#666;>"+inv.to.address+"</div>";
  if(inv.to&&inv.to.gstin)html+="<div style=font-size:12px;color:#666;>GSTIN: "+inv.to.gstin+"</div>";
  html+="</div></div>";
  html+="<table><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Tax</th><th>Amount</th></tr></thead>";
  html+="<tbody>"+rows+"</tbody></table>";
  html+="<div style=max-width:280px;margin-left:auto;>";
  html+="<div class=total-row style=padding:8px;display:flex;justify-content:space-between;><span>Total</span><span>&#8377;"+(t).toFixed(2)+"</span></div>";
  html+="</div>";
  if(inv.upi)html+="<div class=footer>UPI: "+inv.upi+"</div>";
  if(inv.footer)html+="<div class=footer>"+inv.footer+"</div>";
  html+="</div></body></html>";
  return html;
}
</script>

<script type="text/babel">

const {useState,useEffect,useRef,useMemo}=React;

const INR=(n,c)=>{c=c||'INR';const s={INR:'₹',USD:'$',EUR:'€',GBP:'£',AED:'AED'};return (s[c]||'₹')+parseFloat(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});};
const TD=()=>new Date().toISOString().split('T')[0];
const AD=(d,n)=>{const dt=new Date(d||TD());dt.setDate(dt.getDate()+n);return dt.toISOString().split('T')[0];};
const UID=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const INI=s=>(s||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const FD=(d,f)=>{f=f||'DD/MM/YYYY';if(!d)return '';const[y,m,day]=d.split('-');return f==='MM/DD/YYYY'?m+'/'+day+'/'+y:f==='YYYY-MM-DD'?d:day+'/'+m+'/'+y;};
const ld=k=>{try{return JSON.parse(localStorage.getItem('eiv4_'+k)||'null')}catch{return null}};
const sv=(k,v)=>{try{localStorage.setItem('eiv4_'+k,JSON.stringify(v))}catch{}};
const WDS=n=>{if(!n||n===0)return 'Zero Rupees Only';const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];const tw=x=>{if(x<20)return a[x];if(x<100)return b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');if(x<1000)return a[Math.floor(x/100)]+' Hundred'+(x%100?' and '+tw(x%100):'');if(x<100000)return tw(Math.floor(x/1000))+' Thousand'+(x%1000?' '+tw(x%1000):'');if(x<10000000)return tw(Math.floor(x/100000))+' Lakh'+(x%100000?' '+tw(x%100000):'');return tw(Math.floor(x/10000000))+' Crore'+(x%10000000?' '+tw(x%10000000):'');};return tw(Math.round(Math.abs(n)))+' Rupees Only';};
function calcT(items,ship,paid){items=items||[];let sub=0,cg=0,sg=0,ig=0,dc=0;items.forEach(it=>{const b=(+it.qty||0)*(+it.rate||0);const d=b*(+it.disc||0)/100;sub+=b;dc+=d;cg+=(b-d)*(+it.cgst||0)/100;sg+=(b-d)*(+it.sgst||0)/100;ig+=(b-d)*(+it.igst||0)/100;});const grand=sub-dc+cg+sg+ig+(+ship||0);return {sub,cg,sg,ig,dc,grand,bal:grand-(+paid||0),subtotal:sub,totalCGST:cg,totalSGST:sg,totalIGST:ig,totalDiscount:dc,total:grand};}


const I=(d,w,h)=>{w=w||16;h=h||16;return <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{width:w,height:h,flexShrink:0}}>{d}</svg>;};
const IC={
  dash:I(<><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></>),
  inv:I(<><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></>),
  est:I(<><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></>),
  del:I(<><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h5l2 4v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></>),
  po:I(<><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></>),
  cn:I(<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></>),
  exp:I(<><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></>),
  cli:I(<><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>),
  prd:I(<><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></>),
  rep:I(<><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></>),
  set:I(<><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></>),
  biz:I(<><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></>),
  rec:I(<><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></>),
  plus:I(<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,14,14),
  eye:I(<><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></>,14,14),
  prt:I(<><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></>,14,14),
  tr:I(<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></>,13,13),
  ed:I(<><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></>,13,13),

  snd:I(<><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></>,14,14),
  dw:I(<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>,14,14),
  bell:I(<><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></>,14,14),
  chart:I(<><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></>,14,14),
};

function Inp({style,...p}){const[f,sF]=useState(false);return <input {...p} style={{padding:"9px 12px",border:"1.5px solid "+(f?"var(--or)":"var(--bd)"),borderRadius:"var(--r-sm)",fontSize:13,color:"var(--dk)",fontFamily:"Inter,sans-serif",outline:"none",background:"white",width:"100%",transition:"border-color .15s",boxShadow:f?"0 0 0 3px rgba(255,107,53,.1)":"none",...style}} onFocus={()=>sF(true)} onBlur={()=>sF(false)}/>;}
function Sl({style,...p}){return <select {...p} style={{padding:"9px 12px",border:"1.5px solid var(--bd)",borderRadius:"var(--r-sm)",fontSize:13,color:"var(--dk)",fontFamily:"Inter,sans-serif",outline:"none",background:"white",width:"100%",cursor:"pointer",...style}}/>;}
function Ta({style,...p}){const[f,sF]=useState(false);return <textarea {...p} style={{padding:"9px 12px",border:"1.5px solid "+(f?"var(--or)":"var(--bd)"),borderRadius:"var(--r-sm)",fontSize:13,color:"var(--dk)",fontFamily:"Inter,sans-serif",outline:"none",background:"white",resize:"vertical",width:"100%",minHeight:64,...style}} onFocus={()=>sF(true)} onBlur={()=>sF(false)}/>;}
function Btn({v,sz,style,children,...p}){v=v||"primary";sz=sz||"md";
  const sizes={sm:{padding:"5px 11px",fontSize:11.5,borderRadius:"var(--r-sm)"},md:{padding:"8px 16px",fontSize:13,borderRadius:"var(--r-sm)"},lg:{padding:"11px 22px",fontSize:14,borderRadius:"var(--r)"}};
  const vars={primary:{background:"var(--or)",color:"white",boxShadow:"0 2px 4px rgba(255,107,53,.3)"},secondary:{background:"var(--bl)",color:"white"},ghost:{background:"white",color:"var(--dk3)",border:"1.5px solid var(--bd)"},danger:{background:"var(--rdl)",color:"var(--rd)",border:"none"},success:{background:"var(--gnl)",color:"var(--gn)",border:"none"}};
  return <button {...p} style={{display:"inline-flex",alignItems:"center",gap:6,fontFamily:"Inter,sans-serif",fontWeight:600,cursor:"pointer",border:"none",whiteSpace:"nowrap",transition:"all .15s",...sizes[sz],...vars[v],...style}}>{children}</button>;}
function Bdg({st}){const m={paid:{bg:"#ebfbee",c:"#2f9e44"},unpaid:{bg:"#eef2ff",c:"#3B5BDB"},overdue:{bg:"#fff5f5",c:"#e03131"},draft:{bg:"var(--gy5)",c:"var(--gy)"},partial:{bg:"#fff9db",c:"#f59f00"},pending:{bg:"#fff9db",c:"#f59f00"},approved:{bg:"#ebfbee",c:"#2f9e44"},cancelled:{bg:"#fff5f5",c:"#e03131"}};const s=m[st]||m.draft;return <span style={{display:"inline-flex",alignItems:"center",gap:5,padding:"3px 9px",borderRadius:100,fontSize:11,fontWeight:700,background:s.bg,color:s.c}}><span style={{width:5,height:5,borderRadius:"50%",background:s.c,display:"inline-block",flexShrink:0}}/>{(st||"draft").charAt(0).toUpperCase()+(st||"draft").slice(1)}</span>;}
function Toast({ts}){return <div style={{position:"fixed",bottom:24,right:24,zIndex:1000,display:"flex",flexDirection:"column",gap:8}}>{ts.map(t=><div key={t.id} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 18px",background:t.tp==="success"?"#0d4a2f":t.tp==="error"?"#4a0d0d":"var(--dk)",color:"white",borderRadius:"var(--r-md)",fontSize:13,fontWeight:500,boxShadow:"var(--sh-lg)",maxWidth:320,animation:"fadeUp .2s ease",borderLeft:"3px solid "+(t.tp==="success"?"#40c057":t.tp==="error"?"#ff6b6b":"var(--or)")}}><span style={{fontSize:16}}>{t.tp==="success"?"✓":t.tp==="error"?"✕":"ℹ"}</span>{t.msg}</div>)}</div>;}
function Card({children,style}){return <div style={{background:"white",borderRadius:"var(--r-md)",border:"1px solid var(--bd)",boxShadow:"var(--sh-xs)",...style}}>{children}</div>;}
function Stat({label,value,sub,color,icon}){return <div style={{background:"white",borderRadius:"var(--r-md)",padding:"18px 20px",border:"1px solid var(--bd)",boxShadow:"var(--sh-xs)"}}><div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:10}}><div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:".6px",color:"var(--gy2)"}}>{label}</div>{icon&&<div style={{width:34,height:34,borderRadius:"var(--r-sm)",background:"var(--orl)",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--or)",flexShrink:0}}>{icon}</div>}</div><div style={{fontFamily:"Syne,sans-serif",fontSize:22,fontWeight:900,color:color||"var(--dk)",letterSpacing:"-1px",lineHeight:1.1}}>{value}</div>{sub&&<div style={{fontSize:12,color:"var(--gy2)",marginTop:5}}>{sub}</div>}</div>;}
const MH=t=><div style={{padding:"13px 19px",borderBottom:"1px solid var(--bd)",fontWeight:700,fontSize:14,background:"var(--gy6)",borderRadius:"var(--r-md) var(--r-md) 0 0"}}>{t}</div>;
const fg=(lbl,el,mb)=><div style={{display:"flex",flexDirection:"column",gap:5,marginBottom:mb||12}}><label style={{fontSize:11,fontWeight:600,color:"var(--dk3)",letterSpacing:".2px"}}>{lbl}</label>{el}</div>;
const R2=(a,b)=><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:13,marginBottom:13}}>{a}{b}</div>;
const R3=(a,b,c)=><div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:13,marginBottom:13}}>{a}{b}{c}</div>;
const R4=(a,b,c,d)=><div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:13,marginBottom:13}}>{a}{b}{c}{d}</div>;

function App(){
  const [pg,setPg]=useState("dashboard");

  const [bizs,setBizs]=useState(()=>ld("bizs")||[{id:"def",name:"My Business",email:"",phone:"",address:"",gstin:"",pan:"",logo:"",signature:"",bankName:"",bankAcc:"",bankIFSC:"",upi:"",footer:"Thank you for your business!",currency:"INR",dateFormat:"DD/MM/YYYY",defCGST:9,defSGST:9,defaultNotes:"",website:""}]);
  const [abiz,setAbiz]=useState(()=>ld("abiz")||"def");
  const [tpl,setTpl]=useState(()=>ld("tpl")||"Classic");
  const [ts,setTs]=useState([]);
  const [prev,setPrev]=useState(null);
  const [editI,setEditI]=useState(null);
  const [agOpen,setAgOpen]=useState(false);
  const [quickInv,setQuickInv]=useState(false);
  const [gstCalc,setGstCalc]=useState(false);
  const [waRem,setWaRem]=useState(null);
  const [gstinVal,setGstinVal]=useState(false);
  const [cardScan,setCardScan]=useState(false);
  const [csvImp,setCsvImp]=useState(null);
  const [festTheme,setFestTheme]=useState(null);
  const biz=useMemo(()=>bizs.find(b=>b.id===abiz)||bizs[0]||{},[bizs,abiz]);
  useEffect(()=>sv("invs",invs),[invs]);useEffect(()=>sv("clis",clis),[clis]);useEffect(()=>sv("prods",prods),[prods]);useEffect(()=>sv("exps",exps),[exps]);useEffect(()=>sv("bizs",bizs),[bizs]);useEffect(()=>sv("abiz",abiz),[abiz]);useEffect(()=>sv("tpl",tpl),[tpl]);
  const toast=(msg,tp)=>{const id=UID();setTs(t=>[...t,{id,msg,tp:tp||""}]);setTimeout(()=>setTs(t=>t.filter(x=>x.id!==id)),3500);};
  const saveInv=inv=>{setInvs(p=>{const ex=p.find(x=>x.id===inv.id);return ex?p.map(x=>x.id===inv.id?inv:x):[inv,...p];});toast("Saved!","success");const tp=inv.type;setPg(tp==="estimate"?"estimates":tp==="delivery"?"delivery":tp==="po"?"pos":tp==="credit"||tp==="debit"?"credits":"invoices");setEditI(null);};

  const dupInv=id=>{const inv=invs.find(x=>x.id===id);if(!inv)return;const nums=invs.map(i=>parseInt((i.number||"").replace(/\D/g,""))||0);const n={...inv,id:UID(),number:"INV-"+String((nums.length?Math.max(...nums):0)+1).padStart(3,"0"),status:"draft",date:TD(),createdAt:Date.now()};setInvs(p=>[n,...p]);toast("Duplicated!","success");};
  const convEst=id=>{setInvs(p=>p.map(x=>x.id===id?{...x,type:"invoice",status:"unpaid"}:x));toast("Converted to Invoice!","success");};
  const openNew=(type,pre)=>{setEditI({_new:true,type:type||"invoice",...(pre||{})});setPg("create");};
  const openEdit=id=>{setEditI(invs.find(x=>x.id===id));setPg("create");};
  const doPrint=inv=>{const w=window.open("","_blank");w.document.write(buildHTML({...inv,...calcT(inv.items,inv.shipping,inv.paid)},tpl,biz.dateFormat||"DD/MM/YYYY"));w.document.close();setTimeout(()=>w.print(),700);};
  const setBF=upd=>setBizs(p=>p.map(b=>b.id===abiz?{...b,...upd}:b));
  const tpls=["Classic","Modern","Minimal","Saffron","Corporate","Royal","Emerald","Crimson"];
  const ovrd=invs.filter(i=>i.type==="invoice"&&i.status==="overdue").length;
  const isC=pg==="create";
  const navG=[
    {lbl:"OVERVIEW",items:[{id:"dashboard",lbl:"Dashboard",ic:IC.dash}]},
    {lbl:"DOCUMENTS",items:[{id:"invoices",lbl:"Invoices",ic:IC.inv,cnt:ovrd},{id:"estimates",lbl:"Estimates",ic:IC.est},{id:"delivery",lbl:"Delivery Notes",ic:IC.del},{id:"pos",lbl:"Purchase Orders",ic:IC.po},{id:"credits",lbl:"Credit/Debit Notes",ic:IC.cn},{id:"recurring",lbl:"Recurring",ic:IC.rec}]},
    {lbl:"FINANCE",items:[{id:"expenses",lbl:"Expenses",ic:IC.exp},{id:"reports",lbl:"Reports",ic:IC.rep}]},
    {lbl:"MASTER",items:[{id:"clients",lbl:"Clients",ic:IC.cli},{id:"products",lbl:"Products",ic:IC.prd},{id:"businesses",lbl:"Businesses",ic:IC.biz}]},
    {lbl:"SYSTEM",items:[{id:"settings",lbl:"Settings",ic:IC.set}]},
  ];
  const pgL={dashboard:"Dashboard",invoices:"Invoices",estimates:"Estimates",delivery:"Delivery Notes",pos:"Purchase Orders",credits:"Credit/Debit Notes",recurring:"Recurring",expenses:"Expenses",reports:"Reports & Analytics",clients:"Clients",products:"Products & Services",businesses:"My Businesses",settings:"Settings",create:editI&&editI._new?"New Document":"Edit Document"};

  return <div style={{display:"flex",minHeight:"100vh"}}>
    <aside className="sb" style={{width:238,background:"#0d1117",display:"flex",flexDirection:"column",position:"fixed",top:0,left:0,bottom:0,zIndex:100,overflowY:"auto"}}>
      <div style={{padding:"18px 16px 12px",borderBottom:"1px solid rgba(255,255,255,.06)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:13}}>
          {biz.logo?<img src={biz.logo} style={{width:30,height:30,borderRadius:8,objectFit:"cover"}} alt=""/>:<div style={{width:30,height:30,borderRadius:8,background:"linear-gradient(135deg,var(--or),#e63c00)",display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontFamily:"Syne,sans-serif",fontSize:11,fontWeight:900,flexShrink:0}}>EI</div>}
          <div><div style={{fontFamily:"Syne,sans-serif",fontWeight:900,fontSize:15,color:"white",letterSpacing:"-.3px"}}>Easy<span style={{color:"var(--or)"}}>Invoice</span></div><div style={{fontSize:9.5,color:"rgba(255,255,255,.3)",marginTop:1}}>🇮🇳 Indian GST Ready</div></div>
        </div>
        <button style={{display:"flex",alignItems:"center",gap:7,width:"100%",padding:"9px 12px",background:"linear-gradient(135deg,rgba(118,75,162,.5),rgba(102,126,234,.5))",border:"1px solid rgba(118,75,162,.35)",borderRadius:"var(--r)",cursor:"pointer",color:"white",fontSize:12.5,fontWeight:600,fontFamily:"Inter,sans-serif",transition:"all .2s"}} onClick={()=>setAgOpen(true)}>
          <span style={{fontSize:15}}>⚡</span>AI Agent<span style={{marginLeft:"auto",fontSize:9,background:"rgba(255,255,255,.15)",padding:"2px 6px",borderRadius:100,fontWeight:700}}>VOICE</span>
        </button>
      </div>
      <nav style={{flex:1,padding:"6px 0",overflowY:"auto"}}>
        {navG.map(g=><div key={g.lbl}>
          <div style={{fontSize:9,fontWeight:700,letterSpacing:"1px",color:"rgba(255,255,255,.2)",padding:"10px 16px 3px"}}>{g.lbl}</div>
          {g.items.map(n=>{const act=pg===n.id;return <div key={n.id} style={{display:"flex",alignItems:"center",gap:9,padding:"9px 16px",color:act?"white":"rgba(255,255,255,.5)",fontSize:12.5,fontWeight:act?700:500,cursor:"pointer",background:act?"rgba(255,107,53,.15)":"transparent",borderRight:act?"3px solid var(--or)":"none",transition:"all .15s"}} onClick={()=>{if(n.id!==pg)setEditI(null);setPg(n.id);}}>{n.ic}<span style={{flex:1}}>{n.lbl}</span>{n.cnt>0&&<span style={{minWidth:18,height:18,borderRadius:9,background:"var(--or)",color:"white",fontSize:10,fontWeight:700,display:"inline-flex",alignItems:"center",justifyContent:"center",padding:"0 4px"}}>{n.cnt}</span>}</div>;})}
        </div>)}
      </nav>
      <div style={{padding:"8px 10px",borderTop:"1px solid rgba(255,255,255,.06)"}}>
        <select value={abiz} onChange={e=>setAbiz(e.target.value)} style={{width:"100%",background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.1)",color:"white",fontSize:12,padding:"7px 9px",borderRadius:"var(--r-sm)",cursor:"pointer",fontFamily:"Inter,sans-serif",outline:"none"}}>
          {bizs.map(b=><option key={b.id} value={b.id} style={{background:"#0d1117"}}>{b.name}</option>)}
        </select>
      </div>
    </aside>
    <div className="main" style={{marginLeft:238,flex:1,display:"flex",flexDirection:"column",minHeight:"100vh"}}>
      <div className="topbar" style={{background:"white",borderBottom:"1px solid var(--bd)",padding:"0 22px",height:56,display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50,boxShadow:"var(--sh-xs)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{fontFamily:"Syne,sans-serif",fontWeight:800,fontSize:17,letterSpacing:"-.4px"}}>{pgL[pg]||""}</div>
          {ovrd>0&&<div style={{display:"flex",alignItems:"center",gap:5,padding:"4px 10px",background:"var(--rdl)",borderRadius:"var(--r-sm)",color:"var(--rd)",fontSize:12,fontWeight:600,cursor:"pointer"}} onClick={()=>setPg("invoices")}>{IC.bell}{ovrd} Overdue</div>}
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <div className="ad nopr" style={{width:190,height:34,fontSize:10}}>Advertisement</div>
          <Btn v="ghost" sz="sm" onClick={()=>setGstinVal(true)} title="Validate GSTIN">🔍 GSTIN</Btn>
          <Btn v="ghost" sz="sm" onClick={()=>setCardScan(true)} title="Scan Business Card">📇 Card</Btn>
          <Btn v="ghost" sz="sm" onClick={()=>setCsvImp("clients")} title="Import CSV">📥 Import</Btn>
          <Btn v="ghost" sz="sm" onClick={()=>setTpl(t=>{const ts=["Classic","Modern","Minimal","Saffron","Corporate","Royal","Emerald","Crimson"];return ts[(ts.indexOf(t)+1)%ts.length];})}>🎨 {tpl}</Btn>
          <Btn v="primary" sz="sm" style={{background:"var(--gn)"}} onClick={()=>setQuickInv(true)}>⚡ Quick</Btn>
          <Btn v="ghost" sz="sm" onClick={()=>setGstCalc(true)}>🧮 GST</Btn>
          <Btn v="primary" sz="sm" onClick={()=>openNew("invoice")}>{IC.plus}New Invoice</Btn>
        </div>
      </div>
      <div style={{padding:20,flex:1}}>
        <div className="ad nopr" style={{height:66,marginBottom:16,width:"100%",borderRadius:"var(--r-md)"}}>Google AdSense / Media.net Advertisement</div>
        {pg==="dashboard"&&<Dash invs={invs} clis={clis} exps={exps} biz={biz} onNew={openNew} onPrev={setPrev}/>}
        {pg==="invoices"&&<DocList docs={invs.filter(i=>i.type==="invoice")} lbl="Invoice" onNew={()=>openNew("invoice")} onEdit={openEdit} onDel={delInv} onPaid={markPaid} onDup={dupInv} onPrev={setPrev} onPrt={doPrint} biz={biz}/>}
        {pg==="estimates"&&<DocList docs={invs.filter(i=>i.type==="estimate")} lbl="Estimate" onNew={()=>openNew("estimate")} onEdit={openEdit} onDel={delInv} onConv={convEst} onPrev={setPrev} onPrt={doPrint} biz={biz}/>}
        {pg==="delivery"&&<DocList docs={invs.filter(i=>i.type==="delivery")} lbl="Delivery Note" onNew={()=>openNew("delivery")} onEdit={openEdit} onDel={delInv} onPrev={setPrev} onPrt={doPrint} biz={biz}/>}
        {pg==="pos"&&<DocList docs={invs.filter(i=>i.type==="po")} lbl="Purchase Order" onNew={()=>openNew("po")} onEdit={openEdit} onDel={delInv} onPrev={setPrev} onPrt={doPrint} biz={biz}/>}
        {pg==="credits"&&<DocList docs={invs.filter(i=>i.type==="credit"||i.type==="debit")} lbl="Credit/Debit Note" onNew={()=>openNew("credit")} onEdit={openEdit} onDel={delInv} onPrev={setPrev} onPrt={doPrint} biz={biz}/>}
        {pg==="recurring"&&<RecurPage invs={invs} biz={biz} onEdit={openEdit} onPrev={setPrev}/>}
        {pg==="khata"&&<KhataPage clis={clis} invs={invs} biz={biz}/>}
        {pg==="expenses"&&<ExpPage exps={exps} setExps={setExps} toast={toast}/>}
        {pg==="clients"&&<CliPage clis={clis} setClis={setClis} invs={invs} toast={toast} onNewInv={c=>openNew("invoice",{_cli:c})}/>}
        {pg==="products"&&<ProdPage prods={prods} setProds={setProds} toast={toast}/>}
        {pg==="businesses"&&<BizPage bizs={bizs} setBizs={setBizs} abiz={abiz} setAbiz={setAbiz} toast={toast}/>}
        {pg==="reports"&&<RepPage invs={invs} exps={exps} clis={clis} biz={biz}/>}
        {pg==="settings"&&<SetPage biz={biz} setBiz={setBF} tpl={tpl} setTpl={setTpl} toast={toast} tpls={tpls}/>}
        {pg==="create"&&<Editor key={editI&&(editI.id||"new-"+editI.type)} init={editI} biz={biz} clis={clis} prods={prods} invs={invs} onSave={saveInv} onPrev={setPrev} onBack={()=>{setPg(editI&&editI.type==="estimate"?"estimates":editI&&editI.type==="delivery"?"delivery":editI&&editI.type==="po"?"pos":editI&&(editI.type==="credit"||editI.type==="debit")?"credits":"invoices");setEditI(null);}} toast={toast} tpl={tpl} onPrt={doPrint}/>}
      </div>
    </div>
    {prev&&<PrevMod inv={prev} tpl={tpl} biz={biz} onClose={()=>setPrev(null)} onPrt={()=>doPrint(prev)}/>}
    <button className="ai-fab" onClick={()=>setAgOpen(true)} title="AI Invoice Agent">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{width:26,height:26}}><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    </button>
    {agOpen&&<AIAgent onClose={()=>setAgOpen(false)} biz={biz} clis={clis} prods={prods} invs={invs} toast={toast} onGen={inv=>{setEditI(inv);setAgOpen(false);setPg("create");toast("AI invoice ready!","success");}} onAct={(act,id)=>{if(act==="paid")markPaid(id);if(act==="view"){const i=invs.find(x=>x.id===id);if(i)setPrev(i);}}}/>}
    {gstinVal&&<GSTINValidator onClose={()=>setGstinVal(false)}/>}
    {waRem&&<WAReminder inv={waRem} biz={biz} onClose={()=>setWaRem(null)} toast={toast}/>}
    {cardScan&&<BizCardScanner onSave={c=>{setClis(p=>[{id:UID(),...c},...p]);}} onClose={()=>setCardScan(false)} toast={toast}/>}
    {csvImp&&<CSVImport type={csvImp} onImport={items=>{if(csvImp==="clients")setClis(p=>[...items,...p]);else setProds(p=>[...items,...p]);}} onClose={()=>setCsvImp(null)} toast={toast}/>}
    <PWAInstallBanner onDismiss={()=>{}}/>
    {quickInv&&<QuickInvoice biz={biz} clis={clis} invs={invs} onSave={saveInv} toast={toast} onClose={()=>setQuickInv(false)}/>}
    {gstCalc&&<GSTCalc onClose={()=>setGstCalc(false)}/>}
    <Toast ts={ts}/>
  </div>;
}

function PrevMod({inv,tpl,biz,onClose,onPrt}){
  const ac={Classic:"#FF6B35",Modern:"#3B5BDB",Minimal:"#1a1a1a",Saffron:"#FF9933",Corporate:"#1a5276",Royal:"#7048e8",Emerald:"#2f9e44",Crimson:"#c92a2a"}[tpl]||"#FF6B35";
  const t=calcT(inv.items,inv.shipping,inv.paid);const F=n=>INR(n,inv.currency||"INR");const df=biz.dateFormat||"DD/MM/YYYY";
  const hD=(inv.items||[]).some(i=>(+i.disc)>0);const hC=(inv.items||[]).some(i=>(+i.cgst)>0);const hI=(inv.items||[]).some(i=>(+i.igst)>0);
  return <div style={{position:"fixed",inset:0,background:"rgba(13,17,23,.72)",zIndex:400,display:"flex",alignItems:"center",justifyContent:"center",padding:16,backdropFilter:"blur(8px)"}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div style={{background:"white",borderRadius:"var(--r-xl)",width:"100%",maxWidth:800,maxHeight:"94vh",overflowY:"auto",boxShadow:"var(--sh-xl)",animation:"slideUp .22s ease"}}>
      <div style={{padding:"13px 20px",borderBottom:"1px solid var(--bd)",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,background:"white",zIndex:1,borderRadius:"var(--r-xl) var(--r-xl) 0 0"}}>
        <div style={{display:"flex",alignItems:"center",gap:9}}><div style={{width:8,height:8,borderRadius:"50%",background:ac}}/><span style={{fontFamily:"Syne,sans-serif",fontWeight:800,fontSize:14.5}}>Preview — {inv.number}</span><Bdg st={inv.status}/></div>
        <div style={{display:"flex",gap:7}}><Btn v="ghost" sz="sm" onClick={onPrt}>{IC.prt}Print/PDF</Btn><Btn v="ghost" sz="sm" onClick={onClose}>✕ Close</Btn></div>
      </div>
      <div style={{padding:"36px 46px",fontFamily:"Inter,sans-serif"}}>
        {inv.logo&&<img src={inv.logo} style={{height:44,objectFit:"contain",marginBottom:10,display:"block"}} alt=""/>}
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:20,paddingBottom:15,borderBottom:"3px solid "+ac}}>
          <div><div style={{fontFamily:"Syne,sans-serif",fontWeight:900,fontSize:19,color:ac}}>{inv.from&&inv.from.name||biz.name||"Your Business"}</div><div style={{fontSize:12,color:"var(--gy)",marginTop:4,lineHeight:1.8}}>{(inv.from&&inv.from.address||"").split("\n").map((l,i)=><span key={i}>{l}<br/></span>)}</div>{inv.from&&inv.from.gstin&&<div style={{fontSize:11,color:"var(--dk3)",marginTop:2}}><b>GSTIN:</b> {inv.from.gstin}</div>}</div>
          <div style={{textAlign:"right"}}><div style={{fontFamily:"Syne,sans-serif",fontSize:22,fontWeight:900}}>{inv.type==="estimate"?"ESTIMATE":inv.type==="delivery"?"DELIVERY NOTE":inv.type==="po"?"PURCHASE ORDER":inv.type==="credit"?"CREDIT NOTE":inv.type==="debit"?"DEBIT NOTE":"TAX INVOICE"}</div><div style={{fontSize:12,color:"var(--gy)",marginTop:6,lineHeight:2}}><div>#{inv.number}</div><div>Date: {FD(inv.date,df)}</div>{inv.due&&<div style={{color:"var(--rd)"}}>Due: {FD(inv.due,df)}</div>}</div></div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:13,marginBottom:20}}>
          {[{l:"BILLED BY",d:inv.from},{l:"BILLED TO",d:inv.to}].map(({l,d})=><div key={l} style={{background:"var(--gy6)",padding:"12px 14px",borderRadius:"var(--r)",borderLeft:"3px solid "+ac}}>
            <div style={{fontSize:9.5,fontWeight:700,textTransform:"uppercase",letterSpacing:".7px",color:"var(--gy2)",marginBottom:4}}>{l}</div>
            <div style={{fontWeight:700,fontSize:13.5}}>{d&&d.name||"—"}</div>
            <div style={{fontSize:12,color:"var(--gy)",marginTop:3,lineHeight:1.7}}>{(d&&d.address||"").split("\n").join(", ")}{d&&d.gstin&&<><br/><b>GSTIN:</b> {d.gstin}</>}</div>
          </div>)}
        </div>
        <table style={{width:"100%",borderCollapse:"collapse",marginBottom:14,borderRadius:"var(--r)",overflow:"hidden"}}>
          <thead><tr style={{background:ac}}>{["Description","Qty","Rate",hD&&"Disc%",hC&&"CGST/SGST",hI&&"IGST","Amount"].filter(Boolean).map(h=><th key={h} style={{padding:"9px 10px",color:"white",fontSize:10.5,textTransform:"uppercase",textAlign:h==="Amount"||h==="Rate"?"right":"center",fontWeight:700}}>{h}</th>)}</tr></thead>
          <tbody>{(inv.items||[]).map((it,i)=>{const b=(+it.qty||0)*(+it.rate||0);const d=b*(+it.disc||0)/100;const cg=(b-d)*(+it.cgst||0)/100;const sg=(b-d)*(+it.sgst||0)/100;const ig=(b-d)*(+it.igst||0)/100;
            return <tr key={i} style={{background:i%2===0?"white":"var(--gy6)"}}>
              <td style={{padding:"9px 10px",borderBottom:"1px solid var(--bd)",fontSize:13}}><b>{it.desc}</b>{it.note&&<div style={{fontSize:11,color:"var(--gy2)",fontStyle:"italic"}}>{it.note}</div>}</td>
              <td style={{padding:"9px 10px",borderBottom:"1px solid var(--bd)",fontSize:12.5,textAlign:"center"}}>{it.qty} <span style={{color:"var(--gy2)"}}>{it.unit}</span></td>
              <td style={{padding:"9px 10px",borderBottom:"1px solid var(--bd)",fontSize:13,textAlign:"right"}}>{F(it.rate)}</td>
              {hD&&<td style={{padding:"9px 10px",borderBottom:"1px solid var(--bd)",fontSize:12,textAlign:"center",color:"var(--gn)"}}>{+it.disc||0}%</td>}

function Dash({invs,clis,exps,biz,onNew,onPrev}){
  const ii=invs.filter(i=>i.type==="invoice");
  const pd=ii.filter(i=>i.status==="paid").reduce((a,i)=>a+i.total,0);
  const out=ii.filter(i=>i.status==="unpaid"||i.status==="partial").reduce((a,i)=>a+i.total,0);
  const ov=ii.filter(i=>i.status==="overdue").reduce((a,i)=>a+i.total,0);
  const expT=exps.reduce((a,e)=>a+e.amount,0);const cur=biz.currency||"INR";
  const now=new Date();const mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const bars=Array.from({length:6},(_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-5+i,1);const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");return{label:mo[d.getMonth()],rev:ii.filter(x=>x.status==="paid"&&(x.date||"").startsWith(k)).reduce((a,x)=>a+x.total,0),exp:exps.filter(x=>(x.date||"").startsWith(k)).reduce((a,x)=>a+x.amount,0)};});
  const mx=Math.max(...bars.map(b=>Math.max(b.rev,b.exp)),1);
  const aging={a:0,b:0,c:0};ii.filter(i=>["overdue","unpaid"].includes(i.status)).forEach(i=>{const dy=Math.floor((Date.now()-new Date(i.date))/86400000);if(dy>90)aging.c+=i.total;else if(dy>60)aging.b+=i.total;else aging.a+=i.total;});
  return <div className="fu">
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:16}}>
      <Stat label="Revenue" value={INR(pd,cur)} sub={ii.filter(i=>i.status==="paid").length+" paid"} icon={IC.chart}/>
      <Stat label="Outstanding" value={INR(out,cur)} color="var(--yl)" sub={ii.filter(i=>i.status==="unpaid").length+" unpaid"}/>
      <Stat label="Overdue" value={INR(ov,cur)} color="var(--rd)" sub={ii.filter(i=>i.status==="overdue").length+" invoices"}/>
      <Stat label="Net Cash Flow" value={INR(pd-expT,cur)} color={(pd-expT)>=0?"var(--gn)":"var(--rd)"} sub="Revenue−Expenses"/>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 300px",gap:14,marginBottom:14}}>
      <Card>
        {MH("Recent Invoices")}
        <div style={{padding:"12px 18px"}}>
          {!ii.length?<div style={{textAlign:"center",padding:"32px 0",color:"var(--gy2)"}}><div style={{fontSize:36,marginBottom:8}}>📄</div><div style={{fontWeight:700,fontSize:14,color:"var(--dk3)",marginBottom:6}}>No invoices yet</div><Btn v="primary" onClick={()=>onNew("invoice")}>{IC.plus}Create First Invoice</Btn></div>:
          <table style={{width:"100%",borderCollapse:"collapse"}}><tbody>{ii.slice(0,8).map(inv=><tr key={inv.id} className="tr-h" onClick={()=>onPrev(inv)}>
            <td style={{padding:"8px 0",borderBottom:"1px solid var(--bd)",fontFamily:"Syne,sans-serif",fontWeight:800,color:"var(--or)",fontSize:12}}>{inv.number}</td>
            <td style={{padding:"8px 0",borderBottom:"1px solid var(--bd)",fontSize:12.5,fontWeight:500}}>{inv.to&&inv.to.name}</td>
            <td style={{padding:"8px 0",borderBottom:"1px solid var(--bd)",fontSize:12,color:"var(--gy2)"}}>{FD(inv.date,biz.dateFormat)}</td>
            <td style={{padding:"8px 0",borderBottom:"1px solid var(--bd)",fontFamily:"Syne,sans-serif",fontWeight:700,fontSize:13}}>{INR(inv.total,cur)}</td>
            <td style={{padding:"8px 0",borderBottom:"1px solid var(--bd)"}}><Bdg st={inv.status}/></td>
          </tr>)}</tbody></table>}
        </div>
      </Card>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Card>
          {MH("Revenue vs Expenses")}
          <div style={{padding:"12px 14px"}}>
            <div style={{display:"flex",alignItems:"flex-end",gap:4,height:68,marginBottom:7}}>
              {bars.map((b,i)=><div key={i} style={{flex:1,display:"flex",flexDirection:"column",gap:2,alignItems:"center"}}>
                <div style={{width:"100%",display:"flex",gap:2,alignItems:"flex-end",height:58}}>
                  <div style={{flex:1,background:i===5?"var(--or)":"var(--orl)",borderRadius:"3px 3px 0 0",minHeight:3,height:Math.max(3,b.rev/mx*54)+"px"}}/>
                  <div style={{flex:1,background:i===5?"var(--rd)":"#ffe4e4",borderRadius:"3px 3px 0 0",minHeight:3,height:Math.max(3,b.exp/mx*54)+"px",opacity:.8}}/>
                </div>
                <div style={{fontSize:9,color:"var(--gy2)",fontWeight:600}}>{b.label}</div>
              </div>)}
            </div>
            <div style={{display:"flex",gap:12,fontSize:11,color:"var(--gy)"}}><span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:8,height:8,background:"var(--or)",borderRadius:2,display:"inline-block"}}/>Rev</span><span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:8,height:8,background:"var(--rd)",borderRadius:2,opacity:.8,display:"inline-block"}}/>Exp</span></div>
          </div>
        </Card>
        <Card>
          {MH("Invoice Aging")}
          <div style={{padding:"10px 14px"}}>
            {[["0–30d",aging.a,"var(--yl)"],["31–60d",aging.b,"var(--or)"],["60d+",aging.c,"var(--rd)"]].map(([l,v,c])=><div key={l} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid var(--bd)",alignItems:"center"}}><div style={{display:"flex",alignItems:"center",gap:7}}><div style={{width:8,height:8,borderRadius:"50%",background:c}}/><span style={{fontSize:12.5}}>{l}</span></div><span style={{fontWeight:700,fontSize:13,color:c,fontFamily:"Syne,sans-serif"}}>{INR(v,cur)}</span></div>)}
          </div>
        </Card>
      </div>
    </div>
    <Card style={{marginBottom:14}}>
      {MH("Quick Actions")}
      <div style={{padding:"14px 18px",display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
        {[{l:"New Invoice",t:"invoice",c:"var(--or)",ic:"🧾",d:"Tax invoice"},{l:"New Estimate",t:"estimate",c:"var(--bl)",ic:"📋",d:"Quote client"},{l:"Delivery Note",t:"delivery",c:"var(--gn)",ic:"🚚",d:"Dispatch doc"},{l:"Purchase Order",t:"po",c:"var(--pu)",ic:"📦",d:"Order vendor"}].map(a=><button key={a.l} onClick={()=>onNew(a.t)} style={{padding:"14px 10px",border:"1.5px solid "+a.c+"22",borderRadius:"var(--r-md)",cursor:"pointer",background:a.c+"11",textAlign:"left",transition:"all .2s",fontFamily:"Inter,sans-serif"}} onMouseEnter={e=>{e.currentTarget.style.background=a.c+"22";e.currentTarget.style.transform="translateY(-2px)";}} onMouseLeave={e=>{e.currentTarget.style.background=a.c+"11";e.currentTarget.style.transform="";}}>
          <div style={{fontSize:20,marginBottom:5}}>{a.ic}</div>
          <div style={{fontWeight:700,fontSize:13,color:"var(--dk)",marginBottom:2}}>{a.l}</div>
          <div style={{fontSize:11,color:"var(--gy2)"}}>{a.d}</div>
        </button>)}
      </div>
    </Card>
    <div className="ad nopr" style={{height:66}}>Bottom Advertisement</div>
  </div>;
}

function AIAgent({onClose,biz,clis,prods,invs,toast,onGen,onAct}){

// ═══════════════ GSTIN VALIDATOR ═══════════════
function GSTINValidator({ onClose }) {
  const [g, setG] = useState('');
  const [res, setRes] = useState(null);
  const [loading, setLoading] = useState(false);
  const validate = async () => {
    if (g.length !== 15) { setRes({ ok: false, msg: 'GSTIN must be exactly 15 characters.' }); return; }
    const regex = /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$/;
    if (!regex.test(g.toUpperCase())) { setRes({ ok: false, msg: 'Invalid GSTIN format.' }); return; }
    const stateCode = parseInt(g.slice(0, 2));
    const states = { 1: 'Jammu & Kashmir', 2: 'Himachal Pradesh', 3: 'Punjab', 4: 'Chandigarh', 5: 'Uttarakhand', 6: 'Haryana', 7: 'Delhi', 8: 'Rajasthan', 9: 'Uttar Pradesh', 10: 'Bihar', 11: 'Sikkim', 12: 'Arunachal Pradesh', 13: 'Nagaland', 14: 'Manipur', 15: 'Mizoram', 16: 'Tripura', 17: 'Meghalaya', 18: 'Assam', 19: 'West Bengal', 20: 'Jharkhand', 21: 'Odisha', 22: 'Chhattisgarh', 23: 'Madhya Pradesh', 24: 'Gujarat', 26: 'Daman & Diu', 27: 'Maharashtra', 28: 'Andhra Pradesh', 29: 'Karnataka', 30: 'Goa', 31: 'Lakshadweep', 32: 'Kerala', 33: 'Tamil Nadu', 34: 'Puducherry', 35: 'Andaman & Nicobar', 36: 'Telangana', 37: 'Andhra Pradesh (New)' };
    const pan = g.slice(2, 12);
    const entityType = { P: 'Individual/Proprietor', C: 'Company', H: 'Hindu Undivided Family', F: 'Firm/Partnership', A: 'AOP/BOI', T: 'Trust/AJP', B: 'Body of Individuals', L: 'Local Authority', J: 'Artificial Juridical Person', G: 'Government' }[g[5]] || 'Unknown';
    setRes({ ok: true, state: states[stateCode] || 'Unknown State (' + stateCode + ')', pan, entityType, gst: g.toUpperCase() });
  };
  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(13,17,23,.7)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16, backdropFilter: 'blur(8px)' }} onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ background: 'white', borderRadius: 'var(--r-xl)', width: '100%', maxWidth: 480, boxShadow: 'var(--sh-xl)', animation: 'slideUp .2s ease' }}>
        <div style={{ padding: '20px 22px 0', display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 18 }}>
          <div style={{ fontFamily: 'Syne,sans-serif', fontWeight: 800, fontSize: 17 }}>🔍 GSTIN Validator</div>
          <button onClick={onClose} style={{ background: 'var(--gy5)', border: 'none', width: 28, height: 28, borderRadius: '50%', cursor: 'pointer', fontSize: 14 }}>✕</button>
        </div>
        <div style={{ padding: '0 22px 22px' }}>
          <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
            <input value={g} onChange={e => setG(e.target.value.toUpperCase())} maxLength={15} placeholder="Enter GSTIN (e.g. 27AAAPZ2357J1ZW)" style={{ flex: 1, padding: '10px 13px', border: '1.5px solid var(--bd)', borderRadius: 'var(--r-sm)', fontSize: 13, fontFamily: 'Inter,sans-serif', outline: 'none', letterSpacing: 1 }} onFocus={e => e.target.style.borderColor = 'var(--or)'} onBlur={e => e.target.style.borderColor = 'var(--bd)'} />
            <Btn v="primary" onClick={validate}>Validate</Btn>
          </div>
          {res && (
            <div style={{ padding: '16px', borderRadius: 'var(--r-md)', background: res.ok ? 'var(--gnl)' : 'var(--rdl)', border: `1.5px solid ${res.ok ? 'var(--gn)' : 'var(--rd)'}` }}>
              {res.ok ? (
                <>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12, fontWeight: 700, fontSize: 14, color: 'var(--gn)' }}>✅ Valid GSTIN</div>
                  {[['GSTIN', res.gst], ['State', res.state], ['PAN', res.pan], ['Entity Type', res.entityType]].map(([k, v]) => (
                    <div key={k} style={{ display: 'flex', justifyContent: 'space-between', padding: '5px 0', fontSize: 13, borderBottom: '1px solid rgba(0,0,0,.06)' }}>
                      <span style={{ color: 'var(--gy)' }}>{k}</span><span style={{ fontWeight: 600 }}>{v}</span>
                    </div>
                  ))}
                </>
              ) : <div style={{ color: 'var(--rd)', fontWeight: 600, fontSize: 13 }}>❌ {res.msg}</div>}
            </div>
          )}
          <div style={{ marginTop: 14, fontSize: 12, color: 'var(--gy2)', lineHeight: 1.6 }}>
            ℹ️ Format: 2-digit state code + 10-digit PAN + 1 entity + Z + 1 checksum (e.g. <b>27AAAPZ2357J1ZW</b>)
          </div>
        </div>
      </div>
    </div>
  );
}

// ═══════════════ CSV IMPORT ═══════════════
function CSVImport({ type, onImport, onClose, toast }) {
  const [preview, setPreview] = useState([]);
  const [headers, setHeaders] = useState([]);
  const [mapping, setMapping] = useState({});
  const fRef = useRef();

  const clientFields = ['name', 'company', 'email', 'phone', 'address', 'gstin', 'pan', 'state'];
  const productFields = ['name', 'desc', 'rate', 'unit', 'hsn', 'cgst', 'sgst', 'category', 'sku', 'stock'];
  const fields = type === 'clients' ? clientFields : productFields;

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const text = ev.target.result;
      const rows = text.split('\n').filter(r => r.trim());
      const hdrs = rows[0].split(',').map(h => h.trim().replace(/"/g, ''));
      const data = rows.slice(1, 6).map(r => r.split(',').map(c => c.trim().replace(/"/g, '')));
      setHeaders(hdrs);
      setPreview(data);
      const auto = {};
      fields.forEach(f => {
        const match = hdrs.find(h => h.toLowerCase().includes(f.toLowerCase()) || f.toLowerCase().includes(h.toLowerCase()));
        if (match) auto[f] = match;
      });
      setMapping(auto);
    };
    reader.readAsText(file);
  };

  const doImport = () => {
    const file = fRef.current.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const text = ev.target.result;
      const rows = text.split('\n').filter(r => r.trim());
      const hdrs = rows[0].split(',').map(h => h.trim().replace(/"/g, ''));
      const items = rows.slice(1).filter(r => r.trim()).map(r => {
        const cols = r.split(',').map(c => c.trim().replace(/"/g, ''));
        const obj = { id: UID() };
        Object.entries(mapping).forEach(([field, header]) => {
          const idx = hdrs.indexOf(header);
          if (idx >= 0) obj[field] = cols[idx] || '';
        });
        if (obj.rate) obj.rate = parseFloat(obj.rate) || 0;
        if (obj.cgst) obj.cgst = parseFloat(obj.cgst) || 9;
        if (obj.sgst) obj.sgst = parseFloat(obj.sgst) || 9;
        if (obj.stock) obj.stock = parseInt(obj.stock) || 0;
        return obj;
      }).filter(o => o.name);
      onImport(items);
      toast(`Imported ${items.length} ${type}!`, 'success');
      onClose();
    };
    reader.readAsText(file);
  };

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(13,17,23,.7)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16, backdropFilter: 'blur(8px)' }} onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ background: 'white', borderRadius: 'var(--r-xl)', width: '100%', maxWidth: 580, maxHeight: '90vh', overflowY: 'auto', boxShadow: 'var(--sh-xl)', animation: 'slideUp .2s ease' }}>
        <div style={{ padding: '20px 22px 0', display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
          <div style={{ fontFamily: 'Syne,sans-serif', fontWeight: 800, fontSize: 17 }}>📥 Import {type === 'clients' ? 'Clients' : 'Products'} from CSV/Excel</div>
          <button onClick={onClose} style={{ background: 'var(--gy5)', border: 'none', width: 28, height: 28, borderRadius: '50%', cursor: 'pointer', fontSize: 14 }}>✕</button>
        </div>
        <div style={{ padding: '0 22px 22px' }}>
          <div style={{ padding: '14px 16px', background: 'var(--bll)', borderRadius: 'var(--r-md)', marginBottom: 16, fontSize: 13, color: 'var(--bl)', lineHeight: 1.6 }}>
            💡 Export your {type} from Excel/Tally/any app as CSV, then upload here. We'll auto-match the columns.
          </div>
          <input ref={fRef} type="file" accept=".csv,.txt" onChange={handleFile} style={{ marginBottom: 16, fontSize: 13 }} />
          {headers.length > 0 && <>
            <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 10, color: 'var(--dk)' }}>Map Columns to Fields:</div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 16 }}>
              {fields.map(f => (
                <div key={f} style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                  <label style={{ fontSize: 11, fontWeight: 600, color: 'var(--dk3)', textTransform: 'capitalize' }}>{f}</label>
                  <select value={mapping[f] || ''} onChange={e => setMapping(p => ({ ...p, [f]: e.target.value }))} style={{ padding: '6px 9px', border: '1.5px solid var(--bd)', borderRadius: 'var(--r-sm)', fontSize: 12, fontFamily: 'Inter,sans-serif', outline: 'none', background: 'white' }}>
                    <option value="">— Skip —</option>
                    {headers.map(h => <option key={h} value={h}>{h}</option>)}
                  </select>
                </div>
              ))}
            </div>
            {preview.length > 0 && <>
              <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 8 }}>Preview (first 5 rows):</div>
              <div style={{ overflowX: 'auto', marginBottom: 16 }}>
                <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 11.5 }}>
                  <thead><tr>{headers.map(h => <th key={h} style={{ background: 'var(--gy6)', padding: '6px 8px', textAlign: 'left', fontWeight: 600, border: '1px solid var(--bd)' }}>{h}</th>)}</tr></thead>
                  <tbody>{preview.map((r, i) => <tr key={i}>{r.map((c, j) => <td key={j} style={{ padding: '5px 8px', border: '1px solid var(--bd)', color: 'var(--gy)' }}>{c}</td>)}</tr>)}</tbody>
                </table>
              </div>
            </>}
            <div style={{ display: 'flex', gap: 8 }}>
              <Btn v="ghost" onClick={onClose}>Cancel</Btn>
              <Btn v="primary" onClick={doImport} style={{ flex: 1, justifyContent: 'center' }}>📥 Import {type === 'clients' ? 'Clients' : 'Products'}</Btn>
            </div>
          </>}
        </div>
      </div>
    </div>
  );
}

// ═══════════════ STOCK TRACKER ALERT ═══════════════
function checkStock(prods, invItems) {
  const warnings = [];
  (invItems || []).forEach(it => {
    const prod = prods.find(p => p.name === it.desc);
    if (prod && prod.stock !== '' && prod.stock !== undefined) {
      const remaining = (parseInt(prod.stock) || 0) - (parseInt(it.qty) || 0);
      if (remaining < 5) warnings.push(`⚠️ Low stock: "${prod.name}" — only ${remaining} left after this invoice.`);
    }
  });
  return warnings;
}

// ═══════════════ INVOICE EXPIRY COUNTDOWN ═══════════════
function ExpiryBadge({ due }) {
  if (!due) return null;
  const days = Math.ceil((new Date(due) - Date.now()) / 86400000);
  if (days < 0) return <span style={{ background: 'var(--rdl)', color: 'var(--rd)', padding: '2px 9px', borderRadius: 100, fontSize: 11, fontWeight: 700 }}>Expired {Math.abs(days)}d ago</span>;
  if (days === 0) return <span style={{ background: '#fff3cd', color: '#856404', padding: '2px 9px', borderRadius: 100, fontSize: 11, fontWeight: 700 }}>⏰ Expires Today</span>;
  if (days <= 3) return <span style={{ background: '#fff3cd', color: '#856404', padding: '2px 9px', borderRadius: 100, fontSize: 11, fontWeight: 700 }}>⏰ Expires in {days}d</span>;
  return null;
}

// ═══════════════ BUSINESS CARD SCANNER ═══════════════
function BizCardScanner({ onSave, onClose, toast }) {
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const imgRef = useRef();

  const scan = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setLoading(true);
    const reader = new FileReader();
    reader.onload = async (ev) => {
      const b64 = ev.target.result.split(',')[1];
      try {
        const res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 500, messages: [{ role: 'user', content: [{ type: 'image', source: { type: 'base64', media_type: file.type, data: b64 } }, { type: 'text', text: 'Extract all info from this business card. Respond ONLY with JSON: {"name":"","company":"","email":"","phone":"","address":"","gstin":"","website":""}. Leave blank if not found.' }] }] }) });
        const d = await res.json();
        const txt = d.content?.[0]?.text || '{}';
        const jm = txt.match(/\{[\s\S]*\}/);
        if (jm) setResult(JSON.parse(jm[0]));
        else toast('Could not read card. Try a clearer photo.', 'error');
      } catch { toast('Scan failed. Try again.', 'error'); }
      setLoading(false);
    };
    reader.readAsDataURL(file);
  };

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(13,17,23,.7)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16, backdropFilter: 'blur(8px)' }} onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ background: 'white', borderRadius: 'var(--r-xl)', width: '100%', maxWidth: 480, boxShadow: 'var(--sh-xl)', animation: 'slideUp .2s ease' }}>
        <div style={{ padding: '20px 22px 0', display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
          <div style={{ fontFamily: 'Syne,sans-serif', fontWeight: 800, fontSize: 17 }}>📇 Business Card Scanner</div>
          <button onClick={onClose} style={{ background: 'var(--gy5)', border: 'none', width: 28, height: 28, borderRadius: '50%', cursor: 'pointer', fontSize: 14 }}>✕</button>
        </div>
        <div style={{ padding: '0 22px 22px' }}>
          {!result && !loading && <>
            <div style={{ padding: '28px', background: 'var(--gy5)', borderRadius: 'var(--r-md)', textAlign: 'center', marginBottom: 16, border: '2px dashed var(--gy3)', cursor: 'pointer' }} onClick={() => imgRef.current.click()}>
              <div style={{ fontSize: 40, marginBottom: 10 }}>📷</div>
              <div style={{ fontWeight: 700, fontSize: 14, color: 'var(--dk)', marginBottom: 5 }}>Take Photo or Upload Business Card</div>
              <div style={{ fontSize: 12.5, color: 'var(--gy2)' }}>AI will read name, phone, email, GSTIN automatically</div>
            </div>
            <input ref={imgRef} type="file" accept="image/*" capture="environment" onChange={scan} style={{ display: 'none' }} />
            <Btn v="primary" style={{ width: '100%', justifyContent: 'center' }} onClick={() => imgRef.current.click()}>📷 Scan Business Card</Btn>
          </>}
          {loading && <div style={{ textAlign: 'center', padding: '32px 0' }}>
            <div style={{ display: 'flex', gap: 7, justifyContent: 'center', marginBottom: 14 }}><div className="dot" /><div className="dot" /><div className="dot" /></div>
            <div style={{ fontSize: 14, color: 'var(--gy)', fontWeight: 500 }}>AI is reading the business card…</div>
          </div>}
          {result && <>
            <div style={{ background: 'var(--gnl)', border: '1.5px solid var(--gn)', borderRadius: 'var(--r-md)', padding: 16, marginBottom: 16 }}>
              <div style={{ fontWeight: 700, fontSize: 13, color: 'var(--gn)', marginBottom: 10 }}>✅ Card scanned successfully!</div>
              {Object.entries(result).filter(([, v]) => v).map(([k, v]) => (
                <div key={k} style={{ display: 'flex', gap: 10, padding: '4px 0', fontSize: 13, borderBottom: '1px solid rgba(0,0,0,.06)' }}>
                  <span style={{ color: 'var(--gy)', textTransform: 'capitalize', minWidth: 70 }}>{k}</span>
                  <span style={{ fontWeight: 600 }}>{v}</span>
                </div>
              ))}
            </div>
            <div style={{ display: 'flex', gap: 8 }}>
              <Btn v="ghost" onClick={() => setResult(null)}>Try Again</Btn>
              <Btn v="primary" style={{ flex: 1, justifyContent: 'center' }} onClick={() => { onSave(result); toast('Client saved from business card!', 'success'); onClose(); }}>✅ Save as Client</Btn>
            </div>
          </>}
        </div>
      </div>
    </div>
  );
}

// ═══════════════ PWA INSTALL PROMPT ═══════════════
function PWAInstallBanner({ onDismiss }) {
  const [deferredPrompt, setDP] = useState(null);
  const [show, setShow] = useState(false);
  useEffect(() => {
    const handler = (e) => { e.preventDefault(); setDP(e); setShow(true); };
    window.addEventListener('beforeinstallprompt', handler);
    return () => window.removeEventListener('beforeinstallprompt', handler);
  }, []);
  if (!show) return null;
  const install = async () => {
    if (deferredPrompt) { deferredPrompt.prompt(); const { outcome } = await deferredPrompt.userChoice; if (outcome === 'accepted') { setShow(false); onDismiss(); } }
  };
  return (
    <div style={{ position: 'fixed', bottom: 100, left: 16, right: 16, zIndex: 500, background: 'var(--dk)', borderRadius: 'var(--r-md)', padding: '14px 18px', display: 'flex', alignItems: 'center', gap: 12, boxShadow: 'var(--sh-xl)', animation: 'slideUp .3s ease' }}>
      <span style={{ fontSize: 28, flexShrink: 0 }}>📱</span>
      <div style={{ flex: 1 }}>
        <div style={{ color: 'white', fontWeight: 700, fontSize: 14, marginBottom: 2 }}>Install InvoiceBolt</div>
        <div style={{ color: 'rgba(255,255,255,.55)', fontSize: 12 }}>Works offline · No app store needed · Free forever</div>
      </div>
      <Btn v="primary" sz="sm" onClick={install}>Install</Btn>
      <button onClick={() => setShow(false)} style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,.4)', cursor: 'pointer', fontSize: 18, flexShrink: 0 }}>✕</button>
    </div>
  );
}

// ═══════════════ PUBLIC INVOICE VIEWER ═══════════════
function PublicInvoiceViewer({ tpl }) {
  const params = new URLSearchParams(window.location.search);
  const viewParam = params.get('view');
  if (!viewParam) return null;
  try {
    const inv = JSON.parse(decodeURIComponent(atob(viewParam)));
    return (
      <div style={{ padding: 24, maxWidth: 800, margin: '80px auto 40px' }}>
        <div style={{ textAlign: 'center', marginBottom: 24 }}>
          <div style={{ fontFamily: 'Syne,sans-serif', fontWeight: 900, fontSize: 20, color: 'var(--or)', marginBottom: 6 }}>InvoiceBolt</div>
          <div style={{ fontSize: 13, color: 'var(--gy2)' }}>Secure Invoice View · invoicebolt.in</div>
        </div>
        <PrevMod inv={inv} tpl={tpl || 'Classic'} biz={{}} onClose={() => window.history.back()} onPrt={() => { const w = window.open('', '_blank'); w.document.write(buildHTML(inv, tpl, 'DD/MM/YYYY')); w.document.close(); setTimeout(() => w.print(), 700); }} />
      </div>
    );
  } catch { return null; }
}

// ── QUICK INVOICE ──
function QuickInvoice({biz,clis,invs,onSave,toast,onClose}){
  const [client,setClient]=useState('');const [amount,setAmount]=useState('');const [gst,setGst]=useState(18);const [desc,setDesc]=useState('Services');
  const nums=invs.map(i=>parseInt((i.number||'').replace(/\D/g,''))||0);
  const nextNum='INV-'+String((nums.length?Math.max(...nums):0)+1).padStart(3,'0');
  const base=parseFloat(amount)||0;const tax=base*gst/100;const total=base+tax;
  const save=()=>{
    if(!client||!amount){toast('Enter client and amount.','error');return;}
    const cli=clis.find(c=>c.name.toLowerCase().includes(client.toLowerCase()));
    const cgstR=gst/2;const sgstR=gst/2;const cg=base*cgstR/100;const sg=base*sgstR/100;
    const inv={id:UID(),number:nextNum,type:'invoice',date:TD(),due:AD(TD(),30),status:'unpaid',currency:biz.currency||'INR',gstType:'cgst_sgst',createdAt:Date.now(),
      from:{name:biz.name,email:biz.email,phone:biz.phone,address:biz.address,gstin:biz.gstin,pan:biz.pan},
      to:{name:cli?.name||client,email:cli?.email||'',phone:cli?.phone||'',address:cli?.address||'',gstin:cli?.gstin||''},
      items:[{id:UID(),desc:desc||'Services',qty:1,rate:base,unit:'pcs',hsn:'',cgst:cgstR,sgst:sgstR,igst:0,disc:0,note:''}],
      notes:biz.defaultNotes||'',footer:biz.footer||'Thank you!',bankName:biz.bankName||'',bankAcc:biz.bankAcc||'',bankIFSC:biz.bankIFSC||'',upi:biz.upi||'',
      logo:biz.logo||'',signature:biz.signature||'',po:'',shipping:0,paid:0,
      sub:base,subtotal:base,totalCGST:cg,totalSGST:sg,totalIGST:0,totalDiscount:0,total,grand:total,bal:total,dc:0,cg,sg,ig:0};
    onSave(inv);onClose();
  };
  return <div style={{position:'fixed',inset:0,background:'rgba(13,17,23,.75)',zIndex:600,display:'flex',alignItems:'center',justifyContent:'center',padding:16,backdropFilter:'blur(10px)'}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div style={{background:'white',borderRadius:'var(--r-xl)',width:'100%',maxWidth:400,boxShadow:'var(--sh-xl)',animation:'slideUp .2s ease',overflow:'hidden'}}>
      <div style={{background:'var(--or)',padding:'18px 22px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{fontFamily:'Syne,sans-serif',fontWeight:900,fontSize:17,color:'white'}}>⚡ Quick Invoice</div>
        <button onClick={onClose} style={{background:'rgba(255,255,255,.2)',border:'none',color:'white',width:28,height:28,borderRadius:'50%',cursor:'pointer',fontSize:14}}>✕</button>
      </div>
      <div style={{padding:22}}>
        <div style={{marginBottom:12}}><label style={{fontSize:11,fontWeight:700,color:'var(--gy)',textTransform:'uppercase',display:'block',marginBottom:5}}>Client Name</label>
          <Inp value={client} onChange={e=>setClient(e.target.value)} placeholder="Type client name…" style={{fontSize:14}}/></div>
        <div style={{marginBottom:12}}><label style={{fontSize:11,fontWeight:700,color:'var(--gy)',textTransform:'uppercase',display:'block',marginBottom:5}}>Description</label>
          <Inp value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Services provided" style={{fontSize:13}}/></div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:16}}>
          <div><label style={{fontSize:11,fontWeight:700,color:'var(--gy)',textTransform:'uppercase',display:'block',marginBottom:5}}>Amount (₹)</label>
            <Inp type="number" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="25000" style={{fontSize:15,fontWeight:700}}/></div>
          <div><label style={{fontSize:11,fontWeight:700,color:'var(--gy)',textTransform:'uppercase',display:'block',marginBottom:5}}>GST %</label>
            <Sl value={gst} onChange={e=>setGst(+e.target.value)}>{[0,5,12,18,28].map(r=><option key={r} value={r}>{r}%</option>)}</Sl></div>
        </div>
        {base>0&&<div style={{background:'var(--orl)',border:'1.5px solid var(--orb)',borderRadius:'var(--r-md)',padding:'12px 14px',marginBottom:14}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--gy)',marginBottom:3}}><span>Subtotal</span><span>{INR(base)}</span></div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--gy)',marginBottom:5}}><span>GST {gst}%</span><span>{INR(tax)}</span></div>
          <div style={{display:'flex',justifyContent:'space-between',fontFamily:'Syne,sans-serif',fontWeight:900,fontSize:19,color:'var(--or)'}}><span>Total</span><span>{INR(total)}</span></div>
        </div>}
        <button onClick={save} style={{width:'100%',padding:13,background:'var(--or)',color:'white',border:'none',borderRadius:'var(--r-md)',fontFamily:'Syne,sans-serif',fontWeight:900,fontSize:16,cursor:'pointer',boxShadow:'0 5px 18px rgba(255,107,53,.4)'}}>
          ⚡ Create {nextNum}
        </button>
      </div>
    </div>
  </div>;
}

// ── GST CALCULATOR ──
function GSTCalc({onClose}){
  const [amt,setAmt]=useState('');const [rate,setRate]=useState(18);const [incl,setIncl]=useState(false);
  const base=incl?parseFloat(amt||0)/(1+rate/100):parseFloat(amt||0);
  const tax=base*rate/100;const cgst=tax/2;const total=base+tax;
  return <div style={{position:'fixed',inset:0,background:'rgba(13,17,23,.7)',zIndex:500,display:'flex',alignItems:'center',justifyContent:'center',padding:16,backdropFilter:'blur(8px)'}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div style={{background:'white',borderRadius:'var(--r-xl)',width:'100%',maxWidth:360,boxShadow:'var(--sh-xl)',animation:'slideUp .2s ease'}}>
      <div style={{padding:'16px 20px',borderBottom:'1px solid var(--bd)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:16}}>🧮 GST Calculator</div>
        <button onClick={onClose} style={{background:'var(--gy5)',border:'none',width:28,height:28,borderRadius:'50%',cursor:'pointer',fontSize:13}}>✕</button>
      </div>
      <div style={{padding:'18px 20px'}}>
        <div style={{marginBottom:12}}><label style={{fontSize:11,fontWeight:700,color:'var(--gy)',textTransform:'uppercase',display:'block',marginBottom:5}}>Amount (₹)</label>
          <Inp type="number" value={amt} onChange={e=>setAmt(e.target.value)} placeholder="Enter amount…" style={{fontSize:17,fontWeight:700,padding:'11px 13px'}}/></div>
        <div style={{display:'flex',gap:10,marginBottom:14,alignItems:'center'}}>
          <div style={{flex:1}}><label style={{fontSize:11,fontWeight:700,color:'var(--gy)',textTransform:'uppercase',display:'block',marginBottom:5}}>GST Rate</label>
            <Sl value={rate} onChange={e=>setRate(+e.target.value)}>{[0,0.25,1,3,5,12,18,28].map(r=><option key={r} value={r}>{r}%</option>)}</Sl></div>
          <label style={{display:'flex',alignItems:'center',gap:7,cursor:'pointer',fontSize:13,fontWeight:500,paddingTop:18}}>
            <label className="tg"><input type="checkbox" checked={incl} onChange={e=>setIncl(e.target.checked)}/><span className="tgl"/></label>Inclusive
          </label>
        </div>
        {amt>0&&<div style={{background:'var(--gy5)',borderRadius:'var(--r-md)',padding:14,marginBottom:12}}>
          {[['Base Amount',INR(base)],['CGST '+(rate/2)+'%',INR(cgst)],['SGST '+(rate/2)+'%',INR(cgst)],['Total GST',INR(tax)]].map(([l,v])=>(
            <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'5px 0',fontSize:13,borderBottom:'1px solid var(--bd)'}}><span style={{color:'var(--gy)'}}>{l}</span><span style={{fontWeight:600}}>{v}</span></div>
          ))}
          <div style={{display:'flex',justifyContent:'space-between',padding:'10px 0 0',fontFamily:'Syne,sans-serif',fontWeight:900,fontSize:19,color:'var(--or)'}}><span>Total</span><span>{INR(incl?parseFloat(amt||0):total)}</span></div>
        </div>}
        <div style={{display:'flex',gap:8}}>
          <button onClick={()=>setAmt('')} style={{flex:1,padding:9,background:'var(--gy5)',border:'1px solid var(--bd)',borderRadius:'var(--r-sm)',cursor:'pointer',fontFamily:'Inter,sans-serif',fontWeight:600,fontSize:13}}>Clear</button>
          <button onClick={()=>navigator.clipboard.writeText(`Base: ${INR(base)}, GST: ${INR(tax)}, Total: ${INR(total)}`)} style={{flex:1,padding:9,background:'var(--or)',border:'none',borderRadius:'var(--r-sm)',cursor:'pointer',color:'white',fontFamily:'Inter,sans-serif',fontWeight:700,fontSize:13}}>📋 Copy</button>
        </div>
      </div>
    </div>
  </div>;
}

// ── KHATA BOOK ──
function KhataPage({clis,invs,biz}){
  const [sel,setSel]=useState(null);const cur=biz.currency||'INR';
  if(sel){
    const ci=invs.filter(i=>i.to?.name===sel.name);
    const total=ci.reduce((a,i)=>a+i.total,0);
    const paid2=ci.filter(i=>i.status==='paid').reduce((a,i)=>a+i.total,0);
    return <div className="fu">
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
        <Btn v="ghost" sz="sm" onClick={()=>setSel(null)}>← Back</Btn>
        <div style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:17}}>📒 {sel.name}</div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:16}}>
        {[['Total Billed',INR(total,cur),'var(--dk)'],['Received',INR(paid2,cur),'var(--gn)'],['Balance',INR(total-paid2,cur),total-paid2>0?'var(--rd)':'var(--gn)']].map(([l,v,c])=>(
          <div key={l} style={{background:'white',padding:'13px 15px',borderRadius:'var(--r-md)',border:'1px solid var(--bd)'}}>

            <div style={{fontFamily:'Syne,sans-serif',fontWeight:900,fontSize:17,color:c}}>{v}</div>
          </div>
        ))}
      </div>
      <Card>{ci.length===0?<div style={{padding:32,textAlign:'center',color:'var(--gy2)'}}>No transactions yet.</div>:ci.map((i,idx)=>(
        <div key={i.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'11px 16px',borderBottom:'1px solid var(--bd)',background:idx%2===0?'white':'var(--gy6)'}}>
          <div><div style={{fontWeight:600,fontSize:13}}>{i.number}</div><div style={{fontSize:11,color:'var(--gy2)'}}>{FD(i.date,biz.dateFormat)} · <span style={{color:i.status==='paid'?'var(--gn)':'var(--rd)',fontWeight:600,textTransform:'capitalize'}}>{i.status}</span></div></div>
          <div style={{textAlign:'right'}}><div style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:14}}>{INR(i.total,cur)}</div>{i.status==='paid'&&<div style={{fontSize:10,color:'var(--gn)'}}>✓ Paid</div>}</div>
        </div>
      ))}</Card>
    </div>;
  }
  return <div className="fu">
    <div style={{marginBottom:16}}><div style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:19}}>📒 Khata Book</div><div style={{fontSize:13,color:'var(--gy2)'}}>Traditional ledger per client</div></div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:12}}>
      {!clis.length?<div style={{gridColumn:'1/-1',textAlign:'center',padding:40,color:'var(--gy2)'}}>No clients yet.</div>:
        clis.map(c=>{const ci2=invs.filter(i=>i.to?.name===c.name);const bal=ci2.reduce((a,i)=>a+(i.status==='paid'?0:i.total),0);
        return <div key={c.id} onClick={()=>setSel(c)} style={{background:'white',border:'1.5px solid var(--bd)',borderRadius:'var(--r-md)',padding:16,cursor:'pointer',transition:'all .2s'}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--or)';e.currentTarget.style.transform='translateY(-2px)';}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--bd)';e.currentTarget.style.transform='';}}>
          <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:10}}>
            <div style={{width:36,height:36,borderRadius:'var(--r)',background:'var(--orl)',color:'var(--or)',fontWeight:900,fontSize:13,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Syne,sans-serif'}}>{INI(c.name)}</div>
            <div style={{fontWeight:700,fontSize:13}}>{c.name}</div>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',paddingTop:8,borderTop:'1px solid var(--bd)'}}>
            <span style={{fontSize:11,color:'var(--gy2)'}}>Balance</span>
            <span style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:14,color:bal>0?'var(--rd)':'var(--gn)'}}>{INR(bal,cur)}</span>
          </div>
        </div>;})}
    </div>
  </div>;
}
